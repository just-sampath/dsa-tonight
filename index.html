DSA.topics.push({
  id: "kruskal",
  unit: 25,
  title: "Kruskal's Algorithm",
  tagline: "Sort the edges, take the cheapest ones that make no cycle",
  minutes: 30,
  analogy: `<p>Imagine a contractor with a list of every possible road between villages and its cost. The contractor sorts the list from cheapest to costliest and goes down it: "Build this road, unless the two villages are already connected some other way." Any road between villages that can already reach each other would be wasted money.</p>
<p>At first there are many separate little groups of connected villages (like separate cricket teams). Every accepted road merges two teams into one. When everyone is in one team, the job is done.</p>`,
  learn: `<h3>1. The idea</h3>
<div class="def">Kruskal's algorithm finds a Minimum Spanning Tree by sorting all edges in increasing order of weight and adding them one by one, skipping any edge that would form a cycle, until V - 1 edges are chosen.</div>
<p>Unlike Prim's, Kruskal's does not grow one tree. In the middle of the algorithm the chosen edges form a <b>forest</b> (several separate trees). These pieces merge until one tree remains.</p>
<p>It is also a <b>greedy</b> algorithm: it always takes the cheapest edge that is still allowed.</p>

<h3>2. Algorithm steps</h3>
<pre class="code">KRUSKAL(G)
1. Sort all edges in increasing order of weight
   (ties: alphabetically smaller edge first)
2. Make each vertex its own set (component)
3. MST = { }, total = 0
4. for each edge (u, v) in sorted order:
5.     if u and v are in DIFFERENT sets:
6.         add (u, v) to MST, total += w
7.         union (merge) the two sets
8.     else: reject (it would make a cycle)
9.     stop when MST has V - 1 edges</pre>

<h3>3. How do we know an edge makes a cycle? (union-find)</h3>
<p>An edge (u, v) makes a cycle exactly when u and v are <b>already connected</b> through edges we have chosen. To check this quickly we keep <b>disjoint sets</b> (groups that do not overlap), one set per connected piece.</p>
<ul>
<li>Each set has a <b>leader</b> (root). <code>parent[x]</code> points towards the leader; the leader has <code>parent[x] = x</code>.</li>
<li><b>find(x)</b>: follow parent[] until you reach the leader. Same leader means same set.</li>
<li><b>union(a, b)</b>: make one leader the parent of the other, merging the two sets.</li>
</ul>
<p>So: if find(u) == find(v), reject the edge; otherwise accept it and union the sets. Think of it as asking "which team captain do you play under?". Same captain means already on the same team.</p>

<h3>4. Worked example (same graph as Prim's)</h3>
<pre class="diagram">
  A ----4---- B ----8---- C
  |        /  |        /  |
  2     3     5     9     7
  |  /        |  /        |
  D ----6---- E ----1---- F
</pre>
<p><b>Step 1: sort the edges.</b></p>
<table><thead><tr><th>#</th><th>Edge</th><th>Weight</th></tr></thead><tbody><tr><td>1</td><td>E-F</td><td>1</td></tr><tr><td>2</td><td>A-D</td><td>2</td></tr><tr><td>3</td><td>B-D</td><td>3</td></tr><tr><td>4</td><td>A-B</td><td>4</td></tr><tr><td>5</td><td>B-E</td><td>5</td></tr><tr><td>6</td><td>D-E</td><td>6</td></tr><tr><td>7</td><td>C-F</td><td>7</td></tr><tr><td>8</td><td>B-C</td><td>8</td></tr><tr><td>9</td><td>C-E</td><td>9</td></tr></tbody></table>
<p><b>Step 2: go down the list.</b> 6 vertices, so we need 6 - 1 = 5 edges.</p>
<table><thead><tr><th>Edge</th><th>Weight</th><th>Decision</th></tr></thead><tbody><tr><td>E-F</td><td>1</td><td>Accept. Components: {A} {B} {C} {D} {E,F}</td></tr><tr><td>A-D</td><td>2</td><td>Accept. Components: {A,D} {B} {C} {E,F}</td></tr><tr><td>B-D</td><td>3</td><td>Accept. Components: {A,B,D} {C} {E,F}</td></tr><tr><td>A-B</td><td>4</td><td>Reject: A and B already connected, adding it makes a cycle</td></tr><tr><td>B-E</td><td>5</td><td>Accept. Components: {A,B,D,E,F} {C}</td></tr><tr><td>D-E</td><td>6</td><td>Reject: D and E already connected, adding it makes a cycle</td></tr><tr><td>C-F</td><td>7</td><td>Accept. Components: {A,B,C,D,E,F}</td></tr><tr><td>B-C</td><td>8</td><td>Not needed: already have V-1 = 5 edges</td></tr><tr><td>C-E</td><td>9</td><td>Not needed: already have V-1 = 5 edges</td></tr></tbody></table>
<p>Why the rejections:</p>
<ul>
<li><b>A-B (4)</b>: A-D and D-B are already chosen, so A and B are connected by A-D-B. Adding A-B makes the cycle A-D-B-A.</li>
<li><b>D-E (6)</b>: D-B and B-E are chosen, so D-B-E already joins them. Adding D-E makes the cycle D-B-E-D.</li>
</ul>
<p>After C-F we have 5 edges, so B-C (8) and C-E (9) are never needed.</p>
<p><b>MST edges: E-F, A-D, B-D, B-E, C-F. Total weight = 1 + 2 + 3 + 5 + 7 = 18.</b></p>
<pre class="diagram">
Final MST (weight 18)

  A           B           C
  |        /  |           |
  2     3     5           7
  |  /        |           |
  D           E ----1---- F
</pre>
<p>This is the <b>same tree with the same total (18)</b> that Prim's gave, only found in a different order (Prim's from A: A-D, B-D, B-E, E-F, C-F).</p>
<p>The same steps using the parent[] array, exactly as the C program does them (union sets parent[find(v)] = find(u)):</p>
<table><thead><tr><th>Edge (as stored)</th><th>Check</th><th>parent[] for A B C D E F</th></tr></thead><tbody><tr><td>E-F (1)</td><td>find(E)=E, find(F)=F: different, union</td><td>A B C D E E</td></tr><tr><td>A-D (2)</td><td>find(A)=A, find(D)=D: different, union</td><td>A B C A E E</td></tr><tr><td>B-D (3)</td><td>find(B)=B, find(D)=A: different, union</td><td>B B C A E E</td></tr><tr><td>A-B (4)</td><td>find(A)=B, find(B)=B: same, reject</td><td>B B C A E E</td></tr><tr><td>B-E (5)</td><td>find(B)=B, find(E)=E: different, union</td><td>B B C A B E</td></tr><tr><td>D-E (6)</td><td>find(D)=B, find(E)=B: same, reject</td><td>B B C A B E</td></tr><tr><td>C-F (7)</td><td>find(C)=C, find(F)=B: different, union</td><td>B C C A B E</td></tr></tbody></table>

<h3>5. Ties: can there be more than one MST?</h3>
<p>Yes, when some edges have equal weight. Different tie choices can give <b>different MSTs, but every MST has the same total weight</b>. If all edge weights are different (as in our example), the MST is unique, so Prim's and Kruskal's give exactly the same edges.</p>
<pre class="diagram">
  A ---1--- B
  | \\       |
  1   2     1
  |     \\   |
  D ---1--- C
</pre>
<p>Here A-B, B-C, C-D, A-D all weigh 1. Any 3 of these 4 edges form an MST of weight 3, so there are 4 different MSTs. Kruskal's with our tie rule (alphabetical: AB, AD, BC, CD) takes A-B, A-D, B-C. Taking A-B, B-C, C-D instead is also a correct MST, also of weight 3.</p>

<h3>6. Complexity</h3>
<table><thead><tr><th>Part</th><th>Time</th></tr></thead><tbody>
<tr><td>Sorting E edges</td><td>O(E log E)</td></tr>
<tr><td>E find/union operations (with union by rank and path compression)</td><td>almost O(E)</td></tr>
<tr><td><b>Total</b></td><td><b>O(E log E)</b>, same as O(E log V)</td></tr>
<tr><td>Space</td><td>O(V + E) for the edge array and parent[]</td></tr>
</tbody></table>
<p>O(E log E) and O(E log V) are the same order because E ≤ V², so log E ≤ 2 log V. Our simple C code uses bubble sort (O(E²)) and a plain find, which is fine for small exam graphs; say "use quicksort or merge sort to get O(E log E)".</p>

<h3>7. Prim's vs Kruskal's</h3>
<table><thead><tr><th>Point</th><th>Prim's</th><th>Kruskal's</th></tr></thead><tbody>
<tr><td>Approach</td><td>Vertex based: grow one tree from a start vertex</td><td>Edge based: pick cheapest edges globally</td></tr>
<tr><td>During the run</td><td>Always one connected tree</td><td>A forest that merges into one tree</td></tr>
<tr><td>Needs sorting of all edges</td><td>No</td><td>Yes</td></tr>
<tr><td>Cycle check</td><td>Not needed (one end always outside)</td><td>Needed (union-find)</td></tr>
<tr><td>Data structure</td><td>Adjacency matrix / priority queue</td><td>Edge list + disjoint sets</td></tr>
<tr><td>Time</td><td>O(V²) matrix, O(E log V) heap</td><td>O(E log E)</td></tr>
<tr><td>Best for</td><td>Dense graphs</td><td>Sparse graphs</td></tr>
<tr><td>Disconnected graph</td><td>Covers one component only</td><td>Gives a minimum spanning forest</td></tr>
<tr><td>Our example</td><td>A-D, B-D, B-E, E-F, C-F = 18</td><td>E-F, A-D, B-D, B-E, C-F = 18</td></tr>
</tbody></table>

<h3>8. Applications of MST (Prim's and Kruskal's)</h3>
<ul>
<li>Designing road, railway, water pipeline, electricity and telephone/fibre networks at minimum cost.</li>
<li>Laying cables in a building or campus LAN.</li>
<li>Cluster analysis (group similar items by cutting the costliest MST edges).</li>
<li>Approximate solutions to the travelling salesman problem.</li>
<li>Circuit design (connecting pins with least wire).</li>
</ul>`,

<div class="def">Kruskal's algorithm is a greedy method that builds a Minimum Spanning Tree by taking edges in increasing order of weight and adding each edge that does not form a cycle, until V - 1 edges are selected.</div>

har arrays: each Proc is an object made with \"new\",\n// its name is a String, and a finished node is reclaimed by the garbage collector.\npublic class Main {\n    // Each node is a process waiting for the CPU\n    static class Proc {\n        String name;\n        int left;              // burst time still needed\n        Proc next;\n    }\n\n    public static void main(String[] args) {\n        String[] names = {\"P1\", \"P2\", \"P3\"};\n        int[] burst = {5, 3, 1};\n        int q = 2, t = 0, run;\n        Proc head = null, last = null, cur, prev, p;\n\n        for (int i = 0; i < 3; i++) {     // build the circle\n            p = new Proc();\n            p.name = names[i];\n            p.left = burst[i];\n            if (head == null)\n                head = p;\n            else\n                last.next = p;\n            last = p;\n            last.next = head;             // close the circle\n        }\n\n        cur = head;\n        prev = last;\n        while (cur != null) {\n            run = (cur.left < q) ? cur.left : q;\n            System.out.println(cur.name + \" runs \" + t + \" to \" + (t + run));\n            t = t + run;\n            cur.left = cur.left - run;\n            if (cur.left == 0) {          // finished: remove node\n                System.out.println(\"  \" + cur.name + \" finished at \" + t);\n                if (cur.next == cur) {    // it was the last one\n                    cur = null;\n                } else {\n                    prev.next = cur.next;\n                    cur = prev.next;\n                }\n            } else {                      // go to next in circle\n                prev = cur;\n                cur = cur.next;\n            }\n        }\n    }\n}\n", "py": "# Round-robin CPU scheduling with a circular list\n# Python has no struct, malloc, free or char arrays: each Proc is an object, its name is a\n# string, and a finished node is reclaimed by the garbage collector once nothing points to it.\n\n\n# Each  58, 64};\n        int n = 8;\n\n        System.out.println(\"Linear: 27 at index \" + linearSearch(a, n, 27));\n        System.out.println(\"Binary: 27 at index \" + binarySearch(a, n, 27));\n        System.out.println(\"Binary: 50 at index \" + binarySearch(a, n, 50));\n    }\n}\n", "py": "# Linear search and binary search\n\n\ndef linearSearch(a, n, key):\n    \"\"\"Linear search: works on any list.\"\"\"\n    for i in range(n):\n        if a[i] == key:\n            return i               # found\n    return -1                      # not found\n\n\ndef binarySearch(a, n, key):\n    \"\"\"Binary search: list must be sorted.\"\"\"\n    low, high = 0, n - 1\n    while low <= high:\n        mid = (low + high) // 2    # // keeps it a whole number\n        if a[mid] == key:\n            return mid\n        elif key < a[mid]:\n            high = mid - 1         # search left half\n        else:\n            low = mid + 1          # search right half\n    return -1\n\n\na = [5, 12, 19, 27, 33, 41, 58, 64]\nn = 8\n\nprint(\"Linear: 27 at index\", linearSearch(a, n, 27))\nprint(\"Binary: 27 at index\", binarySearch(a, n, 27))\nprint(\"Binary: 50 at index\", binarySearch(a, n, 50))\n"}, {"java": "// Counting how many times different loops run (n = 16)\npublic class Main {\n    public static void main(String[] args) {\n        int n = 16, i, j;\n        long c1 = 0, c2 = 0, c3 = 0, c4 = 0;\n\n        for (i = 0; i < n; i++)          // single loop: O(n)\n            c1++;\n\n        for (i = 0; i < n; i++)          // nested loop: O(n^2)\n            for (j = 0; j < n; j++)\n                c2++;\n\n        for (i = 1; i < n; i = i * 2)    // doubling: O(log n)\n            c3++;\n\n        for (i = 1; i <= n; i++)         // triangle: O(n^2)\n            for (j = 1; j <= i; j++)\n                c4++;\n\n        System.out.println(\"n = \" + n);\n        System.out.println(\"single loop  : \" + c1);\n        System.out.println(\"nested loop  : \" + c2);\n        System.out. ta = x; }\n    }\n\n    static Node[] stack = new Node[MAX];\n    static int top = -1;\n\n    static void push(Node t) { stack[++top] = t; }\n    static Node pop()        { return stack[top--]; }\n\n    // Build an expression tree from a postfix string\n    static Node buildExpTree(String postfix) {\n        for (int i = 0; i < postfix.length(); i++) {\n            char c = postfix.charAt(i);\n            Node t = new Node(c);\n            if (!Character.isLetterOrDigit(c)) {   // operator\n                t.right = pop();     // first pop = right child\n                t.left  = pop();     // second pop = left child\n            }\n            push(t);\n        }\n        return pop();                // root\n    }\n\n    static void inorder(Node t) {\n        if (t != null) {\n            if (t.left != null) System.out.print(\"(\");\n            inorder(t.left);\n            System.out.print(t.data);\n            inorder(t.right);\n            if (t.left != null) System.out.print(\")\");\n        }\n    }\n\n    static void preorder(Node t) {\n        if (t != null) {\n            System.out.print(t.data);\n            preorder(t.left);\n            preorder(t.right);\n        }\n    }\n\n    public static void main(String[] args) {\n        String postfix = \"AB+CD-*E/\";\n        Node root = buildExpTree(postfix);\n        System.out.print(\"Infix  : \"); inorder(root);  System.out.println();\n        System.out.print(\"Prefix : \"); preorder(root); System.out.println();\n    }\n}\n", "py": "# Expression tree from a postfix expression\n# Python has no struct or malloc: Node(x) makes a node object, None means no child.\n# The stack is a Python list: append() pushes, pop() removes the top.\n\nclass Node:\n    def __init__(self, x):\n        self.data = x\n        self.left = None\n        self.right = None\n\nstack = []\n\ndef push(t):\n    stack.append(t)\n\ndef pop():\n    return stack.pop()\n\n# Build an expression tree from a postfix string\ndef buildExpTree(p mpty\\n\");\n            return;\n        }\n        System.out.printf(\"Queue (front to rear): \");\n        int i = front;\n        while (true) {\n            System.out.printf(\"%d \", q[i]);\n            if (i == rear)\n                break;\n            i = (i + 1) % N;\n        }\n        System.out.printf(\"\\n\");\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int choice, x;\n        while (true) {\n            System.out.printf(\"\\n1.Enqueue 2.Dequeue\\n\");\n            System.out.printf(\"3.Display 4.Exit\\n\");\n            System.out.printf(\"Enter choice: \");\n            if (!sc.hasNextInt())\n                break;\n            choice = sc.nextInt();\n            switch (choice) {\n            case 1:\n                System.out.printf(\"Enter value: \");\n                x = sc.nextInt();\n                enqueue(x);\n                break;\n            case 2:\n                x = dequeue();\n                if (x != -1)\n                    System.out.printf(\"Deleted %d\\n\", x);\n                break;\n            case 3:\n                display();\n                break;\n            case 4:\n                return;\n            default:\n                System.out.printf(\"Invalid choice\\n\");\n            }\n        }\n    }\n}\n", "py": "# Circular queue using an array (menu driven)\n# Python has no fixed-size array: we make a list of N slots and never let it grow.\nN = 5\n\nq = [0] * N\nfront = -1\nrear = -1\n\ndef isEmpty(): return front == -1\ndef isFull():  return (rear + 1) % N == front\n\ndef enqueue(x):\n    global front, rear\n    if isFull():\n        print(\"Queue Overflow! Cannot insert %d\" % x)\n        return\n    if front == -1:           # first element\n        front = 0\n    rear = (rear + 1) % N     # wrap around after N-1\n    q[rear] = x\n    print(\"%d inserted at q[%d]\" % (x, rear))\n\ndef dequeue():\n    global front, rear\n    if isEmpty():\n wnode;\n            return;\n        }\n        while (temp.next != null)\n            temp = temp.next;\n        temp.next = newnode;      // old last -> new\n        newnode.prev = temp;      // new <- old last\n    }\n\n    // New node becomes the node at position pos (1 = first)\n    static void insertAtPos(int pos, int x) {\n        Node newnode, temp = head;\n        if (pos < 1) {\n            System.out.println(\"Invalid position\");\n            return;\n        }\n        if (pos == 1) {\n            insertBegin(x);\n            return;\n        }\n        for (int i = 1; i < pos - 1 && temp != null; i++)\n            temp = temp.next;     // stop at node pos-1\n        if (temp == null) {\n            System.out.println(\"Invalid position\");\n            return;\n        }\n        newnode = getNode(x);\n        newnode.next = temp.next;        // 1\n        newnode.prev = temp;             // 2\n        if (temp.next != null)\n            temp.next.prev = newnode;    // 3\n        temp.next = newnode;             // 4\n    }\n\n    static void deleteBegin() {\n        Node temp = head;\n        if (head == null) {\n            System.out.println(\"Underflow\");\n            return;\n        }\n        head = head.next;\n        if (head != null)\n            head.prev = null;\n        System.out.println(\"Deleted \" + temp.data);\n    }\n\n    static void deleteEnd() {\n        Node temp = head;\n        if (head == null) {\n            System.out.println(\"Underflow\");\n            return;\n        }\n        while (temp.next != null)\n            temp = temp.next;\n        if (temp.prev == null)       // only one node\n            head = null;\n        else\n            temp.prev.next = null;\n        System.out.println(\"Deleted \" + temp.data);\n    }\n\n    static void deleteAtPos(int pos) {\n        Node temp = head;\n        for (int i = 1; i < pos && temp != null; i++)\n            temp = temp.next;     // node to delete\n        if (temp == null || pos < 1) {\n            System.out.println(\"Invalid position\");\n            return;\n        }\n        if (temp.prev != null)\n            temp.prev.next = temp.next;\n        else\n            head = temp.next;     // first node deleted\n        if (temp.next != null)\n            temp.next.prev = temp.prev;\n        System.out.println(\"Deleted \" + temp.data);\n    }\n\n    static void displayForward() {\n        Node temp = head;\n        System.out.print(\"Forward : \");\n        while (temp != null) {\n            System.out.print(temp.data + \" \");\n            temp = temp.next;\n        }\n        System.out.println();\n    }\n\n    static void displayBackward() {\n        Node temp = head;\n        System.out.print(\"Backward: \");\n        if (head == null) {\n            System.out.println();\n            return;\n        }\n        while (temp.next != null)    // go to last node\n            temp = temp.next;\n        while (temp != null) {       // walk back using prev\n            System.out.print(temp.data + \" \");\n            temp = temp.prev;\n        }\n        System.out.println();\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int ch, x, pos;\n        while (true) {\n            System.out.print(\"\\n1.Insert begin   2.Insert end\\n\");\n            System.out.print(\"3.Insert at pos  4.Delete begin\\n\");\n            System.out.print(\"5.Delete end     6.Delete at pos\\n\");\n            System.out.print(\"7.Display        0.Exit\\n\");\n            System.out.print(\"Enter choice: \");\n            if (!sc.hasNextInt())\n                break;\n            ch = sc.nextInt();\n            switch (ch) {\n            case 1: System.out.print(\"Value: \");\n                    x = sc.nextInt();\n                    insertBegin(x);\n                    break;\n            case 2: System.out.print(\"Value: \");\n                    x = sc.nextInt();\n                    insertEnd(x);\n                    break;\n            case 3: System.out.print(\"Position and value: \");\n                    pos = sc.nextInt();\n                    x = sc.nextInt();\n                    insertAtPos(pos, x);\n                    break;\n            case 4: deleteBegin();\n                    break;\n            case 5: deleteEnd();\n                    break;\n            case 6: System.out.print(\"Position: \");\n                    pos = sc.nextInt();\n                    deleteAtPos(pos);\n                    break;\n            case 7: displayForward();\n                    displayBackward();\n                    break;\n            case 0: System.exit(0);\n            default: System.out.println(\"Wrong choice\");\n            }\n        }\n    }\n}\n", "py": "# Complete doubly linked list program (menu driven)\n# Python has no struct, malloc or pointers: a Node object holds references to the\n# previous and next Node. Creating one asks for memory; the garbage collector frees unused nodes.\nimport sys\n\n\nclass Node:\n    def __init__(self):\n        self.prev = None\n        self.data = 0\n        self.next = None\n\n\nhead = None\n\n\ndef getNode(x):\n    newnode = Node()\n    newnode.data = x\n    newnode.prev = None\n    newnode.next = None\n    return newnode\n\n\ndef insertBegin(x):\n    global head\n    newnode = getNode(x)\n    if head is not None:\n        newnode.next = head\n        head.prev = newnode\n    head = newnode\n\n\ndef insertEnd(x):\n    global head\n    newnode = getNode(x)\n    temp = head\n    if head is None:\n        head = newnode\n        return\n    while temp.next is not None:\n        temp = temp.next\n    temp.next = newnode       # old last -> new\n    newnode.prev = temp       # new <- old last\n\n\n# New node becomes the node at position pos (1 = first)\ndef insertAtPos(pos, x):\n    temp = head\n    if pos < 1:\n        print(\"Invalid position\")\n        return\n    if pos == 1:\n        insertBegin(x)\n p.data} \", end=\"\")\n        temp = temp.prev\n    print()\n\n\n# Read numbers one at a time, like scanf(\"%d\") (they may share a line)\ntokens = []\ndef readInt():\n    while not tokens:\n        tokens.extend(input().split())\n    return int(tokens.pop(0))\n\n\ndef main():\n    while True:\n        print(\"\\n1.Insert begin   2.Insert end\")\n        print(\"3.Insert at pos  4.Delete begin\")\n        print(\"5.Delete end     6.Delete at pos\")\n        print(\"7.Display        0.Exit\")\n        print(\"Enter choice: \", end=\"\")\n        try:\n            ch = readInt()\n        except (EOFError, ValueError):\n            break\n        if ch == 1:\n            print(\"Value: \", end=\"\")\n            insertBegin(readInt())\n        elif ch == 2:\n            print(\"Value: \", end=\"\")\n            insertEnd(readInt())\n        elif ch == 3:\n            print(\"Position and value: \", end=\"\")\n            pos = readInt()\n            x = readInt()\n            insertAtPos(pos, x)\n        elif ch == 4:\n            deleteBegin()\n        elif ch == 5:\n            deleteEnd()\n        elif ch == 6:\n            print(\"Position: \", end=\"\")\n            deleteAtPos(readInt())\n        elif ch == 7:\n            displayForward()\n            displayBackward()\n        elif ch == 0:\n            sys.exit(0)\n        else:\n            print(\"Wrong choice\")\n\n\nmain()\n"}], "dma": [{"java": "// Java has no malloc, realloc or free: new int[n] asks for memory, Arrays.copyOf makes a bigger copy\n// (the closest thing to realloc), and the garbage collector frees an array once nothing refers to it.\nimport java.util.Arrays;\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int[] a;\n        int n;\n\n        System.out.print(\"How many marks? \");\n        n = sc.nextInt();\n\n        a = new int[n];                  // room for n ints\n\n        System.out.print(\"Enter \" + n + \" marks: \");\n        for (int i = 0; i < n; i++)\n            a[i] = sc.nextInt();\n\n        // Need 2 more places: make a bigger array and copy the old values in\n        a = Arrays.copyOf(a, n + 2);\n        a[n] = 70;\n        a[n + 1] = 80;\n        n = n + 2;\n\n        System.out.print(\"Marks: \");\n        for (int i = 0; i < n; i++)\n            System.out.print(a[i] + \" \");\n        System.out.println();\n\n        a = null;      // nothing refers to the array now, so it can be freed\n    }\n}\n", "py": "# Python has no malloc, realloc or free: a list asks for memory itself and grows when you append,\n# and the garbage collector frees it once nothing refers to it.\n\nn = int(input(\"How many marks? \"))\n\na = []                           # an empty list\nprint(f\"Enter {n} marks: \", end=\"\")\nwhile len(a) < n:                # read marks, on one line or several\n    a += [int(x) for x in input().split()]\n\n# Need 2 more places: the list grows by itself\na.append(70)\na.append(80)\nn = n + 2\n\nprint(\"Marks: \", end=\"\")\nfor i in range(n):\n    print(a[i], end=\" \")\nprint()\n\na = None       # nothing refers to the list now, so it can be freed\n"}, {"java": "// Java has no calloc or free: new int[5] asks for memory and Java always sets every int to 0,\n// and the garbage collector frees the array once nothing refers to it.\npublic class Main {\n    public static void main(String[] args) {\n        int[] p = new int[5];            // 5 ints, all set to 0\n        for (int i = 0; i < 5; i++)\n            System.out.print(p[i] + \" \");\n        System.out.println();\n\n        p = null;\n    }\n}\n", "py": "# Python has no calloc or free: [0] * 5 makes a list of five zeros,\n# and the garbage collector frees it once nothing refers to it.\n\np = [0] * 5                      # 5 ints, all set to 0\nfor i in range(5):\n    print(p[i], end=\" \")\nprint()\n\np = None\n"}, {"java": "// Java has no malloc or free: \"new Node(  * 4\np[0] = 5\nprint(p[0])\np = None        # p refers to nothing now\nif p is None:\n    print(\"p is None, safe\")\n"}], "graphs": [{"java": "// Degree of each vertex and the handshaking check\npublic class Main {\n    static final int V = 5;\n\n    public static void main(String[] args) {\n        char[] name = {'A', 'B', 'C', 'D', 'E'};\n        // adjacency matrix of the example graph\n        int[][] adj = {\n            {0, 1, 1, 0, 0},   // A\n            {1, 0, 1, 1, 0},   // B\n            {1, 1, 0, 1, 0},   // C\n            {0, 1, 1, 0, 1},   // D\n            {0, 0, 0, 1, 0}    // E\n        };\n        int deg, sum = 0;\n\n        for (int i = 0; i < V; i++) {\n            deg = 0;\n            for (int j = 0; j < V; j++)\n                deg = deg + adj[i][j];   // count 1s in row i\n            System.out.println(\"degree(\" + name[i] + \") = \" + deg);\n            sum = sum + deg;\n        }\n        System.out.println(\"Sum of degrees = \" + sum);\n        System.out.println(\"Number of edges = \" + sum / 2);\n    }\n}\n", "py": "# Degree of each vertex and the handshaking check\nV = 5\nname = ['A', 'B', 'C', 'D', 'E']\n# adjacency matrix of the example graph\nadj = [\n    [0, 1, 1, 0, 0],   # A\n    [1, 0, 1, 1, 0],   # B\n    [1, 1, 0, 1, 0],   # C\n    [0, 1, 1, 0, 1],   # D\n    [0, 0, 0, 1, 0],   # E\n]\ntotal = 0                        # named total because sum is a Python built-in\n\nfor i in range(V):\n    deg = 0\n    for j in range(V):\n        deg = deg + adj[i][j]    # count 1s in row i\n    print(f\"degree({name[i]}) = {deg}\")\n    total = total + deg\nprint(\"Sum of degrees =\", total)\nprint(\"Number of edges =\", total // 2)\n"}], "hashing": [{"java": "// Hash table with linear probing: insert and search\n// Same as C: a fixed-size int array, with -1 marking an empty slot.\npublic class Main {\n    static final int SIZE = 10;\n    static final int EMPTY = -1;\n\n    static int[] table = new int[SIZE];\n\n    static int hash(int key) { return key % SIZE; }\n\n    static void insert(int key) {\n        for (int i = 0; i < SIZE; i++) {\n            int idx = (hash(key) + i) % SIZE;   // linear probing\n            if (table[idx] == EMPTY) {\n                table[idx] = key;\n                System.out.println(key + \" -> slot \" + idx + \" (probes \" + (i + 1) + \")\");\n                return;\n            }\n        }\n        System.out.println(\"Table full, \" + key + \" not inserted\");\n    }\n\n    static int search(int key) {\n        for (int i = 0; i < SIZE; i++) {\n            int idx = (hash(key) + i) % SIZE;\n            if (table[idx] == EMPTY)\n                return -1;                  // hit an empty slot: absent\n            if (table[idx] == key)\n                return idx;\n        }\n        return -1;\n    }\n\n    public static void main(String[] args) {\n        int[] keys = {25, 35, 45, 17, 27, 9, 19, 30};\n        for (int i = 0; i < SIZE; i++)\n            table[i] = EMPTY;\n        for (int i = 0; i < 8; i++)\n            insert(keys[i]);\n        for (int i = 0; i < SIZE; i++)\n            System.out.println(\"[\" + i + \"] \" + table[i]);\n        System.out.println(\"search 30: slot \" + search(30));\n        System.out.println(\"search 55: slot \" + search(55));\n    }\n}\n", "py": "# Hash table with linear probing: insert and search\n# A Python list of fixed length stands in for the C array, with -1 marking an empty slot.\nSIZE = 10\nEMPTY = -1\n\ntable = [EMPTY] * SIZE\n\ndef hash_(key):                      # \"hash\" is already a Python built-in name\n    return key % SIZE\n\ndef insert(key):\n    for i in range(SIZE):\n        idx = (hash_(key) + i) % SIZE    # linear probing\n        if table[idx] == EMPTY:\n            table[idx] = key\n            print(\"%d -> slot %d (probes %d)\" % (key, idx, i + 1))\n            return\n    print(\"Table full, %d not inserted\" % key)\n\ndef search(key):\n    for i in range(SIZE):\n        idx = (hash_(key) + i) % SIZE\n        if table[idx] == EMPTY:\n            return -1                # hit an empty slot: absent\n        if table[idx] == key:\n            return idx\n    return -1\n\nkeys = [25, 35, 45, 17, 27, 9, 19, 30]\nfor k in keys:\n    insert(k)\nfor i in range(SIZE):\n    print(\"[%d] %d\" % (i, table[i]))\nprint(\"search 30: slot %d\" % search(30))\nprint(\"search 55: slot %d\" % search(55))\n"}, {"java": "// Separate chaining with linked lists\n// Java has no struct or malloc: \"new Node\" makes a list node, null ends a chain.\npublic class Main {\n    static final int SIZE = 10;\n\n    static class Node {\n        int data;\n        Node next;\n    }\n\n    static Node[] table = new Node[SIZE];   // each slot = head of a list\n\n    static void insert(int key) {\n        int idx = key % SIZE;\n        Node t = new Node();\n        t.data = key;\n        t.next = null;\n        if (table[idx] == null) {\n            table[idx] = t;\n        } else {                            // add at END of the chain\n            Node p = table[idx];\n            while (p.next != null)\n                p = p.next;\n            p.next = t;\n        }\n    }\n\n    static int search(int key) {\n        Node p = table[key % SIZE];\n        while (p != null) {\n            if (p.data == key)\n                return 1;\n            p = p.next;\n        }\n        return 0;\n    }\n\n    public static void main(String[] args) {\n        int[] keys = {25, 35, 45, 17, 27, 9, 19, 30};\n        for (int i = 0; i < SIZE; i++)\n            table[i] = null;\n        for (int i = 0; i < 8; i++)\n            insert(keys[i]);\n        for (int i = 0; i < SIZE; i++) {\n            System.out.print(\"[\" + i + \"]\");\n            for (Node p = table[i]; p != null; p = p.next)\n                System.out.print(\" -> \" + p.data);\n            System.out.println(\" -> NULL\");\n        }\n        System.out.println(\"search 27: \" + search(27));\n    }\n}\n", "py": "# Separate chaining with linked lists\n# Python has no struct or malloc: Node() makes a list node, None ends a chain.\nSIZE = 10\n\nclass Node:\n    def __init__(self, data):\n        self.data = data\n        self.next = None\n\ntable = [None] * SIZE               # each slot = head of a list\n\ndef insert(key):\n    idx = key % SIZE\n    t = Node(key)\n    if table[idx] is None:\n        table[idx] = t\n    else:                           # add at END of the chain\n        p = table[idx]\n        while p.next is not None:\n            p = p.next\n        p.next = t\n\ndef search(key):\n    p = table[key % SIZE]\n    while p is not None:\n        if p.data == key:\n            return 1\n        p = p.next\n    return 0\n\nkeys = [25, 35, 45, 17, 27, 9, 19, 30]\nfor k in keys:\n    insert(k)\nfor i in range(SIZE):\n    print(\"[%d]\" % i, end=\"\")\n    p = table[i]\n    while p is not None:\n        print(\" -> %d\" % p.data, end=\"\")\n        p = p.next\n    print(\" -> NULL\")\nprint(\"search 27: %d\" % search(27))\n"}, {"java": "// Double hashing (and the one-line change for quadratic probing)\n// Same as C: a fixed-size int array, with -1 marking an empty slot.\npublic class Main {\n    static final int SIZE = 10;\n    static final int R = 7;                 // prime smaller than SIZE\n    static final int EMPTY = -1;\n\n    static int[] table = new int[SIZE];\n\n    static int h1(int key) { return key % SIZE; }\n    static int h2(int key) { return R - (key % R); }   // never 0\n\n    static void insert(int key) {\n        for (int i = 0; i < SIZE; i++) {\n            int idx = (h1(key) + i * h2(key)) % SIZE;\n            // quadratic probing would use (h1(key) + i * i) % SIZE\n            if (table[idx] == EMPTY) {\n                table[idx] = key;\n                return;\n            }\n        }\n        System.out.println(\"Could not insert \" + key);\n    }\n\n    public static void main(String[] args) {\n        int[] keys = {25, 35, 45, 17, 27, 9, 19, 30};\n        for (int i = eturns index or -1\n    static int search(int[] a, int n, int key) {\n        for (int i = 0; i < n; i++)\n            if (a[i] == key)\n                return i;\n        return -1;\n    }\n\n    public static void main(String[] args) {\n        int[] a = new int[MAX];      // 10 places, all 0\n        a[0] = 10; a[1] = 20; a[2] = 30; a[3] = 40;\n        int n = 4;\n\n        System.out.print(\"Array: \");\n        display(a, n);\n\n        n = insert(a, n, 2, 25);\n        System.out.print(\"After inserting 25 at index 2: \");\n        display(a, n);\n\n        n = delete(a, n, 0);\n        System.out.print(\"After deleting index 0: \");\n        display(a, n);\n\n        System.out.println(\"30 found at index \" + search(a, n, 30));\n        System.out.println(\"99 found at index \" + search(a, n, 99));\n    }\n}\n", "py": "# Array operations: traverse, insert, delete, search\n# Python lists can grow by themselves; here we use a fixed list of MAX places\n# and a count n, so the shifting steps are the same as in C.\nMAX = 10\n\n\ndef display(a, n):\n    \"\"\"Print all n elements (traversal).\"\"\"\n    for i in range(n):\n        print(a[i], end=\" \")\n    print()\n\n\ndef insert(a, n, pos, x):\n    \"\"\"Insert x at index pos (0-based). Returns new size.\"\"\"\n    if n == MAX:\n        print(\"Array is full\")\n        return n\n    for i in range(n - 1, pos - 1, -1):   # shift right\n        a[i + 1] = a[i]\n    a[pos] = x\n    return n + 1\n\n\ndef delete(a, n, pos):\n    \"\"\"Delete element at index pos (0-based). Returns new size.\"\"\"\n    for i in range(pos, n - 1):           # shift left\n        a[i] = a[i + 1]\n    return n - 1\n\n\ndef search(a, n, key):\n    \"\"\"Linear search: returns index or -1.\"\"\"\n    for i in range(n):\n        if a[i] == key:\n            return i\n    return -1\n\n\na = [10, 20, 30, 40] + [0] * (MAX - 4)   # 10 places\nn = 4\n\nprint(\"Array: \", end=\"\")\ndisplay(a, n)\n\nn = insert(a, n, 2, 25)\nprint(\"After insert ack[++top] = c; }\n    static char pop()        { return stack[top--]; }\n    static char peek()       { return stack[top]; }\n\n    static int prec(char op) {\n        if (op == '^') return 3;\n        if (op == '*' || op == '/' || op == '%') return 2;\n        if (op == '+' || op == '-') return 1;\n        return 0;            // '(' has the lowest value\n    }\n\n    // true if the operator t on top must be output before op:\n    // t has higher precedence, or equal precedence and op\n    // is left associative ('^' is right associative)\n    static boolean shouldPop(char t, char op) {\n        if (op == '^')\n            return prec(t) > prec(op);\n        return prec(t) >= prec(op);\n    }\n\n    static String infixToPostfix(String infix) {\n        StringBuilder postfix = new StringBuilder(); // grows as we add characters\n        char ch;\n        for (int i = 0; i < infix.length(); i++) {\n            ch = infix.charAt(i);\n            if (Character.isLetterOrDigit(ch))   // operand\n                postfix.append(ch);\n            else if (ch == '(')\n                push(ch);\n            else if (ch == ')') {\n                while (top != -1 && peek() != '(')\n                    postfix.append(pop());\n                pop(); // discard '('\n            }\n            else {                               // operator\n                while (top != -1 && shouldPop(peek(), ch))\n                    postfix.append(pop());\n                push(ch);\n            }\n        }\n        while (top != -1) // empty stack\n            postfix.append(pop());\n        return postfix.toString();\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.printf(\"Enter infix expression: \");\n        if (!sc.hasNext())\n            return;\n        String infix = sc.next(); // reads one word, like scanf(\"%s\")\n        String postfix = infixToPostfix(infix);\n        System.out.printf(\"Postfix: %s\\n\", postfix);\n    }\n}\n", "py": "# Infix to postfix conversion using a stack\n# Python has no fixed-size array: we make a list of MAX slots and never let it grow.\nMAX = 100\nstack = [''] * MAX\ntop = -1\n\ndef push(c):\n    global top\n    top += 1\n    stack[top] = c\n\ndef pop():\n    global top\n    top -= 1\n    return stack[top + 1]\n\ndef peek():\n    return stack[top]\n\ndef prec(op):\n    if op == '^': return 3\n    if op in '*/%': return 2\n    if op in '+-': return 1\n    return 0              # '(' has the lowest value\n\n# True if the operator t on top must be output before op:\n# t has higher precedence, or equal precedence and op\n# is left associative ('^' is right associative)\ndef shouldPop(t, op):\n    if op == '^':\n        return prec(t) > prec(op)\n    return prec(t) >= prec(op)\n\ndef infixToPostfix(infix):\n    postfix = []          # list of output characters\n    for ch in infix:\n        if ch.isalnum():                  # operand\n            postfix.append(ch)\n        elif ch == '(':\n            push(ch)\n        elif ch == ')':\n            while top != -1 and peek() != '(':\n                postfix.append(pop())\n            pop()                         # discard '('\n        else:                             # operator\n            while top != -1 and shouldPop(peek(), ch):\n                postfix.append(pop())\n            push(ch)\n    while top != -1:      # empty stack\n        postfix.append(pop())\n    return \"\".join(postfix)\n\ntry:\n    words = input(\"Enter infix expression: \").split()\nexcept EOFError:\n    words = []\nif words:\n    infix = words[0]      # one word, like scanf(\"%s\")\n    postfix = infixToPostfix(infix)\n    print(\"Postfix: %s\" % postfix)\n"}, {"java": "// Postfix evaluation (single-digit operands)\nimport java.util.Scanner;\n\npublic class Main {\n    static final int MAX = 100;\n    static int[] stack = new int[MAX];\n    static int top = -1;\n\n    static void push(int x) { stack[++top] = x; }\n sh %d\" % x)\n    else:\n        top += 1          # move top up, then store\n        stack[top] = x\n        print(\"%d pushed\" % x)\n\ndef pop():\n    global top\n    if isEmpty():\n        print(\"Stack Underflow!\")\n        return -1\n    x = stack[top]        # take value, then move top down\n    top -= 1\n    return x\n\ndef peek():\n    if isEmpty():\n        print(\"Stack is empty\")\n        return -1\n    return stack[top]\n\ndef display():\n    if isEmpty():\n        print(\"Stack is empty\")\n        return\n    print(\"Stack (top to bottom): \", end=\"\")\n    for i in range(top, -1, -1):\n        print(\"%d \" % stack[i], end=\"\")\n    print()\n\nwhile True:\n    print(\"\\n1.Push 2.Pop 3.Peek\")\n    print(\"4.Display 5.Exit\")\n    try:\n        choice = int(input(\"Enter choice: \"))\n    except (ValueError, EOFError):\n        break\n    if choice == 1:\n        x = int(input(\"Enter value: \"))\n        push(x)\n    elif choice == 2:\n        x = pop()\n        if x != -1:\n            print(\"Popped %d\" % x)\n    elif choice == 3:\n        x = peek()\n        if x != -1:\n            print(\"Top element is %d\" % x)\n    elif choice == 4:\n        display()\n    elif choice == 5:\n        break\n    else:\n        print(\"Invalid choice\")\n"}, {"java": "// Stack using a linked list (push/pop at head)\n// Java has no struct, malloc or free: a Node class replaces the struct, \"new\" asks for\n// memory, and the garbage collector frees a node once nothing points to it.\npublic class Main {\n    static class Node {\n        int data;\n        Node next;\n    }\n\n    // null means the stack is empty\n    static Node top = null;\n\n    static void push(int x) {\n        Node newnode = new Node(); // if memory is full, Java stops with an error\n        newnode.data = x;\n        // new node points to old top\n        newnode.next = top;\n        top = newnode; // new node becomes the top\n    }\n\n    static int pop() {\n        if (top == null) { at holds an object is a reference to it, so the dot does the job of ->.\npublic class Main {\n    static class Date {\n        int d, m, y;\n        Date(int d, int m, int y) { this.d = d; this.m = m; this.y = y; }\n    }\n\n    static class Employee {\n        int id;\n        Date dob;             // nested object\n        Employee(int id, Date dob) { this.id = id; this.dob = dob; }\n    }\n\n    // The method gets a reference: changes are seen by the caller\n    static void giveId(Employee e, int newId) {\n        e.id = newId;\n    }\n\n    public static void main(String[] args) {\n        Employee e1 = new Employee(101, new Date(15, 8, 2004));\n        Employee p = e1;      // p refers to the same object as e1\n\n        giveId(p, 205);\n        System.out.println(\"ID: \" + p.id);\n        System.out.println(\"DOB: \" + p.dob.d + \"/\" + p.dob.m + \"/\" + e1.dob.y);\n    }\n}\n", "py": "# Python has no struct, typedef, pointers or the -> operator.\n# A class is the structure, and a variable that holds an object is a reference to it, so the dot does the job of ->.\n\n\nclass Date:\n    def __init__(self, d, m, y):\n        self.d = d\n        self.m = m\n        self.y = y\n\n\nclass Employee:\n    def __init__(self, id, dob):\n        self.id = id\n        self.dob = dob        # nested object\n\n\ndef giveId(e, newId):\n    \"\"\"The function gets a reference: changes are seen by the caller.\"\"\"\n    e.id = newId\n\n\ne1 = Employee(101, Date(15, 8, 2004))\np = e1                        # p refers to the same object as e1\n\ngiveId(p, 205)\nprint(\"ID:\", p.id)\nprint(f\"DOB: {p.dob.d}/{p.dob.m}/{e1.dob.y}\")\n"}, {"java": "// Java has no sizeof, no union and no padding: the JVM decides how objects sit in memory.\n// So this program only adds up field sizes by hand, and shows that a class (unlike a union) keeps every field separately.\npublic class Main {\n    static class U {          // like union U, but each field gets its own memory\n        int roll;\n ts own type\n    static class Node {\n        int data;\n        Node next;\n    }\n\n    public static void main(String[] args) {\n        Node a = new Node(), b = new Node(), c = new Node();\n        Node p;\n\n        a.data = 10;  a.next = b;\n        b.data = 20;  b.next = c;\n        c.data = 30;  c.next = null;\n\n        for (p = a; p != null; p = p.next)\n            System.out.print(p.data + \" -> \");\n        System.out.println(\"NULL\");\n    }\n}\n", "py": "# Python has no pointers: the field next holds a reference to another Node object, and None means \"no node\".\n\n\nclass Node:\n    \"\"\"Self-referential class: next refers to another Node.\"\"\"\n    def __init__(self):\n        self.data = 0\n        self.next = None\n\n\na, b, c = Node(), Node(), Node()\n\na.data = 10; a.next = b\nb.data = 20; b.next = c\nc.data = 30; c.next = None\n\np = a\nwhile p is not None:\n    print(p.data, end=\" -> \")\n    p = p.next\nprint(\"NULL\")\n"}], "trees": [{"java": "// BST: insert, search and traversals (complete program)\n// Java has no struct or malloc: a Node class is the record, \"new Node\" asks for memory,\n// and null plays the part of NULL. The garbage collector frees nodes nobody points to.\npublic class Main {\n    static class Node {\n        int data;\n        Node left, right;\n        Node(int x) { data = x; }   // left and right start as null\n    }\n\n    // Insert x and return the (possibly new) root\n    static Node insert(Node root, int x) {\n        if (root == null)\n            return new Node(x);\n        if (x < root.data)\n            root.left = insert(root.left, x);\n        else if (x > root.data)\n            root.right = insert(root.right, x);\n        // equal keys are ignored: no duplicates\n        return root;\n    }\n\n    // Returns the node holding key, or null\n    static Node search(Node root, int key) {\n        while (root != null && root.data != key) {\n            if (key < root.data)\n                root = root.left;\n            else\n                root = root.right;\n        }\n        return root;\n    }\n\n    static void inorder(Node root) {\n        if (root != null) {\n            inorder(root.left);\n            System.out.print(root.data + \" \");\n            inorder(root.right);\n        }\n    }\n\n    static void preorder(Node root) {\n        if (root != null) {\n            System.out.print(root.data + \" \");\n            preorder(root.left);\n            preorder(root.right);\n        }\n    }\n\n    static void postorder(Node root) {\n        if (root != null) {\n            postorder(root.left);\n            postorder(root.right);\n            System.out.print(root.data + \" \");\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] keys = {50, 30, 70, 20, 40, 60, 80, 35, 65};\n        Node root = null;\n\n        for (int i = 0; i < keys.length; i++)\n            root = insert(root, keys[i]);\n\n        System.out.print(\"Inorder  : \"); inorder(root);   System.out.println();\n        System.out.print(\"Preorder : \"); preorder(root);  System.out.println();\n        System.out.print(\"Postorder: \"); postorder(root); System.out.println();\n\n        if (search(root, 65) != null)\n            System.out.println(\"65 found\");\n        if (search(root, 45) == null)\n            System.out.println(\"45 not found\");\n    }\n}\n", "py": "# BST: insert, search and traversals (complete program)\n# Python has no struct or malloc: a Node class is the record, Node(x) asks for memory,\n# and None plays the part of NULL. The garbage collector frees nodes nobody points to.\n\nclass Node:\n    def __init__(self, x):\n        self.data = x\n        self.left = None\n        self.right = None\n\n# Insert x and return the (possibly new) root\ndef insert(root, x):\n    if root is None:\n        return Node(x)\n    if x < root.data:\n        root.left = insert(root.left, x)\n    elif x > root.data:\n        root.right = insert(root.right, x)\n    # equal keys are ignored: no duplicates\n    return root\n\n# Returns the node holding key, or None\ndef search(root, key):\n    while root is not None and root.data != key:\n        if key < root.data:\n            root = root.left\n        else:\n            root = root.right\n    return root\n\ndef inorder(root):\n    if root is not None:\n        inorder(root.left)\n        print(root.data, end=\" \")\n        inorder(root.right)\n\ndef preorder(root):\n    if root is not None:\n        print(root.data, end=\" \")\n        preorder(root.left)\n        preorder(root.right)\n\ndef postorder(root):\n    if root is not None:\n        postorder(root.left)\n        postorder(root.right)\n        print(root.data, end=\" \")\n\nkeys = [50, 30, 70, 20, 40, 60, 80, 35, 65]\nroot = None\nfor k in keys:\n    root = insert(root, k)\n\nprint(\"Inorder  : \", end=\"\"); inorder(root);   print()\nprint(\"Preorder : \", end=\"\"); preorder(root);  print()\nprint(\"Postorder: \", end=\"\"); postorder(root); print()\n\nif search(root, 65) is not None:\n    print(\"65 found\")\nif search(root, 45) is None:\n    print(\"45 not found\")\n"}, {"java": "// BST: delete a node (all three cases)\n// Uses the Node class from the program above (repeated here so this file compiles).\n// Java has no free: once nothing points to the removed node, the garbage collector frees it.\npublic class Main {\n    static class Node {\n        int data;\n        Node left, right;\n        Node(int x) { data = x; }\n    }\n\n    static Node findMin(Node root) {\n        while (root.left != null)\n            root = root.left;\n        return root;\n    }\n\n    static Node deleteNode(Node root, int key) {\n        Node temp;\n        if (root == null)\n            return null;                      // key not found\n        if (key < root.data)\n            root.left = deleteNode(root.left, key);\n        else if (key > root.data)\n            root.right = deleteNode(root.right, key);\n        else {\n <script>
/* Pure algorithms that produce step-by-step traces. Shared by the page and the node checks. */
(function (root) {
  "use strict";
  var A = {};

  /* ---------- expressions ---------- */
  function prec(op) { return op === "^" ? 3 : (op === "*" || op === "/" || op === "%") ? 2 : (op === "+" || op === "-") ? 1 : 0; }

      else if (c === "(") { stack.push(c); note = "( : push it. It waits for its ) partner."; }
      else if (c === ")") {

        while (stack.length && stack[stack.length - 1] !== "(") { var p = stack.pop(); out += p; popped.push(p); }
        if (!stack.length) { error = "A ) has no matching ( before it."; steps.push({ sym: c, stack: stack.slice(), out: out, note: error }); break; }
        stack.pop();

      } else { error = "I can't read the symbol '" + c + "'. Use letters, digits, + - * / % ^ and brackets."; break; }
      steps.push({ sym: c, stack: stack.slice(), out: out, note: note });
    }

      else {

      var c = s[i];

      else if (isOp(c)) {

  };
  A.bstPath = function (t, k) { var p = []; while (t) { p.push(t.k); if (k === t.k) return { path: p, found: true }; t = k < t.k ? t.l : t.r; } return { path: p, found: false }; };
  A.bstDelete = function (t, k) {

    function del(n, k) {

      if (k < n.k) { n.l = del(n.l, k); return n; }
      if (k > n.k) { n.r = del(n.r, k); return n; }
      if (!n.l && !n.r) { if (info.kind === "missing") info.kind = "leaf"; return null; }
      if (!n.l || !n.r) { if (info.kind === "missing") info.kind = "one"; return n.l || n.r; }
      var s = n.r; while (s.l) s = s.l;

        h += '<div class="flash-wrap u' + c.t.unit + '"><button type="button" class="flashcard' + (quizState.flip ? " flip" : "") + '" id="fcard" aria-label="Flashcard, tap to flip"><div class="inner"><div class="face front"><small>' + esc(c.t.title) + "</small><div>" + c.f.q + '</div><small>tap to flip</small></div><div class="face back"><small>answer</small><div>' + c.f.a + '</div></div></div></button><div class="cta-row" style="justify-content:center"><button class="btn small" type="button" id="fPrev">Previous</button><span style="align-self:center;font-variant-numeric:tabular-nums">' + (i + 1) + " / " + cards.length + '</span><button class="btn small primary" type="button" id="fNext">Next card</button><button class="btn small" type="button" id="fShuf">Shuffle</button></div></div>';
        quizState.count = cards.length;
      }
    }
    return topbar("quiz") + '<main class="view">' + h + "</main>";
  }

  function longQs() {
    var h = '<div class="topic-hero"><div class="eyebrow">Questions 26 and 27</div><h1><span class="hl u25">15-mark</span> questions</h1><div class="tag">Both long questions can come from any unit. These are the ones that fill 15 marks well. Each links to a full long answer or tells you which 8-mark answers to join.</div></div>';
    h += '<div class="sheet prose" style="margin-bottom:16px"><h3>How a 15-mark answer is different</h3><ul><li>About 4 to 5 booklet pages, 30 to 35 minutes.</li><li>Cover two or three related sub-topics (for example queue <b>and</b> circular queue), not one.</li><li>Always include: definition, a big clear diagram, the algorithm steps, one full worked example, complexity, and a comparison table.</li><li>Scenario 15-markers usually say "explain with an example". The worked example is where most marks are.</li></ul></div>';
    var withLong = T.filter(function (t) { return t.exam15; });
    h += '<div class="playbook">';
    withLong.forEach(function (t) {
      h += '<div class="pb-item u' + t.unit + '"><span class="u">' + t.unit + '</span><span class="q">' + esc(t.title) + ': full long answer</span><span class="how">' + esc(t.tagline || "") + '</span><span class="links"><a href="#' + t.id + '/all" data-open15="1">Open the 15-mark answer</a></span></div>';
    });
    PAIRS.forEach(function (p) {
      var links = p[2].filter(function (id) { return byId[id]; }).map(function (id) { return '<a href="#' + id + '">' + esc(byId[id].title) + "</a>"; }).join(" + ");
      h += '<div class="pb-item u' + p[0] + '"><span class="u">' + p[0] + '</span><span class="q">' + p[1] + '</span><span class="how">' + p[3] + '</span><span class="links">' + links + "</span></div>";
    });
    h += "</div>";
    return topbar("long") + '<main class="view">' + h + "</main>";
  }
  var PAIRS = [
    [21, "Explain dynamic memory allocation functions with a program, and analyse its time and space complexity.", ["dma", "complexity"], "Join the DMA answer with the step-count table from complexity."],
    [22, "Compare singly, doubly and circular linked lists with diagrams and the insert/delete algorithms.", ["sll", "dll", "cll"], "Draw all three, then give one insert and one delete for each, then the comparison table."],
    [23, "Convert an infix expression to postfix using a stack and evaluate a postfix expression.", ["postfix", "stack"], "Algorithm + full Symbol | Stack | Postfix table + evaluation trace."],
    [23, "What is a circular queue? Why is it better than a linear queue? Write enqueue and dequeue.", ["queue", "cqueue"], "Show the wasted-space trace of a linear queue first, then the circular fix."],
    [24, "Construct an AVL tree for a given sequence, naming every rotation.", ["avl"], "Draw the tree after every insert with balance factors. Name LL, RR, LR, RL where they happen."],
    [24, "Construct a binary tree from preorder and inorder traversals, and write all traversals.", ["construct", "trees"], "Step-by-step split of the inorder sequence, then the final tree and its postorder."],
    [24, "Insert keys into a B-tree of order m. Explain properties and deletion.", ["btree"], "Properties first, then a tree drawing after every split."],
    [24, "Explain hashing and collision resolution techniques with an example.", ["hashing"], "One key list, solved with linear, quadratic, double hashing and chaining."],
    [25, "Explain BFS and DFS with an example graph and compare them.", ["bfs-dfs", "represent"], "Show the adjacency list, then queue and stack traces, then the comparison table."],
    [25, "Find the minimum spanning tree using Prim's and Kruskal's algorithms.", ["prim", "kruskal", "spanning"], "Same graph, two step tables, same total weight, then comparison."]
  ];

  function writeView() {
    var h = '<div class="topic-hero"><div class="eyebrow">Read this once</div><h1>How to <span class="hl u22">write</span> answers</h1><div class="tag">Same knowledge, more marks. This is how evaluators read an answer booklet.</div></div>';
    h += '<div class="sheet prose ux"><h3>The 8-mark layout</h3><ol><li><b>Definition</b> in one or two lines. Underline the key words.</li><li><b>Diagram.</b> Always draw one, even a small one. Label head, top, front, rear, root, NULL.</li><li><b>Working or algorithm</b> as numbered steps.</li><li><b>Example</b> traced fully (a table is best).</li><li><b>Complexity</b> in a tiny table.</li><li><b>Advantages, disadvantages, applications</b> as 2 to 3 points each.</li></ol>' +
      '<div class="tip">Headings make you look prepared. Write "Definition:", "Diagram:", "Algorithm:" as headings, exactly like the model answers on this site.</div>' +
      '<h3>Timing</h3><p>If the paper has 5 questions of 8 marks plus two of 15, give each 8-marker about 15 to 18 minutes and each 15-marker about 30 minutes. Leave 10 minutes to re-read and finish diagrams. Check the actual time and marks on your paper and scale this.</p>' +
      '<h3>Scenario questions</h3><p>They describe a real situation ("a printer gets jobs from many computers"). Do three things:</p><ol><li>Name the data structure in the first line.</li><li>Give the reason by linking a property to the situation (FIFO, so the first job sent prints first).</li><li>Show the operation on their data with a small diagram or trace.</li></ol>' +
      '<h3>If you blank out</h3><ul><li>Write the definition and draw the diagram anyway. Those alone usually get some marks.</li><li>Give a small example you remember from the demos here, even if the question used other numbers.</li><li>Never leave a question empty.</li></ul>' +
      '<div class="trap">Do not mix conventions halfway. If you start with top = -1, keep it. If you name a rotation LR, the arrows in your drawing must match.</div></div>';
    return topbar("") + '<main class="view">' + h + "</main>";
  }

  /* ---------------- router ---------------- */
  var lastRoute = null;
  function route() {
    var id = (location.hash || "#home").slice(1) || "home";
    var html, all = false;
    if (/\/all$/.test(id)) { all = true; id = id.replace(/\/all$/, ""); }
    if (id === "home") html = home(); else if (id === "cheat") html = cheat(); else if (id === "quiz") html = quiz(); else if (id === "long") html = longQs(); else if (id === "write") html = writeView();
    else if (byId[id]) html = all ? topicView(byId[id]) : lessonView(byId[id]); else { id = "home"; html = home(); }
    app.innerHTML = html;
    document.title = (byId[id] ? byId[id].title + " | " : "") + "DSA Tonight";
    bind(id); bindLesson(id);
    document.body.classList.toggle("in-lesson", !!app.querySelector(".lesson"));
    if (lastRoute !== id) window.scrollTo(0, 0);
    if (pendingJump) { var target = document.getElementById("s-" + pendingJump); pendingJump = null; if (target) target.scrollIntoView(); }
    lastRoute = id;
  }
  var pendingJump = null;
  function toast(t) { var x = document.getElementById("toast"); x.textContent = t; x.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function () { x.classList.remove("show"); }, 1800); }

  function bind(id) {
    app.querySelectorAll("[data-quick]").forEach(function (b) { b.addEventListener("click", function () { quick = b.getAttribute("data-quick") === "1"; try { localStorage.setItem("dsa-quick", quick ? "1" : "0"); } catch (e) { /* ignore */ } route(); }); });
    var tb = document.getElementById("themeBtn");
    if (tb) tb.addEventListener("click", function () {
      var r = document.documentElement, cur = r.getAttribute("data-theme");
      var dark = cur ? cur === "dark" : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      r.setAttribute("data-theme", dark ? "light" : "dark");
      try { localStorage.setItem("dsa-theme", dark ? "light" : "dark"); } catch (e) { /* ignore */ }
    });
    app.querySelectorAll("[data-widget]").forEach(function (w) {
      var t = byId[id], fn = Widgets[w.getAttribute("data-widget")], body = w.querySelector(".w-body");
      if (!fn) { body.innerHTML = '<div class="w-msg">This demo is not available.</div>'; return; }
      try { fn(body, t && t.preset); } catch (e) { body.innerHTML = '<div class="w-msg bad">The demo hit a problem: ' + esc(e.message) + "</div>"; if (window.console) console.error(e); }
    });
    app.querySelectorAll("[data-jump]").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); var s = document.getElementById("s-" + a.getAttribute("data-jump")); if (s) s.scrollIntoView({ behavior: "smooth" }); }); });
    var cbox = app.querySelector(".codebox");
    if (cbox) cbox.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b || !cbox.contains(b)) return;
      var t = byId[id]; if (!t) return;
      if (b.hasAttribute("data-lang")) {
        lang = b.getAttribute("data-lang");
        try { localStorage.setItem("dsa-lang", lang); } catch (err) { /* ignore */ }
        cbox.querySelector(".lang-tabs").outerHTML = langTabs();
        cbox.querySelector(".code-list").innerHTML = t.code.map(function (c, k) { return codeCard(t, k); }).join("");
      } else if (b.hasAttribute("data-copy")) {
        var src = codeFor(t, +b.getAttribute("data-copy"), lang) || "";
        var ok = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1400); };
        try { navigator.clipboard.writeText(src).then(ok, function () { selectCode(b); }); } catch (err) { selectCode(b); }
      }
    });
    app.querySelectorAll("[data-ans]").forEach(function (b) {
      b.addEventListener("click", function () {
        var v = b.getAttribute("data-ans");
        app.querySelectorAll("[data-ans]").forEach(function (x) { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b ? "true" : "false"); });
        app.querySelectorAll("[data-pane]").forEach(function (p) { p.hidden = p.getAttribute("data-pane") !== v; });
      });
    });
    if (want15) { want15 = false; var b15 = app.querySelector('[data-ans="15"]'); if (b15) { b15.click(); var ex = document.getElementById("s-exam"); if (ex) ex.scrollIntoView(); } }
    app.querySelectorAll("[data-open15]").forEach(function (a) { a.addEventListener("click", function () { want15 = true; }); });
    var score = { r: 0, n: 0 };
    app.querySelectorAll(".mcq").forEach(function (q) {
      q.querySelectorAll(".opt").forEach(function (o) {
        o.addEventListener("click", function () {
          if (q.dataset.done) return; q.dataset.done = 1;
          var ans = +q.getAttribute("data-answer"), k = +o.getAttribute("data-k");
          q.querySelectorAll(".opt").forEach(function (x) { x.disabled = true; if (+x.getAttribute("data-k") === ans) x.classList.add("right"); });
          if (k !== ans) o.classList.add("wrong");
          var w = q.querySelector(".why"); if (w) w.hidden = false;
          score.n++; if (k === ans) score.r++;
          if (window.__dsaAnswer && q.closest(".lesson, .layout")) window.__dsaAnswer(q.getAttribute("data-mcq"), k === ans);
          var sEl = document.getElementById("qScore"); if (sEl) sEl.textContent = score.r + " / " + score.n;
        });
      });
    });
    var qr = document.getElementById("qReset"); if (qr) qr.addEventListener("click", function () { route(); });
    app.querySelectorAll("[data-unit]").forEach(function (b) { b.addEventListener("click", function () { quizState.unit = +b.getAttribute("data-unit"); quizState.idx = 0; quizState.flip = false; route(); }); });
    app.querySelectorAll("[data-mode]").forEach(function (b) { b.addEventListener("click", function () { quizState.mode = b.getAttribute("data-mode"); quizState.idx = 0; quizState.flip = false; route(); }); });
    var fc = document.getElementById("fcard"); if (fc) fc.addEventListener("click", function () { quizState.flip = !quizState.flip; fc.classList.toggle("flip", quizState.flip); });
    var fn2 = document.getElementById("fNext"); if (fn2) fn2.addEventListener("click", function () { quizState.idx = (quizState.idx + 1) % quizState.count; quizState.flip = false; route(); });
    var fp = document.getElementById("fPrev"); if (fp) fp.addEventListener("click", function () { quizState.idx = (quizState.idx - 1 + quizState.count) % quizState.count; quizState.flip = false; route(); });
    var fs = document.getElementById("fShuf"); if (fs) fs.addEventListener("click", function () { quizState.idx = Math.floor(Math.random() * quizState.count); quizState.flip = false; route(); });
    var db = document.getElementById("doneBtn");
    if (db) db.addEventListener("click", function () { done[id] = !done[id]; if (!done[id]) delete done[id]; saveDone(); toast(done[id] ? "Marked as done" : "Marked as not done"); var y = window.scrollY; route(); window.scrollTo(0, y); });
    /* highlight current jump chip */
    var chips = app.querySelectorAll("[data-jump]");
    if (chips.length && "IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (ents) { ents.forEach(function (en) { if (en.isIntersecting) { var k = en.target.id.slice(2); chips.forEach(function (c) { c.classList.toggle("on", c.getAttribute("data-jump") === k); }); } }); }, { rootMargin: "-30% 0px -60% 0px" });
      app.querySelectorAll(".block[id]").forEach(function (b) { io.observe(b); });
    }
  }
  var want15 = false;
  function selectCode(b) { var pre = b.closest(".code-card").querySelector("pre"); var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected, press copy"; }

  try { var th = localStorage.getItem("dsa-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) { /* ignore */ }
  window.addEventListener("hashchange", route);
  route();
})();

</script>

</body></html>
