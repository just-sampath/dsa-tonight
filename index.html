DSA.topics.push({
  id: "parens",
  unit: 23,
  title: "Balanced Parentheses",
  tagline: "Every bracket you open must close, in the right order",
  minutes: 15,
  analogy: `<p>Think of tiffin boxes stacked inside one another: a big box, a medium box inside it, a small box inside that. To pack them properly you must close the small one first, then the medium, then the big one. Closing the big lid while the small box is still open does not work.</p>
<p>Brackets in an expression behave the same way. The bracket opened <b>last</b> must be closed <b>first</b>. "Last opened, first closed" is LIFO, which is why a stack solves this problem.</p>`,
  learn: `<h3>The problem</h3>
<p>Given an expression such as <code>{[(a+b)*c]-d}</code>, decide whether its brackets are <b>balanced</b>.</p>
<div class="def">An expression has balanced parentheses when every opening bracket has a matching closing bracket of the same type, and the pairs are properly nested (the most recently opened bracket is closed first).</div>
<p>Three bracket types: <code>( )</code> round, <code>[ ]</code> square, <code>{ }</code> curly. Letters and operators do not matter; we skip them.</p>
<p>An expression is unbalanced in exactly three ways:</p>
<ul>
<li><b>Mismatch</b>: a closer meets an opener of another type, e.g. <code>( ]</code>.</li>
<li><b>Extra closer</b>: a closer arrives when nothing is open, e.g. <code>(a+b))</code>.</li>
<li><b>Leftover opener</b>: the expression ends while something is still open, e.g. <code>((a+b)</code>.</li>
</ul>

<h3>Why not just count brackets?</h3>
<p>Counting fails on <code>([)]</code>: two openers, two closers, yet it is wrong, because <code>(</code> was opened last but <code>]</code> tries to close first. Counting also cannot tell the types apart. We need to remember the <b>order</b> of openers, and the latest one must be checked first. That is a stack.</p>

<h3>Algorithm</h3>
<pre class="code">1. Create an empty stack.
2. Scan the expression left to right.
   a. Symbol is ( [ or {  : push it.
   b. Symbol is ) ] or }  :
      - stack empty?
          UNBALANCED (extra closer)
      - pop the top. Not the matching
        opener?
          UNBALANCED (mismatch)
   c. Any other symbol    : ignore it.
3. After the scan:
   stack empty     : BALANCED
   stack not empty : UNBALANCED
                     (leftover opener)</pre>

<h3>Trace 1: <code>{[(a+b)*c]-d}</code> (balanced)</h3>
<p>Only brackets are shown; letters and operators are skipped.</p>
<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom to top)</th></tr></thead><tbody><tr><td>{</td><td>push</td><td>{</td></tr><tr><td>[</td><td>push</td><td>{[</td></tr><tr><td>(</td><td>push</td><td>{[(</td></tr><tr><td>)</td><td>pop ( (match)</td><td>{[</td></tr><tr><td>]</td><td>pop [ (match)</td><td>{</td></tr><tr><td>}</td><td>pop { (match)</td><td>(empty)</td></tr><tr><td>end</td><td>stack empty</td><td>(empty)</td></tr></tbody></table>
<p>Every closer found its partner on top and the stack is empty at the end, so the expression is <b>balanced</b>.</p>

<h3>Trace 2: <code>{(a+b]*c}</code> (mismatch)</h3>
<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom to top)</th></tr></thead><tbody><tr><td>{</td><td>push</td><td>{</td></tr><tr><td>(</td><td>push</td><td>{(</td></tr><tr><td>]</td><td>top is (, does not match</td><td>{(</td></tr></tbody></table>
<p><code>]</code> arrives but the top is <code>(</code>. Wrong type, so <b>unbalanced</b>. We stop right there.</p>

<h3>Trace 3: <code>((a+b)*c</code> (leftover opener)</h3>
<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom to top)</th></tr></thead><tbody><tr><td>(</td><td>push</td><td>(</td></tr><tr><td>(</td><td>push</td><td>((</td></tr><tr><td>)</td><td>pop ( (match)</td><td>(</td></tr><tr><td>end</td><td>stack not empty</td><td>(</td></tr></tbody></table>
<p>The scan ends with <code>(</code> still on the stack, so <b>unbalanced</b>: one bracket was never closed.</p>

<h3>Trace 4: <code>(a+b))*c</code> (extra closer)</h3>
<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom to top)</th></tr></thead><tbody><tr><td>(</td><td>push</td><td>(</td></tr><tr><td>)</td><td>pop ( (match)</td><td>(empty)</td></tr><tr><td>)</td><td>stack empty: no opener</td><td>(empty)</td></tr></tbody></table>
<p>The second <code>)</code> finds an empty stack, so <b>unbalanced</b>.</p>

<h3>Complexity</h3>
<ul>
<li>Time: <b>O(n)</b> for an expression of n characters. Each character is looked at once and push/pop are O(1).</li>
<li>Space: <b>O(n)</b> in the worst case, when the expression is all openers like <code>((((</code>.</li>
</ul>

<h3>Where it is used</h3>
<p>Compilers check brackets in your C program (a missing <code>}</code> is reported as a syntax error), code editors highlight matching brackets, and calculators check expressions before evaluating them. It is also step zero before converting infix to postfix.</p>`,
  widget: "paren-demo",
  preset: { expr: "{[(a+b)*c]-d}" },
  widgetIntro: `<p>Step through <code>{[(a+b)*c]-d}</code> and watch each opener get pushed and popped. Then change it to <code>{(a+b]*c}</code> or <code>((a+b)*c</code> to see the two ways it can fail.</p>`,
  code: [
    { title: "Balanced parentheses checker (full program)", src: `/* Balanced brackets check using a stack */
#include <stdio.h>
#include <string.h>
#define MAX 100

char stack[MAX];
int top = -1;

void push(char c) { stack[++top] = c; }
char pop()        { return stack[top--]; }

/* returns 1 if open and close are a matching pair */
int isPair(char open, char close)
{
    return (open == '(' && close == ')') ||
           (open == '[' && close == ']') ||
           (open == '{' && close == '}');
}

int isBalanced(char exp[])
{
    int i;
    char ch;
    top = -1; /* start with empty stack */
    for (i = 0; exp[i] != '\\0'; i++) {
        ch = exp[i];
        if (ch == '(' || ch == '[' || ch == '{') {
            if (top == MAX - 1)
                return 0; /* too deep, treat as error */
            push(ch);
        }
        else if (ch == ')' || ch == ']' || ch == '}') {
            if (top == -1)
                return 0; /* closer with no opener */
            if (!isPair(pop(), ch))
                return 0; /* wrong type of bracket */
        }
        /* any other character is ignored */
    }
    return top == -1; /* leftover opener = unbalanced */
}

int main()
{
    char exp[MAX];
    printf("Enter expression: ");
    if (fgets(exp, MAX, stdin) == NULL)
        return 0;
    /* remove the newline */
    exp[strcspn(exp, "\\n")] = '\\0';

    if (isBalanced(exp))
        printf("Balanced\\n");
    else
        printf("Not balanced\\n");
    return 0;
}` }
  ],
  exam8: `<div class="marks">Definition 1 + Why stack 1 + Algorithm 3 + Worked examples (balanced and unbalanced) 2 + Complexity 1</div>
<h4>Definition</h4>
<div class="def">An expression is said to have balanced parentheses if every opening bracket has a corresponding closing bracket of the same type and the brackets are correctly nested, i.e. the bracket opened last is closed first.</div>
<h4>Why a stack</h4>
<p>The last bracket opened must be the first one closed, which is LIFO. So we push openers and, on each closer, compare with the top of the stack.</p>
<h4>Algorithm</h4>
<pre class="code">Step 1: Create an empty stack S
Step 2: For each symbol ch, from left to right:
        if ch is '(' or '[' or '{' then push(S, ch)
        else if ch is ')' or ']' or '}' then

            top = pop(S)

DSA.topics.push({
  id: "postfix",
  unit: 23,
  title: "Infix to Postfix (and evaluation)",
  tagline: "Rewrite expressions so a computer never needs brackets",
  minutes: 35,
  analogy: `<p>Imagine a cook reading a recipe card. "Add salt to the dal after you boil the rice and water" makes the cook jump back and forth. A clearer card lists things in the exact order they happen: "rice, water, boil, dal, salt, add". Every action comes right after the things it works on.</p>
<p>Postfix notation is that clearer card for a computer. <code>A+B*C</code> becomes <code>ABC*+</code>: take A, B, C, multiply the last two, then add. No brackets, no precedence rules to remember while calculating, just one left to right pass with a stack.</p>`,
  learn: `<h3>Words first</h3>
<ul>
<li><b>Operand</b>: a value or variable, like <code>A</code>, <code>B</code>, <code>5</code>.</li>
<li><b>Operator</b>: a symbol that acts on operands, like <code>+ - * / % ^</code> (<code>^</code> means power).</li>
<li><b>Expression</b>: operands joined by operators, like <code>A+B*C</code>.</li>
</ul>

<h3>Three ways to write the same expression</h3>
<ul>
<li><b>Infix</b>: operator <b>between</b> operands: <code>A+B</code>. This is how we normally write.</li>
<li><b>Prefix</b> (Polish notation): operator <b>before</b> operands: <code>+AB</code>.</li>
<li><b>Postfix</b> (Reverse Polish notation): operator <b>after</b> operands: <code>AB+</code>.</li>
</ul>
<table><thead><tr><th>Infix</th><th>Prefix</th><th>Postfix</th></tr></thead><tbody>
<tr><td>A+B</td><td>+AB</td><td>AB+</td></tr>
<tr><td>A+B*C</td><td>+A*BC</td><td>ABC*+</td></tr>
<tr><td>(A+B)*C</td><td>*+ABC</td><td>AB+C*</td></tr>
<tr><td>(A+B)*(C-D)</td><td>*+AB-CD</td><td>AB+CD-*</td></tr>
</tbody></table>
<p>Notice: the operands A, B, C, D stay in the <b>same order</b> in all three forms. Only the operators move.</p>

<h3>Why do computers like postfix?</h3>
<ul>
<li>No brackets are needed. <code>(A+B)*C</code> and <code>A+B*C</code> have different postfix forms, so the meaning is already built in.</li>
<li>No precedence rules are needed while evaluating. Just read left to right.</li>
<li>Evaluation needs only one scan and one stack, so it is fast: O(n).</li>
<li>Compilers convert infix expressions in your program into postfix (or a similar form) before generating machine code.</li>
</ul>

<h3>Precedence and associativity</h3>
<p><b>Precedence</b> decides which operator is applied first (<code>*</code> before <code>+</code>). <b>Associativity</b> decides the order when two operators of the same precedence meet.</p>
<table><thead><tr><th>Operator</th><th>Precedence</th><th>Associativity</th></tr></thead><tbody>
<tr><td>( )</td><td>Brackets first</td><td>innermost first</td></tr>
<tr><td>^</td><td>3 (highest)</td><td>Right to left</td></tr>
<tr><td>* / %</td><td>2</td><td>Left to right</td></tr>
<tr><td>+ -</td><td>1 (lowest)</td><td>Left to right</td></tr>
</tbody></table>
<ul>
<li>Left to right: <code>A-B-C</code> means <code>(A-B)-C</code>, postfix <code>AB-C-</code>.</li>
<li>Right to left: <code>A^B^C</code> means <code>A^(B^C)</code>, postfix <code>ABC^^</code>. Check: <code>2^3^2 = 2^9 = 512</code>, not 64.</li>
</ul>

<h3>Conversion algorithm (infix to postfix)</h3>
<p>Operands go straight to the output. Operators wait on a stack until it is safe to write them.</p>
<pre class="code">Scan the infix expression left to right.
For each symbol:
1. Operand (A, B, 5 ...): add it to postfix.
2. '(' : push it.
3. ')' : pop and add to postfix until '('
         is on top. Pop the '(' and throw
         it away.
4. Operator op:
   while stack not empty AND top != '(' AND
     ( prec(top) &gt; prec(op)  OR
       prec(top) == prec(op) AND
       op is left associative ):
         pop and add to postfix
   push op
5. At the end, pop everything left and add
   it to postfix.</pre>
<div class="tip">Simple form to remember: for <code>+ - * / %</code>, pop while the top has precedence <b>greater than or equal</b> to the incoming one. For <code>^</code>, pop only while the top is <b>strictly greater</b>, so <code>^</code> on <code>^</code> is pushed, not popped.</div>

<h3>Example 1: <code>A+B*(C-D)/E</code></h3>
<table><thead><tr><th>Symbol</th><th>Stack</th><th>Postfix</th></tr></thead><tbody><tr><td>A</td><td>(empty)</td><td>A</td></tr><tr><td>+</td><td>+</td><td>A</td></tr><tr><td>B</td><td>+</td><td>AB</td></tr><tr><td>*</td><td>+*</td><td>AB</td></tr><tr><td>(</td><td>+*(</td><td>AB</td></tr><tr><td>C</td><td>+*(</td><td>ABC</td></tr><tr><td>-</td><td>+*(-</td><td>ABC</td></tr><tr><td>D</td><td>+*(-</td><td>ABCD</td></tr><tr><td>)</td><td>+*</td><td>ABCD-</td></tr><tr><td>/</td><td>+/</td><td>ABCD-*</td></tr><tr><td>E</td><td>+/</td><td>ABCD-*E</td></tr><tr><td>end</td><td>(empty)</td><td>ABCD-*E/+</td></tr></tbody></table>
<p>What happened at the key steps:</p>
<ul>
<li><code>*</code> came while <code>+</code> was on top. <code>*</code> is higher, so nothing was popped; push.</li>
<li><code>(</code> is always pushed. <code>-</code> sits on top of <code>(</code>, so it is pushed.</li>
<li><code>)</code> popped <code>-</code> to the output, then removed <code>(</code>.</li>
<li><code>/</code> came with <code>*</code> on top: equal precedence and left associative, so <code>*</code> was popped. Then <code>+</code> is lower, so stop and push <code>/</code>.</li>
<li>At the end, <code>/</code> then <code>+</code> were popped.</li>
</ul>
<p>Answer: <b>ABCD-*E/+</b></p>

<h3>Example 2 (with power): <code>A+B*C^D^E-F</code></h3>
<table><thead><tr><th>Symbol</th><th>Stack</th><th>Postfix</th></tr></thead><tbody><tr><td>A</td><td>(empty)</td><td>A</td></tr><tr><td>+</td><td>+</td><td>A</td></tr><tr><td>B</td><td>+</td><td>AB</td></tr><tr><td>*</td><td>+*</td><td>AB</td></tr><tr><td>C</td><td>+*</td><td>ABC</td></tr><tr><td>^</td><td>+*^</td><td>ABC</td></tr><tr><td>D</td><td>+*^</td><td>ABCD</td></tr><tr><td>^</td><td>+*^^</td><td>ABCD</td></tr><tr><td>E</td><td>+*^^</td><td>ABCDE</td></tr><tr><td>-</td><td>-</td><td>ABCDE^^*+</td></tr><tr><td>F</td><td>-</td><td>ABCDE^^*+F</td></tr><tr><td>end</td><td>(empty)</td><td>ABCDE^^*+F-</td></tr></tbody></table>
<ul>
<li>The second <code>^</code> found <code>^</code> on top. Because <code>^</code> is right associative we do <b>not</b> pop; we push. That makes <code>D^E</code> happen first.</li>
<li><code>-</code> has the lowest precedence, so it popped <code>^ ^ * +</code> (all have precedence greater than or equal to 1).</li>
</ul>
<p>Answer: <b>ABCDE^^*+F-</b></p>
<div class="tip">Quick self-check: fully bracket the expression by precedence, then move each operator just after its right bracket. <code>A+B*C</code> becomes <code>(A+(B*C))</code>, then <code>(A(BC*)+)</code>, then <code>ABC*+</code>. Use this to check your stack answer in the exam.</div>

<h3>Evaluating a postfix expression</h3>
<p>Now the stack holds <b>numbers</b>, not operators.</p>
<pre class="code">Scan the postfix expression left to right:
1. Operand: push its value.
2. Operator op:
     B = pop()    (first pop is the RIGHT operand)
     A = pop()    (second pop is the LEFT operand)
     push( A op B )
3. At the end, the single value left on the
   stack is the answer.</pre>
<div class="trap">The order matters for <code>-</code>, <code>/</code> and <code>^</code>. The first value popped is the right operand. For <code>82-</code> you pop 2 then 8 and compute 8 - 2 = 6, not 2 - 8.</div>

<h3>Evaluation example 1: <code>53+82-*</code></h3>
<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom to top)</th></tr></thead><tbody><tr><td>5</td><td>push 5</td><td>5</td></tr><tr><td>3</td><td>push 3</td><td>5 3</td></tr><tr><td>+</td><td>B=3, A=5, 5+3=8</td><td>8</td></tr><tr><td>8</td><td>push 8</td><td>8 8</td></tr><tr><td>2</td><td>push 2</td><td>8 8 2</td></tr><tr><td>-</td><td>B=2, A=8, 8-2=6</td><td>8 6</td></tr><tr><td>*</td><td>B=6, A=8, 8*6=48</td><td>48</td></tr></tbody></table>
<p>Answer: <b>48</b>. (This was <code>(5+3)*(8-2)</code> in infix.)</p>

<h3>Evaluation example 2: <code>562+*84/-</code></h3>
<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom to top)</th></tr></thead><tbody><tr><td>5</td><td>push 5</td><td>5</td></tr><tr><td>6</td><td>push 6</td><td>5 6</td></tr><tr><td>2</td><td>push 2</td><td>5 6 2</td></tr><tr><td>+</td><td>B=2, A=6, 6+2=8</td><td>5 8</td></tr><tr><td>*</td><td>B=8, A=5, 5*8=40</td><td>40</td></tr><tr><td>8</td><td>push 8</td><td>40 8</td></tr><tr><td>4</td><td>push 4</td><td>40 8 4</td></tr><tr><td>/</td><td>B=4, A=8, 8/4=2</td><td>40 2</td></tr><tr><td>-</td><td>B=2, A=40, 40-2=38</td><td>38</td></tr></tbody></table>
<p>Answer: <b>38</b>. (Infix: <code>5*(6+2)-8/4</code>.)</p>

<h3>Infix to prefix (short method)</h3>
<ol>
<li>Reverse the infix expression.</li>
<li>Swap brackets: every <code>(</code> becomes <code>)</code> and every <code>)</code> becomes <code>(</code>.</li>
<li>Convert this to postfix with the stack, with one change in associativity: for <code>+ - * / %</code> pop only while the top has <b>strictly greater</b> precedence; for <code>^</code> pop while the top has <b>greater or equal</b> precedence.</li>
<li>Reverse the result. That is the prefix expression.</li>
</ol>
<p>Example: <code>A+B*C-D/E</code>. Step 1 and 2 give <code>E/D-C*B+A</code> (no brackets to swap). Step 3:</p>
<table><thead><tr><th>Symbol</th><th>Stack</th><th>Output</th></tr></thead><tbody><tr><td>E</td><td>(empty)</td><td>E</td></tr><tr><td>/</td><td>/</td><td>E</td></tr><tr><td>D</td><td>/</td><td>ED</td></tr><tr><td>-</td><td>-</td><td>ED/</td></tr><tr><td>C</td><td>-</td><td>ED/C</td></tr><tr><td>*</td><td>-*</td><td>ED/C</td></tr><tr><td>B</td><td>-*</td><td>ED/CB</td></tr><tr><td>+</td><td>-+</td><td>ED/CB*</td></tr><tr><td>A</td><td>-+</td><td>ED/CB*A</td></tr><tr><td>end</td><td>(empty)</td><td>ED/CB*A+-</td></tr></tbody></table>
<p>Step 4: reverse <code>ED/CB*A+-</code> to get the prefix <b>-+A*BC/DE</b>.</p>
<p>Look at the <code>+</code> row: <code>-</code> was on top with equal precedence, and we did <b>not</b> pop it. That is the associativity change at work.</p>
<div class="trap">If you skip the associativity change, <code>A-B+C</code> wrongly becomes <code>-A+BC</code>, which means A-(B+C). The correct prefix is <code>+-ABC</code>, meaning (A-B)+C.</div>

<h3>Complexity</h3>
<p>Conversion and evaluation each scan the expression once and every symbol is pushed and popped at most once: time <b>O(n)</b>, space <b>O(n)</b> for the stack.</p>`,

  widgetIntro: `<p>Step through the conversion of <code>A+B*(C-D)/E</code> and watch when operators wait on the stack and when they are popped. Then evaluate <code>53+82-*</code> and notice that each operator pops B first, then A.</p>`,
  code: [
    { title: "Infix to postfix conversion (full program)", src: `/* Infix to postfix conversion using a stack */
#include <stdio.h>
#include <ctype.h>
#define MAX 100

char stack[MAX];
int top = -1;

void push(char c) { stack[++top] = c; }
char pop()        { return stack[top--]; }
char peek()       { return stack[top]; }

int prec(char op)
{
    if (op == '^') return 3;
    if (op == '*' || op == '/' || op == '%') return 2;
    if (op == '+' || op == '-') return 1;
    return 0;            /* '(' has the lowest value */
}

/* 1 if the operator t on top must be output before op:
   t has higher precedence, or equal precedence and op
   is left associative ('^' is right associative) */
int shouldPop(char t, char op)
{
    if (op == '^')
        return prec(t) > prec(op);
    return prec(t) >= prec(op);
}

void infixToPostfix(char infix[], char postfix[])
{
    int i, k = 0;
    char ch;
    for (i = 0; infix[i] != '\\0'; i++) {
        ch = infix[i];
        if (isalnum((unsigned char)ch))   /* operand */
            postfix[k++] = ch;
        else if (ch == '(')
            push(ch);
        else if (ch == ')') {
            while (top != -1 && peek() != '(')
                postfix[k++] = pop();
            pop(); /* discard '(' */
        }
        else {                            /* operator */
            while (top != -1 && shouldPop(peek(), ch))
                postfix[k++] = pop();
            push(ch);
        }
    }
    while (top != -1) /* empty stack */
        postfix[k++] = pop();
    postfix[k] = '\\0';
}

int main()
{
    char infix[MAX], postfix[MAX];
    printf("Enter infix expression: ");
    if (scanf("%99s", infix) != 1)
        return 0;
    infixToPostfix(infix, postfix);
    printf("Postfix: %s\\n", postfix);
    return 0;
}` },
    { title: "Postfix evaluation (full program)", src: `/* Postfix evaluation (single-digit operands) */
#include <stdio.h>
#include <ctype.h>
#define MAX 100

int stack[MAX];
int top = -1;

void push(int x) { stack[++top] = x; }
int pop()        { return stack[top--]; }

int power(int a, int b)
{
    int r = 1;
    while (b-- > 0)
        r = r * a;
    return r;
}

int evaluate(char exp[])
{
    int i, A, B;
    char ch;
    for (i = 0; exp[i] != '\\0'; i++) {
        ch = exp[i];
        if (isdigit((unsigned char)ch))
            push(ch - '0'); /* '5' becomes 5 */
        else {
            /* first pop is the RIGHT operand */
            B = pop();
            /* second pop is the LEFT operand */
            A = pop();
            switch (ch) {
            case '+': push(A + B); break;
            case '-': push(A - B); break;
            case '*': push(A * B); break;
            case '/': push(A / B); break;
            case '%': push(A % B); break;
            case '^': push(power(A, B)); break;
            }
        }
    }
    return pop(); /* the only value left */
}

int main()
{
    char exp[MAX];
    printf("Enter postfix expression: ");
    if (scanf("%99s", exp) != 1)
        return 0;
    printf("Result = %d\\n", evaluate(exp));
    return 0;
}` }

<div class="def">Infix notation places the operator between operands (A+B), prefix places it before (+AB) and postfix places it after the operands (AB+). Infix to postfix conversion uses a stack to hold operators until their operands have been written.</div>

<tr><td>+ -</td><td>Lowest (1)</td><td>Left to right</td></tr>

<p><b>Postfix: ABCD-*E/+</b></p>

<h4>5. Conversion example 2: <code>(A+B)*C-D^E^F</code></h4>
<table><thead><tr><th>Symbol</th><th>Stack</th><th>Postfix</th></tr></thead><tbody><tr><td>(</td><td>(</td><td></td></tr><tr><td>A</td><td>(</td><td>A</td></tr><tr><td>+</td><td>(+</td><td>A</td></tr><tr><td>B</td><td>(+</td><td>AB</td></tr><tr><td>)</td><td>(empty)</td><td>AB+</td></tr><tr><td>*</td><td>*</td><td>AB+</td></tr><tr><td>C</td><td>*</td><td>AB+C</td></tr><tr><td>-</td><td>-</td><td>AB+C*</td></tr><tr><td>D</td><td>-</td><td>AB+C*D</td></tr><tr><td>^</td><td>-^</td><td>AB+C*D</td></tr><tr><td>E</td><td>-^</td><td>AB+C*DE</td></tr><tr><td>^</td><td>-^^</td><td>AB+C*DE</td></tr><tr><td>F</td><td>-^^</td><td>AB+C*DEF</td></tr><tr><td>end</td><td>(empty)</td><td>AB+C*DEF^^-</td></tr></tbody></table>
<p><b>Postfix: AB+C*DEF^^-</b></p>

<h4>6. Postfix evaluation algorithm</h4>
<pre class="code">Step 1: Scan the postfix expression from left to right.
Step 2: Operand: push its value.
Step 3: Operator op:
          B = pop()   (right operand)
          A = pop()   (left operand)
          push(A op B)
Step 4: At the end, pop the result.</pre>
<pre class="code">int power(int a, int b)
{
    int r = 1;
    while (b-- &gt; 0)
        r = r * a;
    return r;
}

int evaluate(char exp[])
{
    int i, A, B;
    char ch;
    for (i = 0; exp[i] != '\\0'; i++) {
        ch = exp[i];
        if (isdigit((unsigned char)ch))
            push(ch - '0'); /* '5' becomes 5 */
        else {
            /* first pop is the RIGHT operand */
            B = pop();
            /* second pop is the LEFT operand */
            A = pop();
            switch (ch) {
            case '+': push(A + B); break;
            case '-': push(A - B); break;
            case '*': push(A * B); break;
            case '/': push(A / B); break;
            case '%': push(A % B); break;
            case '^': push(power(A, B)); break;
            }
        }
    }
    return pop(); /* the only value left */
}</pre>

<h4>7. Evaluation example 1: <code>53+82-*</code></h4>
<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom to top)</th></tr></thead><tbody><tr><td>5</td><td>push 5</td><td>5</td></tr><tr><td>3</td><td>push 3</td><td>5 3</td></tr><tr><td>+</td><td>B=3, A=5, 5+3=8</td><td>8</td></tr><tr><td>8</td><td>push 8</td><td>8 8</td></tr><tr><td>2</td><td>push 2</td><td>8 8 2</td></tr><tr><td>-</td><td>B=2, A=8, 8-2=6</td><td>8 6</td></tr><tr><td>*</td><td>B=6, A=8, 8*6=48</td><td>48</td></tr></tbody></table>
<p><b>Result = 48</b></p>

<h4>8. Evaluation example 2: evaluate <code>A+B*(C-D)/E</code> for A=2, B=6, C=5, D=3, E=4</h4>
<p>Postfix from section 4 is <code>ABCD-*E/+</code>. Put in the values: <code>2653-*4/+</code>.</p>
<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom to top)</th></tr></thead><tbody><tr><td>2</td><td>push 2</td><td>2</td></tr><tr><td>6</td><td>push 6</td><td>2 6</td></tr><tr><td>5</td><td>push 5</td><td>2 6 5</td></tr><tr><td>3</td><td>push 3</td><td>2 6 5 3</td></tr><tr><td>-</td><td>B=3, A=5, 5-3=2</td><td>2 6 2</td></tr><tr><td>*</td><td>B=2, A=6, 6*2=12</td><td>2 12</td></tr><tr><td>4</td><td>push 4</td><td>2 12 4</td></tr><tr><td>/</td><td>B=4, A=12, 12/4=3</td><td>2 3</td></tr><tr><td>+</td><td>B=3, A=2, 2+3=5</td><td>5</td></tr></tbody></table>
<p><b>Result = 5</b>. Check in infix: 2 + 6*(5-3)/4 = 2 + 12/4 = 2 + 3 = 5.</p>

<h4>9. Infix to prefix (note)</h4>
<p>Reverse the infix, swap ( and ), convert to postfix (pop only on strictly higher precedence for left associative operators), then reverse. Example: <code>A+B*C-D/E</code> gives prefix <code>-+A*BC/DE</code>.</p>

<tr><td>Infix to postfix</td><td>O(n)</td><td>O(n)</td></tr>
<tr><td>Postfix evaluation</td><td>O(n)</td><td>O(n)</td></tr>
</tbody></table>`,

DSA.topics.push({
 "id": "trees",
 "unit": 24,
 "title": "Trees, Binary Trees and BST",
 "tagline": "Family trees for data: find anything by going left or right",
 "minutes": 35,
 "analogy": "<p>Think of your family tree. Your grandfather is at the top. Below him are his children (your father, uncles, aunts), and below them are their children (you and your cousins). Everyone has exactly one parent line going up, and the person at the top has no parent. That top person is the <b>root</b>, and people with no children are <b>leaves</b>.</p>\n<p>A Binary Search Tree is like playing \"guess the number between 1 and 100\" with a friend who says \"smaller\" or \"bigger\". You start at 50, then jump to 25 or 75, and so on. Each answer throws away half the numbers, so you find it in about 7 guesses instead of 100.</p>",
 "learn": "\n<h3>Why do we need trees?</h3>\n<p>Arrays, linked lists, stacks and queues are <b>linear</b>: items sit in one line, one after another. Many things in life are not a line. A family has a grandfather, his children, their children. A phone has folders inside folders. A college has a Principal, then HODs, then teachers. To store such <b>hierarchical</b> (top to bottom, boss to worker) data we use a <b>tree</b>.</p>\n<div class=\"def\">A tree is a non-linear data structure made of nodes connected by edges, with one special node called the root, and every other node having exactly one parent.</div>\n\n<h3>Tree words you must know</h3>\n<p>We will use this one tree for every definition. Learn the words with it.</p>\n<pre class=\"diagram\">   ____A___\n  /        \\\n _B__     _C_\n/    \\   /   \\\nD    E   F   G\n    /\n    H</pre>\n<table><thead><tr><th>Term</th><th>Meaning</th><th>In the tree above</th></tr></thead><tbody>\n<tr><td>Node</td><td>One element (data + links)</td><td>A, B, ... H (8 nodes)</td></tr>\n<tr><td>Root</td><td>Top node, has no parent</td><td>A</td></tr>\n<tr><td>Edge</td><td>Line joining parent and child</td><td>A-B, B-E ... (7 edges)</td></tr>\n<tr><td>Parent</td><td>Node just above a node</td><td>B is parent of D and E</td></tr>\n<tr><td>Child</td><td>Node just below a node</td><td>F and G are children of C</td></tr>\n<tr><td>Siblings</td><td>Children of the same parent</td><td>D and E; F and G</td></tr>\n<tr><td>Leaf (external node)</td><td>Node with no children</td><td>D, H, F, G</td></tr>\n<tr><td>Internal node</td><td>Node with at least one child</td><td>A, B, C, E</td></tr>\n<tr><td>Path</td><td>Sequence of edges from one node to another</td><td>A to H: A-B-E-H</td></tr>\n<tr><td>Degree of a node</td><td>Number of children it has</td><td>B = 2, E = 1, D = 0</td></tr>\n<tr><td>Degree of tree</td><td>Largest degree of any node</td><td>2</td></tr>\n<tr><td>Level</td><td>Root is level 0, its children level 1, and so on</td><td>H is at level 3</td></tr>\n<tr><td>Depth of a node</td><td>Number of edges from the root to it</td><td>depth(E) = 2</td></tr>\n<tr><td>Height of a node</td><td>Edges on the longest path from it down to a leaf</td><td>height(E) = 1, height(D) = 0</td></tr>\n<tr><td>Height of tree</td><td>Height of the root</td><td>3 (path A-B-E-H)</td></tr>\n<tr><td>Subtree</td><td>A node with all its descendants</td><td>B, D, E, H form A's left subtree</td></tr>\n<tr><td>Ancestor / descendant</td><td>Nodes above / below on the path</td><td>A, B, E are ancestors of H</td></tr>\n</tbody></table>\n<div class=\"tip\">Convention used on this site: height of a single node = 0 and height of an empty tree = -1 (we count edges). Some textbooks count nodes instead, so a single node has height 1. Both are fine in the exam if you write which one you are using in one line.</div>\n\n<h3>Binary tree</h3>\n<div class=\"def\">A binary tree is a tree in which every node has at most two children, called the left child and the right child.</div>\n<p>\"At most two\" means 0, 1 or 2. The order matters: a left child and a right child are different positions.</p>\n\n<h3>Types of binary trees</h3>\n<pre class=\"diagram\">Full (strict): 0 or 2 children each\n    A\n   / \\\n  B   C\n     / \\\n    D   E\n\nComplete: levels full, last level\nfilled from the LEFT\n      A\n     / \\\n    B   C\n   /\n  D\n\nPerfect: all leaves on one level\n      A\n     / \\\n    B   C\n   / \\ / \\\n  D  E F  G\n\nSkewed: one child per node\n    A      A\n   /        \\\n  B          B\n /            \\\nC              C</pre>\n<ul>\n<li><b>Full (strict) binary tree</b>: every node has 0 or 2 children, never exactly 1.</li>\n<li><b>Complete binary tree</b>: every level is completely filled except possibly the last, and the last level is filled from left to right with no gaps. (A heap is a complete binary tree.)</li>\n<li><b>Perfect binary tree</b>: every internal node has 2 children and all leaves are on the same level.</li>\n<li><b>Skewed binary tree</b>: every node except the last one has exactly one child, all on the left (left-skewed) or all on the right (right-skewed). It looks like a linked list.</li>\n</ul>\n\n<h3>Important properties (with height = edges)</h3>\n<ul>\n<li>Maximum nodes at level <code>l</code> = <code>2^l</code> (level 0 has 1, level 1 has 2, level 2 has 4).</li>\n<li>Maximum nodes in a binary tree of height <code>h</code> = <code>2^(h+1) - 1</code>. Example: h = 2 gives 7 nodes. (If your book uses height of one node = 1, the formula becomes <code>2^h - 1</code>.)</li>\n<li>A tree with <code>n</code> nodes has exactly <code>n - 1</code> edges (every node except the root has one edge to its parent).</li>\n<li>Minimum height with <code>n</code> nodes = <code>floor(log2 n)</code>; maximum height = <code>n - 1</code> (skewed).</li>\n<li>In a full binary tree, leaves = internal nodes + 1.</li>\n</ul>\n\n<h3>Storing a binary tree in memory</h3>\n<p><b>1. Array (sequential) representation.</b> Put the root at index 0. For a node at index <code>i</code>: left child at <code>2i+1</code>, right child at <code>2i+2</code>, parent at <code>(i-1)/2</code> (integer division).</p>\n<pre class=\"diagram\">      A            index: 0\n     / \\\n    B   C          1, 2\n   / \\ / \\\n  D  E F  G        3, 4, 5, 6\n\n+---+---+---+---+---+---+---+\n| A | B | C | D | E | F | G |\n+---+---+---+---+---+---+---+\n  0   1   2   3   4   5   6</pre>\n<p>Check: B is at 1, its children are at 2(1)+1 = 3 (D) and 2(1)+2 = 4 (E). Good for complete trees. For a skewed tree most slots stay empty, so memory is wasted. (With 1-based indexing the rules are <code>2i</code>, <code>2i+1</code> and parent <code>i/2</code>.)</p>\n<p><b>2. Linked representation.</b> Each node is a structure with data and two pointers.</p>\n<pre class=\"code\">struct node {\n    int data;\n    struct node *left;   /* left child  */\n    struct node *right;  /* right child */\n};</pre>\n<pre class=\"diagram\">          +------+---+------+\n root --&gt; | left | A | right|\n          +--|---+---+---|--+\n             v           v\n           [B node]    [C node]</pre>\n<p>A missing child is stored as <code>NULL</code>. Nodes are created with <code>malloc</code>, so the tree can grow and shrink. This is the method used in almost all programs.</p>\n\n<h3>Tree traversals (visiting every node once)</h3>\n<pre class=\"diagram\">Preorder : Root  Left  Right\nInorder  : Left  Root  Right\nPostorder: Left  Right Root\n(the word tells you where ROOT goes)</pre>\n<p>For the tree at the top of this page:</p>\n<ul>\n<li><b>Preorder</b> (Root, Left, Right): <code>A B D E H C F G</code></li>\n<li><b>Inorder</b> (Left, Root, Right): <code>D B H E A F C G</code></li>\n<li><b>Postorder</b> (Left, Right, Root): <code>D H E B F G C A</code></li>\n<li><b>Level order</b> (level by level, left to right, uses a queue): <code>A B C D E F G H</code></li>\n</ul>\n<div class=\"trap\">Do the traversal recursively on every subtree, not only at the root. In inorder, the left subtree of A is B, D, E, H, and inside it we again do left (D), root (B), right (E's subtree: H then E). That is why inorder gives D B H E, not D B E H.</div>\n\n<h3>Binary Search Tree (BST)</h3>\n<div class=\"def\">A Binary Search Tree is a binary tree in which, for every node, all keys in its left subtree are smaller than the node's key and all keys in its right subtree are larger. (No duplicates.)</div>\n<p>This rule lets us search like the \"guess the number\" game: at each node we throw away one half.</p>\n<p><b>Insert</b>: start at the root; if the new key is smaller go left, if larger go right; when you reach an empty (NULL) place, put the new node there. Let us insert <code>50, 30, 70, 20, 40, 60, 80, 35, 65</code> one by one:</p>\n<table><thead><tr><th>Key</th><th>How we find its place</th></tr></thead><tbody><tr><td>50</td><td>Tree empty, so 50 becomes the root</td></tr><tr><td>30</td><td>30 &lt; 50, go left; place here</td></tr><tr><td>70</td><td>70 &gt; 50, go right; place here</td></tr><tr><td>20</td><td>20 &lt; 50, go left; 20 &lt; 30, go left; place here</td></tr><tr><td>40</td><td>40 &lt; 50, go left; 40 &gt; 30, go right; place here</td></tr><tr><td>60</td><td>60 &gt; 50, go right; 60 &lt; 70, go left; place here</td></tr><tr><td>80</td><td>80 &gt; 50, go right; 80 &gt; 70, go right; place here</td></tr><tr><td>35</td><td>35 &lt; 50, go left; 35 &gt; 30, go right; 35 &lt; 40, go left; place here</td></tr><tr><td>65</td><td>65 &gt; 50, go right; 65 &lt; 70, go left; 65 &gt; 60, go right; place here</td></tr></tbody></table>\n<pre class=\"diagram\">    ____50_____\n   /           \\\n  30___     __70_\n /     \\   /     \\\n20    40  60_   80\n     /       \\\n    35      65</pre>\n<p><b>Search</b> for 65: 65 &gt; 50 go right, 65 &lt; 70 go left, 65 &gt; 60 go right, found 65. Only 4 comparisons. Search for 45: 50, 30, 40, then the right child of 40 is NULL, so 45 is not present.</p>\n<p><b>Inorder of a BST is always sorted</b>: <code>20 30 35 40 50 60 65 70 80</code>. This is a favourite exam question.</p>\n\n<h3>Deleting from a BST (three cases)</h3>\n<pre class=\"diagram\">Case 1: leaf        Case 2: one child\n delete 20           delete 40\n    30                  30\n   /  \\                   \\\n 20    40     --&gt;          40\n                          /\n  (just remove)          35\n                    (link 30 to 35)\n\nCase 3: two children (delete 50)\nreplace 50 by inorder successor 60\n(smallest key in the right subtree)</pre>\n<p><b>Case 1, leaf node</b> (no child): just remove it and set the parent's pointer to NULL. Delete 20:</p>\n<pre class=\"diagram\">  ____50_____\n /           \\\n30___     __70_\n     \\   /     \\\n    40  60_   80\n   /       \\\n  35      65</pre>\n<p><b>Case 2, one child</b>: link the parent directly to that child. Delete 40 (its only child is 35):</p>\n<pre class=\"diagram\">  __50_____\n /         \\\n30_     __70_\n   \\   /     \\\n  35  60_   80\n         \\\n        65</pre>\n<p><b>Case 3, two children</b>: find the <b>inorder successor</b> (the smallest key in the right subtree: go right once, then keep going left). Copy it into the node, then delete the successor from the right subtree (it has at most one child, so it is case 1 or 2). Delete 50: successor is 60. Copy 60 into the root, then remove the old 60 (it had one child, 65, which moves up).</p>\n<pre class=\"diagram\">  __60___\n /       \\\n30_     70_\n   \\   /   \\\n  35  65  80</pre>\n<p>Inorder after the three deletions: <code>30 35 60 65 70 80</code>, still sorted, so the BST rule is safe.</p>\n<div class=\"tip\">Some books use the inorder predecessor (largest key in the left subtree) instead. Both are correct; this site uses the successor.</div>\n\n<h3>How fast is a BST?</h3>\n<p>Every operation walks one path from the root, so the time depends on the height <code>h</code>. If the tree is balanced, <code>h</code> is about <code>log2 n</code>, so search, insert and delete take <b>O(log n)</b>. If keys arrive in sorted order (10, 20, 30, 40) the tree becomes skewed like a linked list and the time becomes <b>O(n)</b>:</p>\n<pre class=\"diagram\">10_\n   \\\n  20_\n     \\\n    30_\n       \\\n      40</pre>\n<p>This weakness is the reason AVL trees were invented (next topics).</p>\n",

 "widgetIntro": "<p>The demo builds the exact tree from the lesson (50, 30, 70, 20, 40, 60, 80, 35, 65). Search for 65 and 45 and watch the path, then try the three delete cases: 20 (leaf), 40 (one child) and 50 (two children). Run each traversal and check it matches the notes.</p>",
 "code": [

   "title": "BST: insert, search and traversals (complete program)",
   "src": "#include <stdio.h>\n#include <stdlib.h>\n\nstruct node {\n    int data;\n    struct node *left, *right;\n};\n\nstruct node *newNode(int x) {\n    struct node *t = (struct node *)malloc(sizeof(struct node));\n    t->data = x;\n    t->left = t->right = NULL;\n    return t;\n}\n\n/* Insert x and return the (possibly new) root */\nstruct node *insert(struct node *root, int x) {\n    if (root == NULL)\n        return newNode(x);\n    if (x < root->data)\n        root->left = insert(root->left, x);\n    else if (x > root->data)\n        root->right = insert(root->right, x);\n    /* equal keys are ignored: no duplicates */\n    return root;\n}\n\n/* Returns the node holding key, or NULL */\nstruct node *search(struct node *root, int key) {\n    while (root != NULL && root->data != key) {\n        if (key < root->data)\n            root = root->left;\n        else\n            root = root->right;\n    }\n    return root;\n}\n\nvoid inorder(struct node *root) {\n    if (root != NULL) {\n        inorder(root->left);\n        printf(\"%d \", root->data);\n        inorder(root->right);\n    }\n}\n\nvoid preorder(struct node *root) {\n    if (root != NULL) {\n        printf(\"%d \", root->data);\n        preorder(root->left);\n        preorder(root->right);\n    }\n}\n\nvoid postorder(struct node *root) {\n    if (root != NULL) {\n        postorder(root->left);\n        postorder(root->right);\n        printf(\"%d \", root->data);\n    }\n}\n\nint main(void) {\n    int keys[] = {50, 30, 70, 20, 40, 60, 80, 35, 65};\n    int i, n = 9;\n    struct node *root = NULL;\n\n    for (i = 0; i < n; i++)\n        root = insert(root, keys[i]);\n\n    printf(\"Inorder  : \"); inorder(root);   printf(\"\\n\");\n    printf(\"Preorder : \"); preorder(root);  printf(\"\\n\");\n    printf(\"Postorder: \"); postorder(root); printf(\"\\n\");\n\n    if (search(root, 65) != NULL)\n        printf(\"65 found\\n\");\n    if (search(root, 45) == NULL)\n        printf(\"45 not found\\n\");\n    return 0;\n}\n"

   "src": "/* Uses struct node from the program above */\nstruct node *findMin(struct node *root) {\n    while (root->left != NULL)\n        root = root->left;\n    return root;\n}\n\nstruct node *deleteNode(struct node *root, int key) {\n    struct node *temp;\n    if (root == NULL)\n        return NULL;                      /* key not found */\n    if (key < root->data)\n        root->left = deleteNode(root->left, key);\n    else if (key > root->data)\n        root->right = deleteNode(root->right, key);\n    else {\n        /* Case 1 and 2: no child or one child */\n        if (root->left == NULL) {\n            temp = root->right;\n            free(root);\n            return temp;\n        }\n        if (root->right == NULL) {\n            temp = root->left;\n            free(root);\n            return temp;\n        }\n        /* Case 3: two children, copy inorder successor */\n        temp = findMin(root->right);\n        root->data = temp->data;\n        root->right = deleteNode(root->right, temp->data);\n    }\n    return root;\n}\n"

 "exam8": "\n<div class=\"marks\">Definitions 2 + Diagram 1 + Operations (insert, search, delete) 3 + Traversals 1 + Complexity 1</div>\n<h4>Definition</h4>\n<div class=\"def\">A binary tree is a tree where each node has at most two children (left and right). A Binary Search Tree (BST) is a binary tree in which every key in the left subtree of a node is smaller than the node and every key in the right subtree is larger.</div>\n<h4>Diagram</h4>\n<p>BST for keys 50, 30, 70, 20, 40, 60, 80, 35, 65:</p>\n<pre class=\"diagram\">    ____50_____\n   /           \\\n  30___     __70_\n /     \\   /     \\\n20    40  60_   80\n     /       \\\n    35      65</pre>\n<p>Root = 50, leaves = 20, 35, 65, 80, height = 3 (single node = 0), 9 nodes, 8 edges.</p>\n<h4>Node structure</h4>\n<pre class=\"code\">struct node {\n    int data;\n    struct node *left, *right;\n};</pre>\n<h4>Operations</h4>\n<p><b>1. Search(key)</b></p>\n<pre class=\"code\">1. t = root\n2. while t != NULL:\n     if key == t-&gt;data: return FOUND\n     if key &lt; t-&gt;data: t = t-&gt;left\n     else: t = t-&gt;right\n3. return NOT FOUND</pre>\n<p><b>2. Insert(key)</b>: search for the key; at the NULL position where the search stops, attach a new node. Example: 35 goes 50 (left), 30 (right), 40 (left), placed as left child of 40.</p>\n<p><b>3. Delete(key)</b>, three cases:</p>\n<ul>\n<li>Leaf: remove it (delete 20, the parent 30 gets NULL on the left).</li>\n<li>One child: parent links to the child (delete 40, 30 now points to 35).</li>\n<li>Two children: replace with the inorder successor (smallest in right subtree), then delete the successor (delete 50, successor 60 takes its place).</li>\n</ul>\n<pre class=\"diagram\">  __60___\n /       \\\n30_     70_\n   \\   /   \\\n  35  65  80</pre>\n<p>(Tree after deleting 20, 40 and 50 in that order.)</p>\n<h4>Traversals of the original tree</h4>\n<ul>\n<li>Inorder (L, Root, R): 20 30 35 40 50 60 65 70 80 (always sorted for a BST)</li>\n<li>Preorder (Root, L, R): 50 30 20 40 35 70 60 65 80</li>\n<li>Postorder (L, R, Root): 20 35 40 30 65 60 80 70 50</li>\n</ul>\n<h4>Time and space complexity</h4>\n<table><thead><tr><th>Operation</th><th>Average (balanced)</th><th>Worst (skewed)</th></tr></thead><tbody>\n<tr><td>Search</td><td>O(log n)</td><td>O(n)</td></tr>\n<tr><td>Insert</td><td>O(log n)</td><td>O(n)</td></tr>\n<tr><td>Delete</td><td>O(log n)</td><td>O(n)</td></tr>\n<tr><td>Traversal</td><td>O(n)</td><td>O(n)</td></tr>\n</tbody></table>\n<p>Space: O(n) for n nodes; recursion uses O(h) stack.</p>\n<h4>Advantages, disadvantages, applications</h4>\n<ul>\n<li>Advantages: fast search, insert and delete when balanced; inorder gives sorted output for free; size is dynamic.</li>\n<li>Disadvantage: becomes skewed (O(n)) when keys come in sorted order; fixed by AVL trees.</li>\n<li>Applications: dictionaries and symbol tables in compilers, database indexing, sorted contact lists, range searches.</li>\n</ul>\n",
 "exam15": "\n<div class=\"marks\">Tree terms 2 + Binary tree types 2 + Representation 2 + Traversals with example 3 + BST insert/search/delete with example 4 + Code/complexity 2</div>\n<h4>1. Tree and terminology</h4>\n<div class=\"def\">A tree is a non-linear, hierarchical data structure of nodes joined by edges, with one root node and every other node having exactly one parent.</div>\n<pre class=\"diagram\">   ____A___\n  /        \\\n _B__     _C_\n/    \\   /   \\\nD    E   F   G\n    /\n    H</pre>\n<ul>\n<li>Root: A. Leaves: D, H, F, G. Internal nodes: A, B, C, E.</li>\n<li>Parent of E is B; children of C are F and G; D and E are siblings.</li>\n<li>Degree of B = 2, of E = 1; degree of the tree = 2.</li>\n<li>Level of root = 0; H is at level 3; depth of E = 2.</li>\n<li>Height of the tree = 3 (longest path A-B-E-H, counting edges; single node has height 0).</li>\n<li>n nodes always have n - 1 edges (8 nodes, 7 edges).</li>\n</ul>\n<h4>2. Binary tree and its types</h4>\n<p>A binary tree has at most two children per node. Types: full/strict (0 or 2 children), complete (all levels full except the last, filled left to right), perfect (all leaves on the same level, 2^(h+1) - 1 nodes), skewed (one child per node).</p>\n<pre class=\"diagram\">Full (strict): 0 or 2 children each\n    A\n   / \\\n  B   C\n     / \\\n    D   E\n\nComplete: levels full, last level\nfilled from the LEFT\n      A\n     / \\\n    B   C\n   /\n  D\n\nPerfect: all leaves on one level\n      A\n     / \\\n    B   C\n   / \\ / \\\n  D  E F  G\n\nSkewed: one child per node\n    A      A\n   /        \\\n  B          B\n /            \\\nC              C</pre>\n<p>Properties: max nodes at level l = 2^l; max nodes in height h = 2^(h+1) - 1; minimum height for n nodes = floor(log2 n).</p>\n<h4>3. Representation</h4>\n<p>Array: root at index 0, children of i at 2i+1 and 2i+2, parent at (i-1)/2. Good for complete trees, wastes space for skewed trees.</p>\n<pre class=\"diagram\">      A            index: 0\n     / \\\n    B   C          1, 2\n   / \\ / \\\n  D  E F  G        3, 4, 5, 6\n\n+---+---+---+---+---+---+---+\n| A | B | C | D | E | F | G |\n+---+---+---+---+---+---+---+\n  0   1   2   3   4   5   6</pre>\n<p>Linked: <code>struct node { int data; struct node *left, *right; };</code> with NULL for a missing child. Dynamic size, no waste, but extra memory for two pointers.</p>\n<h4>4. Traversals</h4>\n<table><thead><tr><th>Traversal</th><th>Order</th><th>Result for tree in part 1</th></tr></thead><tbody>\n<tr><td>Preorder</td><td>Root, L, R</td><td>A B D E H C F G</td></tr>\n<tr><td>Inorder</td><td>L, Root, R</td><td>D B H E A F C G</td></tr>\n<tr><td>Postorder</td><td>L, R, Root</td><td>D H E B F G C A</td></tr>\n<tr><td>Level order</td><td>level by level (queue)</td><td>A B C D E F G H</td></tr>\n</tbody></table>\n<pre class=\"code\">inorder(t):\n   if t != NULL:\n      inorder(t-&gt;left)\n      print t-&gt;data\n      inorder(t-&gt;right)</pre>\n<h4>5. Binary Search Tree</h4>\n<p>Rule: left subtree keys &lt; node &lt; right subtree keys. Construct a BST for 50, 30, 70, 20, 40, 60, 80, 35, 65:</p>\n<table><thead><tr><th>Key</th><th>Path</th></tr></thead><tbody><tr><td>50</td><td>Tree empty, so 50 becomes the root</td></tr><tr><td>30</td><td>30 &lt; 50, go left; place here</td></tr><tr><td>70</td><td>70 &gt; 50, go right; place here</td></tr><tr><td>20</td><td>20 &lt; 50, go left; 20 &lt; 30, go left; place here</td></tr><tr><td>40</td><td>40 &lt; 50, go left; 40 &gt; 30, go right; place here</td></tr><tr><td>60</td><td>60 &gt; 50, go right; 60 &lt; 70, go left; place here</td></tr><tr><td>80</td><td>80 &gt; 50, go right; 80 &gt; 70, go right; place here</td></tr><tr><td>35</td><td>35 &lt; 50, go left; 35 &gt; 30, go right; 35 &lt; 40, go left; place here</td></tr><tr><td>65</td><td>65 &gt; 50, go right; 65 &lt; 70, go left; 65 &gt; 60, go right; place here</td></tr></tbody></table>\n<pre class=\"diagram\">    ____50_____\n   /           \\\n  30___     __70_\n /     \\   /     \\\n20    40  60_   80\n     /       \\\n    35      65</pre>\n<p>Inorder: 20 30 35 40 50 60 65 70 80 (sorted). Preorder: 50 30 20 40 35 70 60 65 80. Postorder: 20 35 40 30 65 60 80 70 50.</p>\n<p><b>Search 65</b>: 50 then 70 then 60 then 65, found after 4 comparisons.</p>\n<h4>6. Deletion, three cases</h4>\n<p><b>Case 1, leaf (delete 20)</b>: remove, parent's left becomes NULL.</p>\n<pre class=\"diagram\">  ____50_____\n /           \\\n30___     __70_\n     \\   /     \\\n    40  60_   80\n   /       \\\n  35      65</pre>\n<p><b>Case 2, one child (delete 40)</b>: replace the node by its only child 35.</p>\n<pre class=\"diagram\">  __50_____\n /         \\\n30_     __70_\n   \\   /     \\\n  35  60_   80\n         \\\n        65</pre>\n<p><b>Case 3, two children (delete 50)</b>: inorder successor = smallest key in the right subtree = 60. Copy 60 into the root and delete the old 60 (which has one child, 65).</p>\n<pre class=\"diagram\">  __60___\n /       \\\n30_     70_\n   \\   /   \\\n  35  65  80</pre>\n<p>Inorder now: 30 35 60 65 70 80 (still sorted).</p>\n<h4>7. C functions</h4>\n<pre class=\"code\">struct node *insert(struct node *root, int x) {\n    if (root == NULL) {\n        root = malloc(sizeof(struct node));\n        root-&gt;data = x;\n        root-&gt;left = root-&gt;right = NULL;\n    } else if (x &lt; root-&gt;data)\n        root-&gt;left = insert(root-&gt;left, x);\n    else if (x &gt; root-&gt;data)\n        root-&gt;right = insert(root-&gt;right, x);\n    return root;\n}</pre>\n<p>Delete: if key is smaller/larger recurse left/right; when found, if left is NULL return right child, if right is NULL return left child, else copy the minimum of the right subtree and delete it from the right subtree.</p>\n<h4>8. Complexity</h4>\n<table><thead><tr><th>Operation</th><th>Best/Average</th><th>Worst (skewed)</th></tr></thead><tbody>\n<tr><td>Search / Insert / Delete</td><td>O(log n)</td><td>O(n)</td></tr>\n<tr><td>Any traversal</td><td>O(n)</td><td>O(n)</td></tr>\n<tr><td>Space</td><td>O(n)</td><td>O(n)</td></tr>\n</tbody></table>\n<p>Inserting sorted keys (10, 20, 30, 40) gives a right-skewed tree of height n - 1, so a self-balancing tree such as an AVL tree is used when O(log n) must be guaranteed.</p>\n<h4>9. Applications</h4>\n<ul><li>Searching and sorting (tree sort = insert all, then inorder).</li><li>Symbol tables in compilers, dictionaries.</li><li>Database and file indexing (generalised as B-trees).</li><li>Expression trees for arithmetic expressions.</li></ul>\n",
 "scenarios": [
  {
   "q": "A phone contact app stores lakhs of contacts and must search by name quickly and also show all contacts in alphabetical order. Which data structure would you use and why?",
   "a": "\n<p><b>Use a Binary Search Tree</b> (better, a balanced one like AVL) keyed on the name.</p>\n<ul>\n<li>Search by name: compare with the node, go left if the name comes earlier in the alphabet, right if later. A balanced tree with 1,000,000 contacts has height about 20, so about 20 comparisons instead of up to 1,000,000 in an unsorted list.</li>\n<li>New contacts can be inserted in O(log n) without shifting elements (an array would need shifting).</li>\n<li>Showing all contacts A to Z is just an <b>inorder traversal</b>, which prints names in sorted order.</li>\n<li>Deleting a contact is O(log n) using the three deletion cases.</li>\n</ul>\n<p>Small example with names inserted in order Meena, Divya, Ravi, Anil, Kiran:</p>\n<pre class=\"diagram\">      Meena\n     /     \\\n  Divya    Ravi\n  /   \\\nAnil  Kiran</pre>\n<p>Inorder: Anil, Divya, Kiran, Meena, Ravi (alphabetical). Searching \"Kiran\": Meena (go left), Divya (go right), Kiran found.</p>\n<div class=\"tip\">If the question says \"fast search, no sorted listing needed\", a hash table (O(1) average) is also a good answer. If it says \"list in alphabetical order\" or \"range of names\", a BST wins.</div>\n"
  },
  {
   "q": "Construct a BST for the keys 45, 15, 79, 90, 10, 55, 12, 20, 50. Write its inorder, preorder and postorder traversals. Then delete 15 and draw the result.",

DSA.topics.push({
 "id": "construct",
 "unit": 24,
 "title": "Constructing a Tree from Traversals",
 "tagline": "Two traversals in, one unique tree out",
 "minutes": 25,
 "analogy": "<p>Imagine a class photo where students stand in one row, and a separate list that says who the class monitor is, then the monitor of each half. The row (inorder) tells you who stands to the left or right of the monitor. The list (preorder) tells you who the monitor of each group is. With both, you can rebuild the whole seating plan. With only the list, you know the leaders but not which side everyone stands on.</p>",
 "learn": "\n<h3>What does the question want?</h3>\n<p>\"Construct a tree\" questions come in three flavours. Learn all three, they are quick marks:</p>\n<ol>\n<li>Given two traversals (preorder + inorder, or postorder + inorder), draw the unique binary tree.</li>\n<li>Given a list of keys, build a Binary Search Tree by inserting them one by one.</li>\n<li>Given a postfix expression, build an expression tree using a stack.</li>\n</ol>\n\n<h3>Why do we need the inorder?</h3>\n<p>Preorder starts with the root (Root, L, R). Postorder ends with the root (L, R, Root). So both tell us <b>who the root is</b>, but not <b>who is on the left and who is on the right</b>. Inorder (L, Root, R) does exactly that: everything written before the root in inorder is in the left subtree, everything after it is in the right subtree.</p>\n<div class=\"def\">Preorder + Inorder, or Postorder + Inorder, always gives one unique binary tree. Preorder + Postorder alone does not (except for full binary trees).</div>\n\n<h3>Method 1: Preorder + Inorder</h3>\n<pre class=\"code\">1. Take the FIRST unused letter of preorder.\n   It is the root.\n2. Find it in the inorder. Letters on its left\n   form the left subtree, letters on its right\n   form the right subtree.\n3. Repeat 1-2 for the left part, then the\n   right part.\n4. Stop when a part has one letter (a leaf)\n   or is empty.</pre>\n<div class=\"tip\">Easy rule: for any group of letters, its root is the letter of that group that comes FIRST in preorder.</div>\n<p><b>Example 1.</b> Preorder: <code>A B D E H C F G</code>, Inorder: <code>D B H E A F C G</code></p>\n<table><thead><tr><th>Root</th><th>Inorder part</th><th>Left part</th><th>Right part</th></tr></thead><tbody><tr><td>1. <b>A</b></td><td>D B H E A F C G</td><td>D B H E</td><td>F C G</td></tr><tr><td>2. <b>B</b></td><td>D B H E</td><td>D</td><td>H E</td></tr><tr><td>3. <b>D</b></td><td>D</td><td>-</td><td>- (leaf)</td></tr><tr><td>4. <b>E</b></td><td>H E</td><td>H</td><td>-</td></tr><tr><td>5. <b>H</b></td><td>H</td><td>-</td><td>- (leaf)</td></tr><tr><td>6. <b>C</b></td><td>F C G</td><td>F</td><td>G</td></tr><tr><td>7. <b>F</b></td><td>F</td><td>-</td><td>- (leaf)</td></tr><tr><td>8. <b>G</b></td><td>G</td><td>-</td><td>- (leaf)</td></tr></tbody></table>\n<p>After step 1 (A is the root, it splits the inorder):</p>\n<pre class=\"diagram\">          A\n        /   \\\n [D B H E]   [F C G]</pre>\n<p>After step 2 (B is first in preorder among D, B, H, E):</p>\n<pre class=\"diagram\">            A\n          /   \\\n         B     [F C G]\n       /   \\\n     [D]   [H E]</pre>\n<p>Finish the rest (E is the root of H E with H on its left; C is the root of F C G):</p>\n<pre class=\"diagram\">            A\n          /   \\\n         B     C\n       /   \\  / \\\n      D    E  F  G\n          /\n         H</pre>\n<p><b>Check</b>: postorder of this tree is <code>D H E B F G C A</code>. Always check by redoing one traversal; it takes one minute and catches mistakes.</p>\n\n<h3>Method 2: Postorder + Inorder</h3>\n<pre class=\"code\">1. Take the LAST unused letter of postorder.\n   It is the root.\n2. Split the inorder around it into left and\n   right parts.\n3. Repeat for each part. (Moving right to left\n   in postorder, you meet the right subtree's\n   root before the left subtree's root.)</pre>\n<div class=\"tip\">Easy rule: for any group of letters, its root is the letter of that group that comes LAST in postorder.</div>\n<p><b>Example 2.</b> Postorder: <code>G D B E H F C A</code>, Inorder: <code>D G B A E C H F</code></p>\n<table><thead><tr><th>Root</th><th>Inorder part</th><th>Left part</th><th>Right part</th></tr></thead><tbody><tr><td>1. <b>A</b></td><td>D G B A E C H F</td><td>D G B</td><td>E C H F</td></tr><tr><td>2. <b>B</b></td><td>D G B</td><td>D G</td><td>-</td></tr><tr><td>3. <b>D</b></td><td>D G</td><td>-</td><td>G</td></tr><tr><td>4. <b>G</b></td><td>G</td><td>-</td><td>- (leaf)</td></tr><tr><td>5. <b>C</b></td><td>E C H F</td><td>E</td><td>H F</td></tr><tr><td>6. <b>E</b></td><td>E</td><td>-</td><td>- (leaf)</td></tr><tr><td>7. <b>F</b></td><td>H F</td><td>H</td><td>-</td></tr><tr><td>8. <b>H</b></td><td>H</td><td>-</td><td>- (leaf)</td></tr></tbody></table>\n<pre class=\"diagram\">   _A___\n  /     \\\n _B    _C__\n/     /    \\\nD     E    F\n \\        /\n G        H</pre>\n<p>Notice D has only a <b>right</b> child G (in inorder G comes after D) and F has only a <b>left</b> child H. <b>Check</b>: preorder is <code>A B D G C E F H</code>.</p>\n\n<h3>Why preorder + postorder is not enough</h3>\n<pre class=\"diagram\"> Tree 1        Tree 2\n    A            A\n   /              \\\n  B                B\n\n Pre : A B     Pre : A B\n Post: B A     Post: B A</pre>\n<p>Both trees have the same preorder and postorder, but B is a left child in one and a right child in the other. Without inorder we cannot decide, so the tree is not unique.</p>\n\n<h3>Building a BST from a list of keys</h3>\n<p>Insert keys in the given order: start at the root, go left if smaller, right if larger, attach at the empty spot. For <code>8, 3, 10, 1, 6, 14, 4, 7, 13</code>:</p>\n<pre class=\"diagram\">  _____8__\n /        \\\n 3__     10___\n/   \\         \\\n1   6_       14\n   /  \\     /\n   4  7    13</pre>\n<p>Inorder: 1 3 4 6 7 8 10 13 14 (sorted). A shortcut worth knowing: if you are given only the <b>preorder of a BST</b>, sort it to get the inorder, then use Method 1.</p>\n\n<h3>Expression tree from postfix</h3>\n<p>An <b>expression tree</b> is a binary tree where leaves are operands (A, B, 5 ...) and internal nodes are operators (+, -, *, /). Use a stack of tree nodes:</p>\n<pre class=\"code\">for each symbol of the postfix expression:\n  if operand : make a node, push it\n  if operator: T2 = pop()   (right child)\n               T1 = pop()   (left child)\n               node = operator, left T1,\n                      right T2\n               push node\nat the end the stack holds only the root</pre>\n<p>Postfix: <code>AB+CD-*E/</code></p>\n<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom | top), subtrees in postfix</th></tr></thead><tbody><tr><td>A</td><td>operand: push node A</td><td>A</td></tr><tr><td>B</td><td>operand: push node B</td><td>A | B</td></tr><tr><td>+</td><td>operator: pop right, pop left, make <code>+</code> their parent, push</td><td>AB+</td></tr><tr><td>C</td><td>operand: push node C</td><td>AB+ | C</td></tr><tr><td>D</td><td>operand: push node D</td><td>AB+ | C | D</td></tr><tr><td>-</td><td>operator: pop right, pop left, make <code>-</code> their parent, push</td><td>AB+ | CD-</td></tr><tr><td>*</td><td>operator: pop right, pop left, make <code>*</code> their parent, push</td><td>AB+CD-*</td></tr><tr><td>E</td><td>operand: push node E</td><td>AB+CD-* | E</td></tr><tr><td>/</td><td>operator: pop right, pop left, make <code>/</code> their parent, push</td><td>AB+CD-*E/</td></tr></tbody></table>\n<pre class=\"diagram\">          /       (root is the\n        /   \\      operator /)\n       *     E\n     /   \\\n    +     -\n   / \\   / \\\n  A   B C   D</pre>\n<p>Inorder with brackets gives the infix <code>(((A+B)*(C-D))/E)</code>; preorder gives the prefix <code>/*+AB-CDE</code>.</p>\n<div class=\"trap\">The FIRST node popped becomes the RIGHT child. Swapping them turns A-B into B-A, a wrong answer.</div>\n",
 "widget": "construct-demo",
 "preset": {
  "pre": "A B D E H C F G",
  "in": "D B H E A F C G",
  "post": "D H E B F G C A"
 },
 "widgetIntro": "<p>The demo uses Example 1. Step through it: at each step see which letter becomes the root and how it splits the inorder into a left part and a right part. Then switch to postorder + inorder for the same tree.</p>",
 "code": [
  {
   "title": "Build a tree from preorder + inorder (complete program)",
   "src": "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nstruct node {\n    char data;\n    struct node *left, *right;\n};\n\nstruct node *newNode(char x) {\n    struct node *t = (struct node *)malloc(sizeof(struct node));\n    t->data = x;\n    t->left = t->right = NULL;\n    return t;\n}\n\nint preIndex = 0;   /* next root to pick from preorder */\n\n/* position of x in in[start..end] */\nint find(char in[], int start, int end, char x) {\n    int i;\n    for (i = start; i <= end; i++)\n        if (in[i] == x)\n            return i;\n    return -1;\n}\n\nstruct node *build(char pre[], char in[], int start, int end) {\n    struct node *root;\n    int pos;\n    if (start > end)\n        return NULL;\n    root = newNode(pre[preIndex++]);     /* first unused = root */\n    pos = find(in, start, end, root->data);\n    root->left  = build(pre, in, start, pos - 1);  /* left part  */\n    root->right = build(pre, in, pos + 1, end);    /* right part */\n    return root;\n}\n\nvoid postorder(struct node *root) {\n    if (root != NULL) {\n        postorder(root->left);\n        postorder(root->right);\n        printf(\"%c \", root->data);\n    }\n}\n\nint main(void) {\n    char pre[] = \"ABDEHCFG\";\n    char in[]  = \"DBHEAFCG\";\n    struct node *root = build(pre, in, 0, (int)strlen(in) - 1);\n    printf(\"Postorder: \");\n    postorder(root);\n    printf(\"\\n\");\n    return 0;\n}\n"
  },

   "title": "Expression tree from a postfix expression",
   "src": "#include <stdio.h>\n#include <stdlib.h>\n#include <ctype.h>\n#define MAX 50\n\nstruct node {\n    char data;\n    struct node *left, *right;\n};\n\nstruct node *stack[MAX];\nint top = -1;\n\nvoid push(struct node *t) { stack[++top] = t; }\nstruct node *pop(void)    { return stack[top--]; }\n\nstruct node *newNode(char x) {\n    struct node *t = (struct node *)malloc(sizeof(struct node));\n    t->data = x;\n    t->left = t->right = NULL;\n    return t;\n}\n\n/* Build an expression tree from a postfix string */\nstruct node *buildExpTree(char postfix[]) {\n    int i;\n    struct node *t;\n    for (i = 0; postfix[i] != '\\0'; i++) {\n        t = newNode(postfix[i]);\n        if (!isalnum((unsigned char)postfix[i])) {   /* operator */\n            t->right = pop();     /* first pop = right child */\n            t->left  = pop();     /* second pop = left child */\n        }\n        push(t);\n    }\n    return pop();                 /* root */\n}\n\nvoid inorder(struct node *t) {\n    if (t != NULL) {\n        if (t->left != NULL) printf(\"(\");\n        inorder(t->left);\n        printf(\"%c\", t->data);\n        inorder(t->right);\n        if (t->left != NULL) printf(\")\");\n    }\n}\n\nvoid preorder(struct node *t) {\n    if (t != NULL) {\n        printf(\"%c\", t->data);\n        preorder(t->left);\n        preorder(t->right);\n    }\n}\n\nint main(void) {\n    char postfix[] = \"AB+CD-*E/\";\n    struct node *root = buildExpTree(postfix);\n    printf(\"Infix  : \"); inorder(root);  printf(\"\\n\");\n    printf(\"Prefix : \"); preorder(root); printf(\"\\n\");\n    return 0;\n}\n"
  }

 "exam8": "\n<div class=\"marks\">Why inorder is needed 1 + Algorithm 2 + Step-by-step construction 3 + Final tree 1 + Verification 1</div>\n<h4>Definition / Idea</h4>\n<div class=\"def\">A binary tree can be uniquely reconstructed from its inorder traversal together with either its preorder or its postorder traversal.</div>\n<ul>\n<li>Preorder (Root L R): the first element is the root.</li>\n<li>Postorder (L R Root): the last element is the root.</li>\n<li>Inorder (L Root R): elements before the root form the left subtree, elements after it form the right subtree.</li>\n</ul>\n<h4>Algorithm (Preorder + Inorder)</h4>\n<pre class=\"code\">build(pre, in):\n 1. if in is empty: return NULL\n 2. root = next element of pre\n 3. k = position of root in in\n 4. root-&gt;left  = build(pre, in[0 .. k-1])\n 5. root-&gt;right = build(pre, in[k+1 .. end])\n 6. return root</pre>\n<p>(For Postorder + Inorder take roots from the end of postorder.)</p>\n<h4>Example</h4>\n<p>Preorder: A B D E H C F G</p>\n<p>Inorder: D B H E A F C G</p>\n<table><thead><tr><th>Root</th><th>Inorder part</th><th>Left part</th><th>Right part</th></tr></thead><tbody><tr><td>1. <b>A</b></td><td>D B H E A F C G</td><td>D B H E</td><td>F C G</td></tr><tr><td>2. <b>B</b></td><td>D B H E</td><td>D</td><td>H E</td></tr><tr><td>3. <b>D</b></td><td>D</td><td>-</td><td>- (leaf)</td></tr><tr><td>4. <b>E</b></td><td>H E</td><td>H</td><td>-</td></tr><tr><td>5. <b>H</b></td><td>H</td><td>-</td><td>- (leaf)</td></tr><tr><td>6. <b>C</b></td><td>F C G</td><td>F</td><td>G</td></tr><tr><td>7. <b>F</b></td><td>F</td><td>-</td><td>- (leaf)</td></tr><tr><td>8. <b>G</b></td><td>G</td><td>-</td><td>- (leaf)</td></tr></tbody></table>\n<pre class=\"diagram\">          A\n        /   \\\n [D B H E]   [F C G]</pre>\n<pre class=\"diagram\">            A\n          /   \\\n         B     [F C G]\n       /   \\\n     [D]   [H E]</pre>\n<h4>Final tree</h4>\n<pre class=\"diagram\">            A\n          /   \\\n         B     C\n       /   \\  / \\\n      D    E  F  G\n          /\n         H</pre>\n<h4>Verification</h4>\n<p>Postorder of the constructed tree: D H E B F G C A. Its preorder and inorder match the given ones, so the tree is correct.</p>\n<h4>Complexity and note</h4>\n<p>Searching the root in the inorder each time gives O(n^2) in the worst case (O(n) with a hash map of positions). Preorder + postorder alone does not give a unique tree: A with left child B and A with right child B both have preorder A B and postorder B A.</p>\n",
 "exam15": "\n<div class=\"marks\">Concept 2 + Pre+In example 4 + Post+In example 4 + Non-uniqueness 1 + Expression tree 3 + Code 1</div>\n<h4>1. Concept</h4>\n<div class=\"def\">Inorder plus preorder, or inorder plus postorder, determines a unique binary tree because preorder/postorder identify the root and inorder separates the left and right subtrees.</div>\n<h4>2. Preorder + Inorder</h4>\n<p>Preorder: A B D E H C F G; Inorder: D B H E A F C G</p>\n<table><thead><tr><th>Root</th><th>Inorder part</th><th>Left part</th><th>Right part</th></tr></thead><tbody><tr><td>1. <b>A</b></td><td>D B H E A F C G</td><td>D B H E</td><td>F C G</td></tr><tr><td>2. <b>B</b></td><td>D B H E</td><td>D</td><td>H E</td></tr><tr><td>3. <b>D</b></td><td>D</td><td>-</td><td>- (leaf)</td></tr><tr><td>4. <b>E</b></td><td>H E</td><td>H</td><td>-</td></tr><tr><td>5. <b>H</b></td><td>H</td><td>-</td><td>- (leaf)</td></tr><tr><td>6. <b>C</b></td><td>F C G</td><td>F</td><td>G</td></tr><tr><td>7. <b>F</b></td><td>F</td><td>-</td><td>- (leaf)</td></tr><tr><td>8. <b>G</b></td><td>G</td><td>-</td><td>- (leaf)</td></tr></tbody></table>\n<pre class=\"diagram\">   ____A___\n  /        \\\n _B__     _C_\n/    \\   /   \\\nD    E   F   G\n    /\n    H</pre>\n<p>Check: postorder = D H E B F G C A.</p>\n<h4>3. Postorder + Inorder</h4>\n<p>Postorder: G D B E H F C A; Inorder: D G B A E C H F. The root of each group is the letter of that group appearing last in postorder.</p>\n<table><thead><tr><th>Root</th><th>Inorder part</th><th>Left part</th><th>Right part</th></tr></thead><tbody><tr><td>1. <b>A</b></td><td>D G B A E C H F</td><td>D G B</td><td>E C H F</td></tr><tr><td>2. <b>B</b></td><td>D G B</td><td>D G</td><td>-</td></tr><tr><td>3. <b>D</b></td><td>D G</td><td>-</td><td>G</td></tr><tr><td>4. <b>G</b></td><td>G</td><td>-</td><td>- (leaf)</td></tr><tr><td>5. <b>C</b></td><td>E C H F</td><td>E</td><td>H F</td></tr><tr><td>6. <b>E</b></td><td>E</td><td>-</td><td>- (leaf)</td></tr><tr><td>7. <b>F</b></td><td>H F</td><td>H</td><td>-</td></tr><tr><td>8. <b>H</b></td><td>H</td><td>-</td><td>- (leaf)</td></tr></tbody></table>\n<pre class=\"diagram\">   _A___\n  /     \\\n _B    _C__\n/     /    \\\nD     E    F\n \\        /\n G        H</pre>\n<p>Check: preorder = A B D G C E F H.</p>\n<h4>4. Preorder + Postorder is not unique</h4>\n<pre class=\"diagram\"> Tree 1        Tree 2\n    A            A\n   /              \\\n  B                B\n\n Pre : A B     Pre : A B\n Post: B A     Post: B A</pre>\n<h4>5. Expression tree from postfix AB+CD-*E/</h4>\n<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom | top), subtrees in postfix</th></tr></thead><tbody><tr><td>A</td><td>operand: push node A</td><td>A</td></tr><tr><td>B</td><td>operand: push node B</td><td>A | B</td></tr><tr><td>+</td><td>operator: pop right, pop left, make <code>+</code> their parent, push</td><td>AB+</td></tr><tr><td>C</td><td>operand: push node C</td><td>AB+ | C</td></tr><tr><td>D</td><td>operand: push node D</td><td>AB+ | C | D</td></tr><tr><td>-</td><td>operator: pop right, pop left, make <code>-</code> their parent, push</td><td>AB+ | CD-</td></tr><tr><td>*</td><td>operator: pop right, pop left, make <code>*</code> their parent, push</td><td>AB+CD-*</td></tr><tr><td>E</td><td>operand: push node E</td><td>AB+CD-* | E</td></tr><tr><td>/</td><td>operator: pop right, pop left, make <code>/</code> their parent, push</td><td>AB+CD-*E/</td></tr></tbody></table>\n<pre class=\"diagram\">          /       (root is the\n        /   \\      operator /)\n       *     E\n     /   \\\n    +     -\n   / \\   / \\\n  A   B C   D</pre>\n<p>Inorder (with brackets): (((A+B)*(C-D))/E). Preorder (prefix): /*+AB-CDE. Postorder gives back AB+CD-*E/.</p>\n<h4>6. C function (Preorder + Inorder)</h4>\n<pre class=\"code\">int preIndex = 0;\nstruct node *build(char pre[], char in[], int s, int e) {\n    struct node *root;\n    int pos;\n    if (s &gt; e) return NULL;\n    root = newNode(pre[preIndex++]);\n    pos = find(in, s, e, root-&gt;data);\n    root-&gt;left  = build(pre, in, s, pos - 1);\n    root-&gt;right = build(pre, in, pos + 1, e);\n    return root;\n}</pre>\n<h4>7. Complexity</h4>\n<table><thead><tr><th>Task</th><th>Time</th></tr></thead><tbody>\n<tr><td>Tree from traversals (linear search for root)</td><td>O(n^2) worst</td></tr>\n<tr><td>Same with an index table of inorder positions</td><td>O(n)</td></tr>\n<tr><td>Expression tree from postfix</td><td>O(n), stack space O(n)</td></tr>\n<tr><td>BST from n keys</td><td>O(n log n) average, O(n^2) worst</td></tr>\n</tbody></table>\n",
 "scenarios": [
  {
   "q": "Construct the binary tree whose inorder is 4 2 5 1 6 3 7 and postorder is 4 5 2 6 7 3 1. Write its preorder.",
   "a": "\n<p>Root of each group = the element of that group appearing last in postorder.</p>\n<table><thead><tr><th>Root</th><th>Inorder part</th><th>Left part</th><th>Right part</th></tr></thead><tbody><tr><td>1. <b>1</b></td><td>4 2 5 1 6 3 7</td><td>4 2 5</td><td>6 3 7</td></tr><tr><td>2. <b>2</b></td><td>4 2 5</td><td>4</td><td>5</td></tr><tr><td>3. <b>4</b></td><td>4</td><td>-</td><td>- (leaf)</td></tr><tr><td>4. <b>5</b></td><td>5</td><td>-</td><td>- (leaf)</td></tr><tr><td>5. <b>3</b></td><td>6 3 7</td><td>6</td><td>7</td></tr><tr><td>6. <b>6</b></td><td>6</td><td>-</td><td>- (leaf)</td></tr><tr><td>7. <b>7</b></td><td>7</td><td>-</td><td>- (leaf)</td></tr></tbody></table>\n<pre class=\"diagram\">  __1__\n /     \\\n 2_    3_\n/  \\  /  \\\n4  5  6  7</pre>\n<p>It is a perfect binary tree. Check, preorder: 1 2 4 5 3 6 7.</p>\n"
  },
  {
   "q": "Construct an expression tree for the postfix expression ABC*+DE/- and write the infix and prefix forms.",
   "a": "\n<p>Scan left to right with a stack of tree nodes (first pop = right child):</p>\n<table><thead><tr><th>Symbol</th><th>Action</th><th>Stack (bottom | top)</th></tr></thead><tbody><tr><td>A</td><td>push A</td><td>A</td></tr><tr><td>B</td><td>push B</td><td>A | B</td></tr><tr><td>C</td><td>push C</td><td>A | B | C</td></tr><tr><td>*</td><td>pop 2, join under *, push</td><td>A | BC*</td></tr><tr><td>+</td><td>pop 2, join under +, push</td><td>ABC*+</td></tr><tr><td>D</td><td>push D</td><td>ABC*+ | D</td></tr><tr><td>E</td><td>push E</td><td>ABC*+ | D | E</td></tr><tr><td>/</td><td>pop 2, join under /, push</td><td>ABC*+ | DE/</td></tr><tr><td>-</td><td>pop 2, join under -, push</td><td>ABC*+DE/-</td></tr></tbody></table>\n<pre class=\"diagram\">         -\n       /   \\\n      +     /\n     / \\   / \\\n    A   *  D  E\n       / \\\n      B   C</pre>\n<p>Infix (inorder with brackets): <code>((A+(B*C))-(D/E))</code>. Prefix (preorder): <code>-+A*BC/DE</code>.</p>\n"
