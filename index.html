DSA.topics.push({
  id: "complexity",
  unit: 21,
  title: "Time and Space Complexity",
  tagline: "How fast a program grows when the input grows",
  minutes: 40,
  analogy: `<p>Imagine finding a friend's name in your class attendance register. If you check every name from the top, a register of 60 names takes up to 60 checks, and a register of 6000 names takes up to 6000. The work grows with the size. That growth is <b>time complexity</b>.</p>
<p>Now think of a dictionary. You open the middle, see the word is further ahead, and throw away half the book each time. Even a 1,00,000-word dictionary needs only about 17 such halvings. Same task, smarter method, hugely less work. Complexity is how we compare such methods without a stopwatch.</p>`,
  learn: `<h3>What is complexity?</h3>
<div class="def">Time complexity of an algorithm is the amount of time it needs to run, expressed as a function of the input size n. Space complexity is the amount of memory it needs, expressed as a function of n.</div>
<p>We do not measure in seconds, because seconds depend on the computer, compiler and other programs running. Instead we count <b>how many basic steps</b> (comparisons, assignments, additions) the algorithm does for input size n, and see how that count grows.</p>

<h3>Frequency count method</h3>
<p>Write how many times each statement executes, then add them up.</p>
<pre class="code">int sum(int a[], int n)
{
    int s = 0, i;
    for (i = 0; i &lt; n; i++)
        s = s + a[i];
    return s;
}</pre>
<table>
<thead><tr><th>Statement</th><th>Frequency</th></tr></thead>
<tbody>
<tr><td><code>s = 0</code></td><td>1</td></tr>
<tr><td><code>for (i = 0; i &lt; n; i++)</code></td><td>n + 1 (condition checked n times true, 1 time false)</td></tr>
<tr><td><code>s = s + a[i]</code></td><td>n</td></tr>
<tr><td><code>return s</code></td><td>1</td></tr>
<tr><td><b>Total</b></td><td><b>2n + 3</b></td></tr>
</tbody>
</table>
<p>For n = 10 the count is 23. When n is large, the "+3" and the "2" hardly matter. What matters is that the count grows like n, so we say the time complexity is <b>O(n)</b>.</p>
<div class="tip">Rule: keep only the fastest-growing term and drop constants. 2n + 3 becomes O(n). 3n&sup2; + 5n + 7 becomes O(n&sup2;).</div>

<h3>Asymptotic notations</h3>
<p>"Asymptotic" means "for large n". These notations describe the growth rate of a function f(n), which is the step count of our algorithm.</p>
<p><b>1. Big-O (upper bound, worst case):</b> f(n) = O(g(n)) if there exist positive constants c and n0 such that f(n) &lt;= c &middot; g(n) for all n &gt;= n0. It means f(n) grows <b>no faster</b> than g(n).</p>
<pre class="diagram"> ^ value
 |                   /  c*g(n)
 |                 /
 |               /    .... f(n)
 |             / .....
 |          .X...
 |     ..../ :
 |.....  /   :
 |     /     :
 |   /       :
 | /         :
 +-----------+--------&gt; n
             n0</pre>
<p>After the point n0, f(n) always stays below c &middot; g(n).</p>
<p>Example: f(n) = 3n + 2. Take c = 4, g(n) = n. Is 3n + 2 &lt;= 4n?</p>
<table>
<thead><tr><th>n</th><th>f(n) = 3n + 2</th><th>4n</th><th>f(n) &lt;= 4n?</th></tr></thead>
<tbody>
<tr><td>1</td><td>5</td><td>4</td><td>No</td></tr>
<tr><td>2</td><td>8</td><td>8</td><td>Yes</td></tr>
<tr><td>3</td><td>11</td><td>12</td><td>Yes</td></tr>
<tr><td>4</td><td>14</td><td>16</td><td>Yes</td></tr>
</tbody>
</table>
<p>It holds for every n &gt;= 2, so c = 4, n0 = 2, and 3n + 2 = O(n).</p>
<p><b>2. Big-Omega (lower bound, best case):</b> f(n) = &Omega;(g(n)) if there exist positive constants c and n0 such that f(n) &gt;= c &middot; g(n) for all n &gt;= n0. f grows <b>at least as fast</b> as g. Example: 3n + 2 &gt;= 3n for all n &gt;= 1, so 3n + 2 = &Omega;(n) with c = 3, n0 = 1.</p>
<p><b>3. Big-Theta (tight bound):</b> f(n) = &Theta;(g(n)) if there exist positive constants c1, c2 and n0 such that c1 &middot; g(n) &lt;= f(n) &lt;= c2 &middot; g(n) for all n &gt;= n0. f grows <b>exactly like</b> g. Example: 3n &lt;= 3n + 2 &lt;= 4n for n &gt;= 2, so 3n + 2 = &Theta;(n) with c1 = 3, c2 = 4, n0 = 2.</p>
<pre class="diagram">Big-O     : f(n) stays BELOW c*g(n)
            (ceiling, upper bound)
Big-Omega : f(n) stays ABOVE c*g(n)
            (floor, lower bound)
Big-Theta : f(n) is BETWEEN c1*g(n)
            and c2*g(n) (sandwich)</pre>

<h3>Best, average and worst case</h3>
<p>For the same n, the time can depend on <i>which</i> input we get.</p>
<ul>
<li><b>Best case:</b> minimum time over all inputs of size n.</li>
<li><b>Worst case:</b> maximum time. This is the one usually reported, because it is a guarantee.</li>
<li><b>Average case:</b> expected time over all inputs.</li>
</ul>
<p><b>Linear search</b> (check elements one by one):</p>
<ul>
<li>Best: key is the first element, 1 comparison, O(1).</li>
<li>Worst: key is the last element or not present, n comparisons, O(n).</li>
<li>Average: (n + 1) / 2 comparisons if the key is present and equally likely anywhere, which is O(n).</li>
</ul>
<p><b>Binary search</b> (sorted array, compare with the middle, discard half):</p>
<ul>
<li>Best: key is at the first middle, O(1).</li>
<li>Worst and average: O(log n). At most floor(log2 n) + 1 comparisons of the middle element: 4 for n = 8, 5 for n = 16, 17 for n = 1,00,000.</li>
</ul>
<p>Trace: array <code>5 12 19 27 33 41 58 64</code> (indices 0 to 7), search 58.</p>
<table>
<thead><tr><th>low</th><th>high</th><th>mid, a[mid]</th><th>Action</th></tr></thead>
<tbody>
<tr><td>0</td><td>7</td><td>3, 27</td><td>58 &gt; 27, low = 4</td></tr>
<tr><td>4</td><td>7</td><td>5, 41</td><td>58 &gt; 41, low = 6</td></tr>
<tr><td>6</td><td>7</td><td>6, 58</td><td>Found at index 6</td></tr>
</tbody>
</table>

<h3>Common orders of growth</h3>
<p><b>O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n&sup2;) &lt; O(n&sup3;) &lt; O(2&#8319;) &lt; O(n!)</b></p>
<table>
<thead><tr><th>n</th><th>log2 n</th><th>n log2 n</th><th>n&sup2;</th></tr></thead>
<tbody>
<tr><td>1</td><td>0</td><td>0</td><td>1</td></tr>
<tr><td>2</td><td>1</td><td>2</td><td>4</td></tr>
<tr><td>4</td><td>2</td><td>8</td><td>16</td></tr>
<tr><td>8</td><td>3</td><td>24</td><td>64</td></tr>
<tr><td>16</td><td>4</td><td>64</td><td>256</td></tr>
</tbody>
</table>
<table>
<thead><tr><th>n</th><th>n&sup3;</th><th>2&#8319;</th><th>n!</th></tr></thead>
<tbody>
<tr><td>1</td><td>1</td><td>2</td><td>1</td></tr>
<tr><td>2</td><td>8</td><td>4</td><td>2</td></tr>
<tr><td>4</td><td>64</td><td>16</td><td>24</td></tr>
<tr><td>8</td><td>512</td><td>256</td><td>40320</td></tr>
<tr><td>16</td><td>4096</td><td>65536</td><td>20922789888000</td></tr>
</tbody>
</table>
<p>Look at n = 16: n&sup2; is 256, but n! is over 20 lakh crore. Exponential and factorial algorithms are only usable for tiny n.</p>

<h3>Finding complexity of loops</h3>
<pre class="code">for (i = 0; i &lt; n; i++)        /* runs n times  */
    count++;                   /* O(n)          */

for (i = 0; i &lt; n; i++)        /* n times       */
    for (j = 0; j &lt; n; j++)    /* n times each  */
        count++;               /* O(n^2)        */

for (i = 1; i &lt; n; i = i * 2)  /* i = 1,2,4,8.. */
    count++;                   /* O(log n)      */</pre>
<p>Running these with n = 16 gives counts 16, 256 and 4 (i takes values 1, 2, 4, 8). The doubling loop runs about log2 n times because i doubles until it reaches n.</p>
<ul>
<li>Consecutive (one after another) loops: <b>add</b>. O(n) + O(n&sup2;) = O(n&sup2;).</li>
<li>Nested loops: <b>multiply</b>. n &times; n = O(n&sup2;).</li>
<li>Loop variable multiplied or divided by 2 each time: O(log n).</li>
</ul>

<h3>Space complexity</h3>
<p>Space needed S(P) = <b>C + Sp</b>:</p>
<ul>
<li><b>Fixed part C:</b> space for code, simple variables and constants. Does not depend on n.</li>
<li><b>Variable part Sp:</b> space that depends on the input, such as an array of size n or the recursion stack.</li>
</ul>
<p>Examples: a function that adds three numbers uses O(1) space. The <code>sum</code> function above needs n words for the array plus words for n, s and i, so S = n + 3, which is O(n) (and O(1) extra space besides the input). Recursive factorial <code>fact(n)</code> makes n + 1 calls that sit on the stack together, so it needs O(n) space.</p>

<h3>Time-space trade-off</h3>
<p>Often we can save time by using more memory, or save memory by spending more time. Example: storing pre-computed results in a lookup table (more space) gives O(1) answers (less time). Hashing uses extra table space to search in O(1) on average instead of O(n).</p>

<h3>Complexities to remember</h3>
<table>
<thead><tr><th>Operation</th><th>Time</th></tr></thead>
<tbody>
<tr><td>Access a[i] in an array</td><td>O(1)</td></tr>
<tr><td>Linear search</td><td>O(n) (best O(1))</td></tr>
<tr><td>Binary search (sorted array)</td><td>O(log n) (best O(1))</td></tr>
<tr><td>Bubble, selection, insertion sort</td><td>O(n&sup2;)</td></tr>
<tr><td>Merge sort</td><td>O(n log n)</td></tr>
<tr><td>Quick sort</td><td>O(n log n) average, O(n&sup2;) worst</td></tr>
<tr><td>Insert at beginning of array</td><td>O(n) (shift all)</td></tr>
<tr><td>Insert at beginning of linked list</td><td>O(1)</td></tr>
<tr><td>Insert at end of singly linked list (head only)</td><td>O(n)</td></tr>
<tr><td>Search in linked list</td><td>O(n)</td></tr>
<tr><td>Push, pop, enqueue, dequeue</td><td>O(1)</td></tr>
<tr><td>Search in BST</td><td>O(log n) average, O(n) worst</td></tr>
<tr><td>Search in AVL tree</td><td>O(log n)</td></tr>
</tbody>
</table>`,

    { title: "Linear search and binary search", src: `#include <stdio.h>

/* Linear search: works on any array */
int linearSearch(int a[], int n, int key)
{
    int i;
    for (i = 0; i < n; i++)
        if (a[i] == key)
            return i;          /* found */
    return -1;                 /* not found */
}

/* Binary search: array must be sorted */
int binarySearch(int a[], int n, int key)
{
    int low = 0, high = n - 1, mid;
    while (low <= high) {
        mid = (low + high) / 2;
        if (a[mid] == key)
            return mid;
        else if (key < a[mid])
            high = mid - 1;    /* search left half */
        else
            low = mid + 1;     /* search right half */

    return -1;

<h4>Q. What are time and space complexity? Explain asymptotic notations with examples.</h4>
<h4>Definition</h4>
<div class="def">Time complexity is the amount of time an algorithm takes as a function of input size n. Space complexity is the amount of memory it needs as a function of n.</div>
<p>Time is measured by counting basic operations, not seconds, so that it does not depend on the machine.</p>
<p>Space complexity S(P) = C + Sp, where C is the fixed part (code, simple variables) and Sp is the variable part (arrays of size n, recursion stack).</p>
<h4>Asymptotic notations</h4>
<ol>
<li><b>Big-O (upper bound):</b> f(n) = O(g(n)) if there exist positive constants c and n0 such that f(n) &lt;= c &middot; g(n) for all n &gt;= n0. Used for worst case.</li>
<li><b>Big-Omega (lower bound):</b> f(n) = &Omega;(g(n)) if f(n) &gt;= c &middot; g(n) for all n &gt;= n0. Used for best case.</li>
<li><b>Big-Theta (tight bound):</b> f(n) = &Theta;(g(n)) if c1 &middot; g(n) &lt;= f(n) &lt;= c2 &middot; g(n) for all n &gt;= n0.</li>
</ol>
<h4>Diagram (Big-O)</h4>
<pre class="diagram"> ^ value
 |                   /  c*g(n)
 |                 /
 |               /    .... f(n)
 |             / .....
 |          .X...
 |     ..../ :
 |.....  /   :
 |     /     :
 |   /       :
 | /         :
 +-----------+--------&gt; n
             n0</pre>
<p>For all n &gt;= n0, f(n) lies below c &middot; g(n).</p>
<h4>Example</h4>
<p>f(n) = 3n + 2.</p>

<li>O: 3n + 2 &lt;= 4n for all n &gt;= 2, so c = 4, n0 = 2, f(n) = O(n). (Check: n = 2 gives 8 &lt;= 8.)</li>
<li>&Omega;: 3n + 2 &gt;= 3n for all n &gt;= 1, so f(n) = &Omega;(n).</li>
<li>&Theta;: 3n &lt;= 3n + 2 &lt;= 4n for n &gt;= 2, so f(n) = &Theta;(n).</li>
</ul>
<h4>Frequency count</h4>

<h4>Q. Define time and space complexity. Explain Big-O, Omega and Theta notations. Explain best, average and worst case with linear and binary search. Find the complexity of a code segment using the frequency count method.</h4>
<h4>1. Definitions</h4>
<div class="def">Time complexity is the time taken by an algorithm as a function of input size n. Space complexity is the memory it needs as a function of n.</div>

<li>Space S(P) = C + Sp. C = fixed part (code, simple variables, constants). Sp = variable part (arrays depending on n, recursion stack). Example: recursive factorial needs O(n) stack space; adding three numbers needs O(1).</li>

<h4>2. Asymptotic notations</h4>
<p><b>Big-O, upper bound:</b> f(n) = O(g(n)) if there exist positive constants c, n0 such that f(n) &lt;= c &middot; g(n) for all n &gt;= n0.</p>

DSA.topics.push({
  id: "sll",
  unit: 22,
  title: "Singly Linked List",
  tagline: "A chain of nodes where each one knows only the next",
  minutes: 45,
  analogy: `<p>Think of a treasure hunt at a college fest. The first clue is in your hand. It tells you where the second clue is. The second clue tells you where the third is, and the last clue says "END". You cannot jump to clue 5 directly. You must follow the chain from the start.</p>
<p>A singly linked list is exactly this. Each <b>node</b> holds some data and the address of the next node. The clue in your hand is the <b>head</b> pointer, and "END" is <code>NULL</code>. Adding a new clue in the middle is easy: just change where one clue points.</p>`,
  learn: `<h3>Why not just use an array?</h3>
<p>An array has a fixed size and its elements sit side by side. To insert at the front of an array of 1000 elements, all 1000 must shift one place. A linked list avoids both problems: it grows one node at a time using <code>malloc</code>, and inserting only changes a couple of pointers.</p>

<h3>Basic terms</h3>
<div class="def">A singly linked list is a linear data structure made of nodes, where each node contains data and a pointer to the next node, and the last node points to NULL.</div>
<ul>
<li><b>Node:</b> one element of the list. It has two parts: <b>data</b> and <b>next</b> (the address of the next node).</li>
<li><b>head</b> (also called <b>start</b>): a pointer that stores the address of the first node. If <code>head == NULL</code>, the list is empty.</li>
<li><b>NULL:</b> a special address meaning "points nowhere". The last node's next is NULL.</li>
</ul>
<pre class="diagram">head
 |
 v
+----+---+   +----+---+   +----+----+
| 10 | --+--&gt;| 20 | --+--&gt;| 30 |NULL|
+----+---+   +----+---+   +----+----+
 data next</pre>
<pre class="code">struct node {
    int data;
    struct node *next;   /* self-referential */
};
struct node *head = NULL;</pre>
<p>A new node is made with <code>malloc(sizeof(struct node))</code>. In the code we write a small helper <code>getNode(x)</code> that allocates a node, puts x in data and NULL in next.</p>

<h3>Traversal (display)</h3>
<p>Start a pointer <code>temp</code> at head, print <code>temp-&gt;data</code>, move with <code>temp = temp-&gt;next</code>, and stop when temp becomes NULL.</p>
<pre class="code">temp = head;
while (temp != NULL) {
    printf("%d -&gt; ", temp-&gt;data);
    temp = temp-&gt;next;
}</pre>
<div class="trap">Never move <code>head</code> itself while traversing. If you do, you lose the start of the list forever. Always use a separate <code>temp</code> pointer.</div>

<h3>Insertion</h3>
<p><b>At the beginning</b> (O(1)): the new node points to the old first node, then head moves to the new node.</p>
<pre class="diagram">Insert 5 at beginning of 10 20 30:

 newnode-&gt;next = head;   head = newnode;

head
 |
 v
+---+-+  +----+-+  +----+-+  +----+----+
| 5 |-+-&gt;| 10 |-+-&gt;| 20 |-+-&gt;| 30 |NULL|
+---+-+  +----+-+  +----+-+  +----+----+</pre>
<p><b>At the end</b> (O(n)): walk temp to the last node (the one whose next is NULL), then set <code>temp-&gt;next = newnode</code>. If the list is empty, the new node becomes head.</p>
<p><b>After a given position</b> (O(n)): walk temp to the node at that position (position 1 is the first node), then do these two steps <b>in this order</b>:</p>
<pre class="code">newnode-&gt;next = temp-&gt;next;   /* 1. new node grabs the rest */
temp-&gt;next = newnode;         /* 2. temp points to new node */</pre>
<div class="trap">If you swap the two lines, <code>temp-&gt;next</code> is overwritten first and the rest of the list is lost.</div>

<h3>Deletion</h3>
<p><b>From the beginning</b> (O(1)): save head in temp, move head to <code>head-&gt;next</code>, then <code>free(temp)</code>. If head is NULL, it is <b>underflow</b> (nothing to delete).</p>
<p><b>From the end</b> (O(n)): walk with two pointers, <code>prev</code> and <code>temp</code>, until temp is the last node. Set <code>prev-&gt;next = NULL</code> and free temp. If there was only one node, head becomes NULL.</p>
<p><b>By value</b> (O(n)): walk until <code>temp-&gt;data</code> equals the value, keeping prev one step behind. Then bypass the node: <code>prev-&gt;next = temp-&gt;next</code>, and free it. If it was the first node, move head instead.</p>
<pre class="diagram">Delete 20 from 10 20 30:

+----+---+   +----+---+   +----+----+
| 10 | --+-+ | 20 |   | +&gt;| 30 |NULL|
+----+---+ | +----+---+ | +----+----+
           +------------+
  prev-&gt;next = temp-&gt;next;  free(temp);</pre>

<h3>Search and count</h3>
<p><b>Search:</b> walk the list comparing each data with the key, counting positions. Return the position, or 0 (not found) when temp reaches NULL. O(n).</p>
<p><b>Count:</b> walk the list adding 1 for each node. O(n).</p>

<h3>Reverse (iterative)</h3>
<p>Use three pointers: <code>prev</code> (starts NULL), <code>curr</code> (starts at head) and <code>nextnode</code>. At each node: save the next node, turn the current node's arrow backwards, then move prev and curr one step forward. At the end, prev is the new head.</p>
<pre class="code">while (curr != NULL) {
    nextnode = curr-&gt;next;
    curr-&gt;next = prev;
    prev = curr;
    curr = nextnode;
}
head = prev;</pre>
<p>Reversing 10 20 30 40 gives 40 30 20 10 in 4 steps, O(n) time and O(1) extra space.</p>

<h3>Array vs linked list</h3>
<table>
<thead><tr><th>Array</th><th>Linked list</th></tr></thead>
<tbody>
<tr><td>Fixed size (static)</td><td>Grows and shrinks (dynamic)</td></tr>
<tr><td>Contiguous memory</td><td>Nodes anywhere in memory, joined by pointers</td></tr>
<tr><td>Direct access a[i] in O(1)</td><td>Sequential access, O(n) to reach the i-th node</td></tr>
<tr><td>Insert/delete at front: O(n) shifting</td><td>Insert/delete at front: O(1)</td></tr>
<tr><td>No extra memory per element</td><td>Extra memory for the next pointer</td></tr>
<tr><td>Binary search possible</td><td>Binary search not practical</td></tr>
</tbody>
</table>

<h3>Advantages and disadvantages</h3>
<ul>
<li><b>Advantages:</b> dynamic size, no memory wasted on empty slots, fast insertion and deletion (no shifting), easy to build stacks and queues.</li>
<li><b>Disadvantages:</b> extra memory for pointers, no random access, can only move forward, reverse traversal is hard.</li>
</ul>

<h3>Applications</h3>
<ul>
<li>Implementing stacks and queues of unknown size.</li>
<li>Representing polynomials (each node holds a coefficient and exponent).</li>
<li>Adjacency lists of graphs, chaining in hash tables.</li>
<li>Dynamic memory management (free block lists), undo history.</li>
</ul>`,

DSA.topics.push({
  id: "dll",
  unit: 22,
  title: "Doubly Linked List",
  tagline: "Every node knows both its neighbours, so you can walk both ways",
  minutes: 35,
  analogy: `<p>Think of the coaches of a train. Each coach is joined to the coach in front and the coach behind. A TC can walk forward to the engine or backward to the guard's van from any coach. To remove one coach in the middle, the railway staff unhook it from both sides and join its two neighbours directly.</p>
<p>A doubly linked list is that train. Every node has a <b>prev</b> link (coach behind) and a <b>next</b> link (coach in front), so you can move in both directions.</p>`,
  learn: `<h3>The problem with a singly linked list</h3>
<p>In a singly linked list you can only go forward. To delete the last node, you must walk from head to find the node before it. To print the list backwards, you need extra work. A doubly linked list fixes this by adding a second pointer in every node.</p>

<h3>Definition and node</h3>
<div class="def">A doubly linked list is a linear data structure in which each node contains a data field and two pointers: prev, pointing to the previous node, and next, pointing to the next node.</div>
<pre class="code">struct node {
    struct node *prev;
    int data;
    struct node *next;
};
struct node *head = NULL;</pre>
<pre class="diagram">Node:  +------+------+------+
       | prev | data | next |
       +------+------+------+</pre>
<pre class="diagram">         head
          |
          v
NULL &lt;- [10] &lt;=&gt; [20] &lt;=&gt; [30] -&gt; NULL

[10].prev = NULL    [10].next = [20]
[20].prev = [10]    [20].next = [30]
[30].prev = [20]    [30].next = NULL</pre>
<ul>
<li>The first node's <code>prev</code> is NULL.</li>
<li>The last node's <code>next</code> is NULL.</li>
<li>For any middle node p: <code>p-&gt;next-&gt;prev == p</code> and <code>p-&gt;prev-&gt;next == p</code>.</li>
</ul>

<h3>Insertion</h3>
<p><b>At the beginning</b> (O(1)):</p>
<pre class="code">newnode-&gt;next = head;
if (head != NULL)
    head-&gt;prev = newnode;
head = newnode;          /* newnode-&gt;prev is already NULL */</pre>
<p><b>At the end</b> (O(n)): walk temp to the last node, then <code>temp-&gt;next = newnode;</code> and <code>newnode-&gt;prev = temp;</code></p>
<p><b>At a given position</b> (O(n)): the new node should become the node at position pos (position 1 is the first). If pos is 1, insert at the beginning. Otherwise walk temp to the node at position pos - 1, then fix <b>four</b> links:</p>
<pre class="code">newnode-&gt;next = temp-&gt;next;          /* 1 */
newnode-&gt;prev = temp;                /* 2 */
if (temp-&gt;next != NULL)
    temp-&gt;next-&gt;prev = newnode;      /* 3 */
temp-&gt;next = newnode;                /* 4 */</pre>
<pre class="diagram">Insert 25 at position 4 in
5 10 20 30 40  (temp = 20, position 3)

before: [20] &lt;=&gt; [30]
after : [20] &lt;=&gt; [25] &lt;=&gt; [30]

result: 5 10 20 25 30 40</pre>
<div class="trap">Step 4 must come last. If you change <code>temp-&gt;next</code> first, you lose the address of node 30, and steps 1 and 3 break.</div>

<h3>Deletion</h3>
<p><b>From the beginning</b> (O(1)): move head to <code>head-&gt;next</code>; if the new head is not NULL, set its <code>prev</code> to NULL; free the old first node.</p>
<p><b>From the end</b> (O(n) with only a head pointer): walk to the last node temp. If it is the only node, head becomes NULL. Otherwise <code>temp-&gt;prev-&gt;next = NULL;</code> and free temp. Note we do not need a separate prev pointer, because the node itself knows its previous node.</p>
<p><b>At a given position</b> (O(n)): walk temp to the node at that position, then join its neighbours to each other:</p>
<pre class="code">if (temp-&gt;prev != NULL)
    temp-&gt;prev-&gt;next = temp-&gt;next;
else
    head = temp-&gt;next;            /* deleting first node */
if (temp-&gt;next != NULL)
    temp-&gt;next-&gt;prev = temp-&gt;prev;
free(temp);</pre>
<pre class="diagram">Delete position 2 from 10 20 25 30:

[10] &lt;=&gt; [20] &lt;=&gt; [25] &lt;=&gt; [30]
           X
[10] &lt;========&gt; [25] &lt;=&gt; [30]</pre>

<h3>Traversal in both directions</h3>
<ul>
<li><b>Forward:</b> start at head, follow <code>next</code> until NULL.</li>
<li><b>Backward:</b> go to the last node (follow next until <code>temp-&gt;next == NULL</code>), then follow <code>prev</code> until NULL.</li>
</ul>
<p>For the list 10 25 30, forward prints <code>10 25 30</code> and backward prints <code>30 25 10</code>.</p>
<div class="tip">If you also keep a <code>tail</code> pointer to the last node, insertion and deletion at the end become O(1), and backward traversal can start immediately.</div>

<h3>SLL vs DLL</h3>
<table>
<thead><tr><th>Feature</th><th>Singly linked list</th><th>Doubly linked list</th></tr></thead>
<tbody>
<tr><td>Pointers per node</td><td>1 (next)</td><td>2 (prev, next)</td></tr>
<tr><td>Traversal</td><td>Forward only</td><td>Forward and backward</td></tr>
<tr><td>Memory per node</td><td>Less</td><td>More (extra prev pointer)</td></tr>
<tr><td>Delete a node given its address</td><td>O(n), must find the previous node</td><td>O(1), prev is stored in the node</td></tr>
<tr><td>Insert before a given node</td><td>Hard (need previous)</td><td>Easy</td></tr>
<tr><td>Code complexity</td><td>Simpler</td><td>More links to update</td></tr>
</tbody>
</table>

<h3>Advantages, disadvantages and applications</h3>
<ul>
<li><b>Advantages:</b> two-way traversal, easy deletion and insertion before a node, easy reverse printing.</li>
<li><b>Disadvantages:</b> extra memory for prev in every node, every insert or delete must update more pointers (more chances of bugs).</li>
<li><b>Applications:</b> music player next and previous buttons, browser back and forward, undo and redo in editors, image viewer (previous/next photo), LRU cache, navigation in deque implementations.</li>
</ul>`,

  code: [
    { title: "Complete doubly linked list program (menu driven)", src: `#include <stdio.h>
#include <stdlib.h>

struct node {
    struct node *prev;
    int data;
    struct node *next;
};

struct node *head = NULL;

struct node *getNode(int x)
{
    struct node *newnode;
    newnode = (struct node *)malloc(sizeof(struct node));
    if (newnode == NULL) {
        printf("Memory not available\\n");
        exit(1);
    }
    newnode->data = x;
    newnode->prev = NULL;
    newnode->next = NULL;
    return newnode;
}

void insertBegin(int x)
{
    struct node *newnode = getNode(x);
    if (head != NULL) {
        newnode->next = head;
        head->prev = newnode;
    }
    head = newnode;
}

void insertEnd(int x)
{
    struct node *newnode = getNode(x);
    struct node *temp = head;
    if (head == NULL) {
        head = newnode;
        return;
    }
    while (temp->next != NULL)
        temp = temp->next;
    temp->next = newnode;      /* old last -> new */
    newnode->prev = temp;      /* new <- old last */
}

/* New node becomes the node at position pos (1 = first) */
void insertAtPos(int pos, int x)
{
    struct node *newnode, *temp = head;
    int i;
    if (pos < 1) {
        printf("Invalid position\\n");
        return;
    }
    if (pos == 1) {
        insertBegin(x);
        return;
    }
    for (i = 1; i < pos - 1 && temp != NULL; i++)
        temp = temp->next;    /* stop at node pos-1 */
    if (temp == NULL) {
        printf("Invalid position\\n");
        return;
    }
    newnode = getNode(x);
    newnode->next = temp->next;       /* 1 */
    newnode->prev = temp;             /* 2 */
    if (temp->next != NULL)
        temp->next->prev = newnode;   /* 3 */
    temp->next = newnode;             /* 4 */
}

void deleteBegin(void)
{
    struct node *temp = head;
    if (head == NULL) {
        printf("Underflow\\n");
        return;
    }
    head = head->next;
    if (head != NULL)
        head->prev = NULL;
    printf("Deleted %d\\n", temp->data);
    free(temp);
}

void deleteEnd(void)
{
    struct node *temp = head;
    if (head == NULL) {
        printf("Underflow\\n");
        return;
    }
    while (temp->next != NULL)
        temp = temp->next;
    if (temp->prev == NULL)       /* only one node */
        head = NULL;
    else
        temp->prev->next = NULL;
    printf("Deleted %d\\n", temp->data);
    free(temp);
}

void deleteAtPos(int pos)
{
    struct node *temp = head;
    int i;
    for (i = 1; i < pos && temp != NULL; i++)
        temp = temp->next;    /* node to delete */
    if (temp == NULL || pos < 1) {
        printf("Invalid position\\n");
        return;
    }
    if (temp->prev != NULL)
        temp->prev->next = temp->next;
    else
        head = temp->next;    /* first node deleted */
    if (temp->next != NULL)
        temp->next->prev = temp->prev;
    printf("Deleted %d\\n", temp->data);
    free(temp);
}

void displayForward(void)
{
    struct node *temp = head;
    printf("Forward : ");
    while (temp != NULL) {
        printf("%d ", temp->data);
        temp = temp->next;
    }
    printf("\\n");
}

void displayBackward(void)
{
    struct node *temp = head;
    printf("Backward: ");
    if (head == NULL) {
        printf("\\n");
        return;
    }
    while (temp->next != NULL)    /* go to last node */
        temp = temp->next;
    while (temp != NULL) {        /* walk back using prev */
        printf("%d ", temp->data);
        temp = temp->prev;
    }
    printf("\\n");
}

int main(void)
{
    int ch, x, pos;
    while (1) {
        printf("\\n1.Insert begin   2.Insert end\\n");
        printf("3.Insert at pos  4.Delete begin\\n");
        printf("5.Delete end     6.Delete at pos\\n");
        printf("7.Display        0.Exit\\n");
        printf("Enter choice: ");
        if (scanf("%d", &ch) != 1)
            break;
        switch (ch) {
        case 1: printf("Value: ");
                scanf("%d", &x);
                insertBegin(x);
                break;
        case 2: printf("Value: ");
                scanf("%d", &x);
                insertEnd(x);
                break;
        case 3: printf("Position and value: ");
                scanf("%d %d", &pos, &x);
                insertAtPos(pos, x);
                break;
        case 4: deleteBegin();
                break;
        case 5: deleteEnd();
                break;
        case 6: printf("Position: ");
                scanf("%d", &pos);
                deleteAtPos(pos);
                break;
        case 7: displayForward();
                displayBackward();
                break;
        case 0: exit(0);
        default: printf("Wrong choice\\n");
        }
    }
    return 0;
}` }

</tbody>
</table>
<h4>Applications</h4>
<p>Music player (next/previous), browser back/forward, undo/redo.</p>`,
  exam15: `<div class="marks">Definition and diagram 2 + Node structure 1 + Insertion (3 cases) 3 + Deletion (3 cases) 3 + Traversal both ways 2 + Trace 2 + SLL vs DLL 2</div>
<h4>Q. Explain doubly linked list. Write a C program to insert and delete nodes at the beginning, end and a given position, and to traverse in both directions. Compare it with a singly linked list.</h4>
<h4>Definition</h4>
<div class="def">A doubly linked list is a linear data structure in which each node contains a data field and two pointers: prev, pointing to the previous node, and next, pointing to the next node.</div>
<h4>Diagram</h4>
<pre class="diagram">Node:  +------+------+------+
       | prev | data | next |
       +------+------+------+

         head
          |
          v
NULL &lt;- [10] &lt;=&gt; [20] &lt;=&gt; [30] -&gt; NULL</pre>
<h4>Explanation</h4>
<ul>
<li>head points to the first node; first node's prev is NULL; last node's next is NULL.</li>
<li><b>Insert at beginning:</b> newnode-&gt;next = head, head-&gt;prev = newnode, head = newnode.</li>
<li><b>Insert at end:</b> last-&gt;next = newnode, newnode-&gt;prev = last.</li>
<li><b>Insert at position:</b> go to node pos-1 (temp) and set four links: newnode-&gt;next, newnode-&gt;prev, temp-&gt;next-&gt;prev, temp-&gt;next, in that order.</li>
<li><b>Delete:</b> join the node's neighbours: prev-&gt;next = node-&gt;next and next-&gt;prev = node-&gt;prev, update head if it was the first node, then free it.</li>
<li><b>Backward traversal:</b> go to the last node, then follow prev.</li>
</ul>
<h4>Program</h4>
<pre class="code">#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;

struct node {
    struct node *prev;
    int data;
    struct node *next;
};

struct node *head = NULL;

struct node *getNode(int x)
{
    struct node *newnode;
    newnode = (struct node *)malloc(sizeof(struct node));
    if (newnode == NULL) {
        printf("Memory not available\\n");
        exit(1);
    }
    newnode-&gt;data = x;
    newnode-&gt;prev = NULL;
    newnode-&gt;next = NULL;
    return newnode;
}

void insertBegin(int x)
{
    struct node *newnode = getNode(x);
    if (head != NULL) {
        newnode-&gt;next = head;
        head-&gt;prev = newnode;
    }
    head = newnode;
}

void insertEnd(int x)
{
    struct node *newnode = getNode(x);
    struct node *temp = head;
    if (head == NULL) {
        head = newnode;
        return;
    }
    while (temp-&gt;next != NULL)
        temp = temp-&gt;next;
    temp-&gt;next = newnode;      /* old last -&gt; new */
    newnode-&gt;prev = temp;      /* new &lt;- old last */
}

/* New node becomes the node at position pos (1 = first) */
void insertAtPos(int pos, int x)
{
    struct node *newnode, *temp = head;
    int i;
    if (pos &lt; 1) {
        printf("Invalid position\\n");
        return;
    }
    if (pos == 1) {
        insertBegin(x);
        return;
    }
    for (i = 1; i &lt; pos - 1 &amp;&amp; temp != NULL; i++)
        temp = temp-&gt;next;    /* stop at node pos-1 */
    if (temp == NULL) {
        printf("Invalid position\\n");
        return;
    }
    newnode = getNode(x);
    newnode-&gt;next = temp-&gt;next;       /* 1 */
    newnode-&gt;prev = temp;             /* 2 */
    if (temp-&gt;next != NULL)
        temp-&gt;next-&gt;prev = newnode;   /* 3 */
    temp-&gt;next = newnode;             /* 4 */
}

void deleteBegin(void)
{
    struct node *temp = head;
    if (head == NULL) {
        printf("Underflow\\n");
        return;
    }
    head = head-&gt;next;
    if (head != NULL)
        head-&gt;prev = NULL;
    printf("Deleted %d\\n", temp-&gt;data);
    free(temp);
}

void deleteEnd(void)
{
    struct node *temp = head;
    if (head == NULL) {
        printf("Underflow\\n");
        return;
    }
    while (temp-&gt;next != NULL)
        temp = temp-&gt;next;
    if (temp-&gt;prev == NULL)       /* only one node */
        head = NULL;
    else
        temp-&gt;prev-&gt;next = NULL;
    printf("Deleted %d\\n", temp-&gt;data);
    free(temp);
}

void deleteAtPos(int pos)
{
    struct node *temp = head;
    int i;
    for (i = 1; i &lt; pos &amp;&amp; temp != NULL; i++)
        temp = temp-&gt;next;    /* node to delete */
    if (temp == NULL || pos &lt; 1) {
        printf("Invalid position\\n");
        return;
    }
    if (temp-&gt;prev != NULL)
        temp-&gt;prev-&gt;next = temp-&gt;next;
    else
        head = temp-&gt;next;    /* first node deleted */
    if (temp-&gt;next != NULL)
        temp-&gt;next-&gt;prev = temp-&gt;prev;
    printf("Deleted %d\\n", temp-&gt;data);
    free(temp);
}

void displayForward(void)
{
    struct node *temp = head;
    printf("Forward : ");
    while (temp != NULL) {
        printf("%d ", temp-&gt;data);
        temp = temp-&gt;next;
    }
    printf("\\n");
}

void displayBackward(void)
{
    struct node *temp = head;
    printf("Backward: ");
    if (head == NULL) {
        printf("\\n");
        return;
    }
    while (temp-&gt;next != NULL)    /* go to last node */
        temp = temp-&gt;next;
    while (temp != NULL) {        /* walk back using prev */
        printf("%d ", temp-&gt;data);
        temp = temp-&gt;prev;
    }
    printf("\\n");
}

int main(void)
{
    int ch, x, pos;
    while (1) {
        printf("\\n1.Insert begin   2.Insert end\\n");
        printf("3.Insert at pos  4.Delete begin\\n");
        printf("5.Delete end     6.Delete at pos\\n");
        printf("7.Display        0.Exit\\n");
        printf("Enter choice: ");
        if (scanf("%d", &amp;ch) != 1)
            break;
        switch (ch) {
        case 1: printf("Value: ");
                scanf("%d", &amp;x);
                insertBegin(x);
                break;
        case 2: printf("Value: ");
                scanf("%d", &amp;x);
                insertEnd(x);
                break;
        case 3: printf("Position and value: ");
                scanf("%d %d", &amp;pos, &amp;x);
                insertAtPos(pos, x);
                break;
        case 4: deleteBegin();
                break;
        case 5: deleteEnd();
                break;
        case 6: printf("Position: ");
                scanf("%d", &amp;pos);
                deleteAtPos(pos);
                break;
        case 7: displayForward();
                displayBackward();
                break;
        case 0: exit(0);
        default: printf("Wrong choice\\n");
        }
    }
    return 0;
}</pre>
<h4>Trace (verified by running the functions in this order)</h4>
<table>
<thead><tr><th>Operation</th><th>Output</th></tr></thead>
<tbody>
<tr><td>Create 10, 20, 30</td><td>Forward : 10 20 30; Backward: 30 20 10</td></tr>
<tr><td>Insert 5 at beginning</td><td>Forward : 5 10 20 30</td></tr>
<tr><td>Insert 40 at end</td><td>Forward : 5 10 20 30 40</td></tr>
<tr><td>Insert 25 at position 4</td><td>Forward : 5 10 20 25 30 40; Backward: 40 30 25 20 10 5</td></tr>
<tr><td>Delete from beginning</td><td>Deleted 5</td></tr>
<tr><td>Delete from end</td><td>Deleted 40</td></tr>
<tr><td>Delete at position 2</td><td>Deleted 20; Forward : 10 25 30; Backward: 30 25 10</td></tr>
</tbody>
</table>
<h4>Complexity</h4>
<table>
<thead><tr><th>Operation</th><th>Time</th></tr></thead>
<tbody>
<tr><td>Insert / delete at beginning</td><td>O(1)</td></tr>
<tr><td>Insert / delete at end or position</td><td>O(n)</td></tr>
<tr><td>Forward / backward traversal</td><td>O(n)</td></tr>
</tbody>
</table>
<h4>SLL vs DLL</h4>
<table>
<thead><tr><th>Feature</th><th>SLL</th><th>DLL</th></tr></thead>
<tbody>
<tr><td>Links per node</td><td>One (next)</td><td>Two (prev, next)</td></tr>
<tr><td>Direction</td><td>Forward only</td><td>Both directions</td></tr>
<tr><td>Memory</td><td>Less</td><td>More</td></tr>
<tr><td>Delete given node</td><td>O(n), need previous node</td><td>O(1)</td></tr>
<tr><td>Reverse printing</td><td>Needs reversal or recursion</td><td>Direct using prev</td></tr>
<tr><td>Implementation</td><td>Simpler</td><td>More pointer updates</td></tr>
<tr><td>Use</td><td>Stacks, simple lists</td><td>Music player, browser history, undo/redo</td></tr>
</tbody>
</table>
<h4>Advantages and disadvantages of DLL</h4>
<ul>
<li>Advantages: two-way traversal, O(1) delete when the node is known, easy insertion before a node.</li>
<li>Disadvantages: extra pointer per node, more complex code.</li>
</ul>`,

  id: "cll",
  unit: 22,
  title: "Circular Linked List",
  tagline: "The last node points back to the first, so the list never ends",
  minutes: 35,
  analogy: `<p>Think of friends sitting in a circle playing passing the parcel, or four cousins playing Ludo. After the last player's turn, the turn goes back to the first player. There is no "end" of the circle, only a place where you started.</p>
<p>A circular linked list works the same way. The last node does not point to NULL. It points back to the first node, so you can keep going round and round. That is perfect for anything that takes turns.</p>`,
  learn: `<h3>Definition</h3>
<div class="def">A circular linked list is a linked list in which the last node points back to the first node instead of NULL, so the nodes form a circle.</div>
<pre class="diagram">head
 |
 v
+----+---+  +----+---+  +----+---+
| 10 | --+-&gt;| 20 | --+-&gt;| 30 | --+-+
+----+---+  +----+---+  +----+---+ |
  ^                                |
  +--------------------------------+</pre>
<p>The node structure is the same as a singly linked list:</p>
<pre class="code">struct node {
    int data;
    struct node *next;
};
struct node *head = NULL;</pre>
<ul>
<li>Empty list: <code>head == NULL</code>.</li>
<li>One node: the node points to itself, <code>head-&gt;next == head</code>.</li>
<li>Last node: the node whose <code>next == head</code> (not NULL).</li>
</ul>
<p>There are two kinds:</p>
<ul>
<li><b>Circular singly linked list:</b> one next pointer per node, last node's next points to the first node. This is what we code here.</li>
<li><b>Circular doubly linked list:</b> each node has prev and next; the last node's next points to the first node and the first node's prev points to the last node.</li>
</ul>
<pre class="diagram">Circular doubly linked list:

  +-&gt; [10] &lt;=&gt; [20] &lt;=&gt; [30] &lt;-+
  |                            |
  +------- next / prev --------+
  30.next = 10     10.prev = 30</pre>

<h3>Why do we need it?</h3>
<ul>
<li>From any node you can reach every other node by going forward.</li>
<li>Natural for <b>round-robin</b> work: CPU scheduling gives each process a small time slice in turn, then goes back to the first.</li>
<li>No NULL check at the end while cycling; the list just keeps going.</li>
</ul>

<h3>Traversal: the do-while loop</h3>
<p>In a circular list there is no NULL to stop at. If we write <code>while (temp != head)</code> starting with <code>temp = head</code>, the condition is false immediately and nothing prints. So we use <b>do-while</b>: print first, then check if we are back at head.</p>
<pre class="code">temp = head;
do {
    printf("%d ", temp-&gt;data);
    temp = temp-&gt;next;
} while (temp != head);</pre>
<div class="trap">Using <code>while (temp != NULL)</code> on a circular list never stops (infinite loop), because no node points to NULL.</div>

<h3>Insertion</h3>
<p><b>At the beginning:</b> the new node must become the first, and the last node must now point to it.</p>
<pre class="code">find last (last-&gt;next == head)
newnode-&gt;next = head;
last-&gt;next = newnode;
head = newnode;</pre>
<pre class="diagram">Insert 5 at beginning of 10 20 30:

 +-&gt; 5 -&gt; 10 -&gt; 20 -&gt; 30 --+
 |                         |
 +-------------------------+
 head = 5, and 30 now points to 5</pre>
<p><b>At the end:</b> find the last node, link it to the new node, and make the new node point to head.</p>
<pre class="code">find last
last-&gt;next = newnode;
newnode-&gt;next = head;</pre>
<p>If the list is empty in either case, <code>head = newnode; newnode-&gt;next = head;</code> (the node points to itself).</p>

<h3>Deletion</h3>
<p><b>From the beginning:</b> if only one node, head becomes NULL. Otherwise find last, move head to <code>head-&gt;next</code>, set <code>last-&gt;next = head</code>, free the old first node.</p>
<p><b>From the end:</b> if only one node, head becomes NULL. Otherwise walk with prev and temp until <code>temp-&gt;next == head</code>, then <code>prev-&gt;next = head</code> and free temp.</p>
<p>Verified trace starting from 10 20 30:</p>
<table>
<thead><tr><th>Operation</th><th>List</th><th>Last node points to</th></tr></thead>
<tbody>
<tr><td>Start</td><td>10 20 30</td><td>10</td></tr>
<tr><td>Insert 5 at beginning</td><td>5 10 20 30</td><td>5</td></tr>
<tr><td>Insert 40 at end</td><td>5 10 20 30 40</td><td>5</td></tr>
<tr><td>Delete from beginning</td><td>10 20 30 40</td><td>10</td></tr>
<tr><td>Delete from end</td><td>10 20 30</td><td>10</td></tr>
</tbody>
</table>
<div class="tip">With only a head pointer, insertion at the beginning is O(n) here (unlike an ordinary SLL), because the last node must be found and updated. Many books keep a <code>last</code> (tail) pointer instead. Since <code>last-&gt;next</code> is the first node, both insert at beginning and insert at end become O(1).</div>

<h3>SLL vs DLL vs CLL</h3>
<table>
<thead><tr><th>Feature</th><th>SLL</th><th>DLL</th><th>CLL</th></tr></thead>
<tbody>
<tr><td>Pointers per node</td><td>1 (next)</td><td>2 (prev, next)</td><td>1 (next)</td></tr>
<tr><td>Last node's next</td><td>NULL</td><td>NULL</td><td>First node</td></tr>
<tr><td>Direction</td><td>Forward</td><td>Both</td><td>Forward, round and round</td></tr>
<tr><td>Traversal stops when</td><td>temp == NULL</td><td>temp == NULL</td><td>back at head (do-while)</td></tr>
<tr><td>Memory</td><td>Least</td><td>Most</td><td>Same as SLL</td></tr>
<tr><td>Reach every node from any node</td><td>No</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Typical use</td><td>Stacks, simple lists</td><td>Music player, browser</td><td>Round robin, turns, repeat playlist</td></tr>
</tbody>
</table>

<h3>Applications</h3>
<ul>
<li><b>Round-robin CPU scheduling:</b> processes sit in a circle; each gets a time slice and the scheduler moves to the next; finished processes are removed from the circle.</li>
<li><b>Multiplayer games:</b> turns pass player 1, 2, 3, 4, then back to 1.</li>
<li><b>Music playlist on repeat:</b> after the last song, the first plays again.</li>
<li><b>Circular buffers and circular queues</b> implemented with lists.</li>
</ul>
<p><b>Disadvantages:</b> easy to create infinite loops if the stopping condition is wrong; finding the last node is O(n) without a tail pointer.</p>`,

#include <stdlib.h>

/* Each node is a process waiting for the CPU */
struct proc {
    char name[4];
    int left;              /* burst time still needed */
    struct proc *next;
};

int main(void)
{
    char *names[3] = {"P1", "P2", "P3"};
    int burst[3] = {5, 3, 1};
    int q = 2, t = 0, run, i;
    struct proc *head = NULL, *last = NULL, *cur, *prev, *p;

    for (i = 0; i < 3; i++) {          /* build the circle */
        p = (struct proc *)malloc(sizeof(struct proc));
        if (p == NULL)
            return 1;
        sprintf(p->name, "%s", names[i]);
        p->left = burst[i];
        if (head == NULL)
            head = p;
        else
            last->next = p;
        last = p;
        last->next = head;              /* close the circle */
    }

    cur = head;
    prev = last;
    while (cur != NULL) {
        run = (cur->left < q) ? cur->left : q;
        printf("%s runs %d to %d\\n", cur->name, t, t + run);
        t = t + run;
        cur->left = cur->left - run;
        if (cur->left == 0) {           /* finished: remove node */
            printf("  %s finished at %d\\n", cur->name, t);
            if (cur->next == cur) {     /* it was the last one */
                free(cur);
                cur = NULL;
            } else {
                prev->next = cur->next;
                free(cur);
                cur = prev->next;
            }
        } else {                        /* go to next in circle */
            prev = cur;
            cur = cur->next;
        }
    }
    return 0;
}` }

 |
 v

<li><b>Insert at end:</b> walk to last; last-&gt;next = newnode. O(n)</li>
<li><b>Delete at beginning:</b> temp = head; head = head-&gt;next; free(temp). O(1)</li>
<li><b>Delete at end:</b> walk prev, temp to last; prev-&gt;next = NULL; free(temp). O(n)</li>
</ul>
<h4>2. Doubly linked list (DLL)</h4>
<div class="def">Each node has data and two pointers, prev and next; the first node's prev and the last node's next are NULL.</div>
<pre class="diagram">head
 |
 v
NULL&lt;-[10]&lt;=&gt;[20]&lt;=&gt;[30]-&gt;NULL</pre>
<pre class="code">struct node {
    struct node *prev;
    int data;
    struct node *next;
};</pre>
<ul>
<li><b>Insert at beginning:</b> newnode-&gt;next = head; head-&gt;prev = newnode; head = newnode. O(1)</li>
<li><b>Insert at end:</b> walk to last; last-&gt;next = newnode; newnode-&gt;prev = last. O(n)</li>
<li><b>Delete at beginning:</b> head = head-&gt;next; if head != NULL, head-&gt;prev = NULL; free old first. O(1)</li>
<li><b>Delete at end:</b> walk to last; last-&gt;prev-&gt;next = NULL; free(last). O(n)</li>
<li><b>Delete a known node p:</b> p-&gt;prev-&gt;next = p-&gt;next; p-&gt;next-&gt;prev = p-&gt;prev. O(1)</li>
</ul>
<h4>3. Circular linked list (CLL)</h4>
<div class="def">A linked list in which the last node points back to the first node instead of NULL.</div>
<pre class="diagram">   head
    |
    v
+-&gt;[10|o]-&gt;[20|o]-&gt;[30|o]-+
|                         |
+-------------------------+</pre>

  unit: 23,
  title: "Stack",
  tagline: "Last in, first out: the plate on top always leaves first",
  minutes: 25,
  analogy: `<p>Think of the stack of steel plates at a wedding buffet. The caterer puts each washed plate on <b>top</b> of the pile, and every guest also takes a plate from the <b>top</b>. Nobody pulls a plate out from the middle or the bottom. The plate that went in last comes out first, and the very first plate (at the bottom) comes out last.</p>
<p>That rule, <b>Last In, First Out</b>, is all a stack is. You already use it every day: when you press Ctrl+Z in a document, the most recent thing you typed is undone first.</p>`,
  learn: `<h3>What is a stack?</h3>
<p>A <b>data structure</b> is simply a way of storing data in memory so that we can use it efficiently. A <b>linear</b> data structure keeps items one after another, like beads on a string.</p>
<div class="def">A stack is a linear data structure in which insertion and deletion happen at only one end, called the <b>top</b>. It follows the LIFO (Last In, First Out) principle.</div>
<p>Because only the top is reachable, the item added most recently is always the first one removed.</p>

<h3>The words you must know</h3>
<ul>
<li><b>top</b>: a variable that tells us where the last inserted item is. In an array stack, <code>top</code> is an index. <code>top = -1</code> means the stack is empty.</li>
<li><b>push(x)</b>: insert item <code>x</code> on the top.</li>
<li><b>pop()</b>: remove the top item and return it.</li>
<li><b>peek()</b> (also called <b>top()</b>): look at the top item without removing it.</li>
<li><b>isEmpty()</b>: true when there is nothing in the stack (<code>top == -1</code>).</li>
<li><b>isFull()</b>: true when the array has no free place (<code>top == MAX-1</code>).</li>
<li><b>Overflow</b>: trying to push when the stack is full. It is an error.</li>
<li><b>Underflow</b>: trying to pop (or peek) when the stack is empty. It is also an error.</li>
<li><b>MAX</b>: the size of the array, written in C as <code>#define MAX 5</code>.</li>
</ul>

<h3>Picture of a stack</h3>
<pre class="diagram">     push        pop
       |          ^
       v          |
     +--------------+
top-&gt;|      30      |  stack[2]
     +--------------+
     |      20      |  stack[1]
     +--------------+
     |      10      |  stack[0]
     +--------------+
     (10 went in first, 30 last)</pre>
<p>Here 10, 20, 30 were pushed in that order. <code>top = 2</code>. A pop now returns 30.</p>

<h3>Stack using an array</h3>
<p>We take an array <code>int stack[MAX];</code> and an integer <code>top = -1</code>.</p>
<p><b>Push:</b> first check for overflow. If <code>top == MAX-1</code> every place is used, so print "Overflow". Otherwise move <code>top</code> up by one and store the item: <code>stack[++top] = x;</code>. The <code>++</code> is written before <code>top</code> because <code>top</code> starts at -1 and the first item must go into <code>stack[0]</code>.</p>
<p><b>Pop:</b> first check for underflow. If <code>top == -1</code> there is nothing to remove. Otherwise take the top item and move <code>top</code> down: <code>x = stack[top--];</code>. The old value is still in memory, but it is no longer part of the stack because <code>top</code> has moved below it.</p>
<pre class="code">PUSH(x):
1. if top == MAX-1: print "Overflow", stop
2. top = top + 1
3. stack[top] = x

POP():
1. if top == -1: print "Underflow", stop
2. x = stack[top]
3. top = top - 1
4. return x</pre>

<h3>Watch it happen (MAX = 5)</h3>
<table><thead><tr><th>Operation</th><th>top</th><th>Stack (bottom to top)</th><th>Result</th></tr></thead><tbody><tr><td>push(10)</td><td>0</td><td>10</td><td>pushed 10</td></tr><tr><td>push(20)</td><td>1</td><td>10 20</td><td>pushed 20</td></tr><tr><td>push(30)</td><td>2</td><td>10 20 30</td><td>pushed 30</td></tr><tr><td>pop()</td><td>1</td><td>10 20</td><td>returns 30</td></tr><tr><td>peek()</td><td>1</td><td>10 20</td><td>returns 20</td></tr><tr><td>push(40)</td><td>2</td><td>10 20 40</td><td>pushed 40</td></tr><tr><td>push(50)</td><td>3</td><td>10 20 40 50</td><td>pushed 50</td></tr><tr><td>push(60)</td><td>4</td><td>10 20 40 50 60</td><td>pushed 60</td></tr><tr><td>push(70)</td><td>4</td><td>10 20 40 50 60</td><td>Overflow! 70 not pushed</td></tr></tbody></table>
<p>Notice two things. After the pop, 30 is gone and 40 later takes its place. And the push of 70 fails because <code>top</code> is already 4, which is <code>MAX-1</code>.</p>
<p>Underflow looks like this:</p>
<table><thead><tr><th>Operation</th><th>top</th><th>Stack (bottom to top)</th><th>Result</th></tr></thead><tbody><tr><td>push(5)</td><td>0</td><td>5</td><td>pushed 5</td></tr><tr><td>pop()</td><td>-1</td><td>(empty)</td><td>returns 5</td></tr><tr><td>pop()</td><td>-1</td><td>(empty)</td><td>Underflow!</td></tr></tbody></table>

<h3>Stack using a linked list</h3>
<p>A <b>linked list</b> is a chain of nodes where each node holds data and a pointer (address) to the next node. We create nodes with <code>malloc</code> while the program runs, so there is no fixed MAX.</p>
<p>The trick: treat the <b>head of the list as the top</b>. Push = insert a new node at the beginning. Pop = delete the first node. Both take the same tiny amount of work however long the list is.</p>
<pre class="diagram">After push 10, push 20, push 30:

top

#include <stdio.h>
#include <stdlib.h>

struct node {
    int data;
    struct node *next;
};

/* NULL means the stack is empty */
struct node *top = NULL;

void push(int x)
{
    struct node *newnode;
    newnode = (struct node *)
              malloc(sizeof(struct node));
    if (newnode == NULL) { /* heap memory is full */
        printf("Stack Overflow (no memory)\\n");
        return;
    }
    newnode->data = x;
    /* new node points to old top */
    newnode->next = top;
    top = newnode; /* new node becomes the top */
}

int pop()
{
    struct node *temp;
    int x;
    if (top == NULL) {
        printf("Stack Underflow!\\n");
        return -1;
    }
    temp = top;
    x = temp->data;
    top = top->next; /* second node becomes top */
    free(temp);
    return x;
}

int peek()
{
    if (top == NULL) {
        printf("Stack is empty\\n");
        return -1;
    }
    return top->data;
}

void display()
{
    struct node *p = top;
    if (p == NULL) {
        printf("Stack is empty\\n");
        return;
    }
    printf("Stack (top to bottom): ");
    while (p != NULL) {
        printf("%d ", p->data);
        p = p->next;
    }
    printf("\\n");
}

int main()
{
    push(10);
    push(20);
    push(30);
    display();                       /* 30 20 10 */
    printf("Popped %d\\n", pop());    /* 30 */
    printf("Top is %d\\n", peek());   /* 20 */
    display();                       /* 20 10 */
    return 0;
}` },

DSA.topics.push({
  id: "queue",
  unit: 23,
  title: "Queue",
  tagline: "First come, first served, just like the ration shop line",
  minutes: 20,
  analogy: `<p>Picture the line at a ration shop or a railway ticket counter. A new person always joins at the <b>back</b> of the line. The shopkeeper always serves the person at the <b>front</b>. Nobody jumps in the middle. Whoever came first gets served first.</p>
<p>A queue in programming follows the same rule: <b>First In, First Out</b>. The back of the line is called <b>rear</b> and the front is called <b>front</b>.</p>`,
  learn: `<h3>What is a queue?</h3>
<div class="def">A queue is a linear data structure in which insertion is done at one end called the <b>rear</b> and deletion is done at the other end called the <b>front</b>. It follows the FIFO (First In, First Out) principle.</div>
<p>Compare with a stack: a stack uses one end for everything (LIFO). A queue uses two different ends (FIFO).</p>

<h3>The words you must know</h3>
<ul>
<li><b>front</b>: index (or pointer) of the first element, the next one to be removed.</li>
<li><b>rear</b>: index (or pointer) of the last element, the most recently added one.</li>
<li><b>enqueue(x)</b>: insert x at the rear.</li>
<li><b>dequeue()</b>: remove and return the element at the front.</li>
<li><b>Overflow</b>: enqueue when there is no place left. <b>Underflow</b>: dequeue when the queue is empty.</li>
</ul>
<pre class="diagram">      +----+----+----+
 out  | 10 | 20 | 30 |  in
 &lt;--  +----+----+----+  &lt;--
        ^         ^
      front      rear

dequeue() removes 10 (front)
enqueue(40) adds after 30 (rear)</pre>

<h3>Queue using an array</h3>
<p>We use <code>int queue[MAX];</code> and two integers <code>front = -1, rear = -1</code>. Both -1 means the queue is empty.</p>
<pre class="code">ENQUEUE(x):
1. if rear == MAX-1: print "Overflow", stop
2. if front == -1: front = 0     (first element)
3. rear = rear + 1
4. queue[rear] = x

DEQUEUE():
1. if front == -1 or front &gt; rear:
       print "Underflow", stop
2. x = queue[front]
3. front = front + 1
4. return x</pre>
<p>Why <code>front &gt; rear</code> in the underflow check? After the last element is removed, <code>front</code> moves one place beyond <code>rear</code>. For example after enqueue(10) and dequeue(), front = 1 and rear = 0. Nothing is left between them, so the queue is empty.</p>

<h3>The big problem with the array queue</h3>
<p>Watch this trace with <code>MAX = 5</code>. An underscore <code>_</code> means a slot that is no longer part of the queue.</p>
<table><thead><tr><th>Operation</th><th>front</th><th>rear</th><th>q[0] .. q[4]</th></tr></thead><tbody><tr><td>start</td><td>-1</td><td>-1</td><td>[_ | _ | _ | _ | _]</td></tr><tr><td>enqueue(10)</td><td>0</td><td>0</td><td>[10 | _ | _ | _ | _]</td></tr><tr><td>enqueue(20)</td><td>0</td><td>1</td><td>[10 | 20 | _ | _ | _]</td></tr><tr><td>enqueue(30)</td><td>0</td><td>2</td><td>[10 | 20 | 30 | _ | _]</td></tr><tr><td>enqueue(40)</td><td>0</td><td>3</td><td>[10 | 20 | 30 | 40 | _]</td></tr><tr><td>enqueue(50)</td><td>0</td><td>4</td><td>[10 | 20 | 30 | 40 | 50]</td></tr><tr><td>dequeue() gives 10</td><td>1</td><td>4</td><td>[_ | 20 | 30 | 40 | 50]</td></tr><tr><td>dequeue() gives 20</td><td>2</td><td>4</td><td>[_ | _ | 30 | 40 | 50]</td></tr><tr><td>enqueue(60): OVERFLOW</td><td>2</td><td>4</td><td>[_ | _ | 30 | 40 | 50]</td></tr></tbody></table>
<p>Look at the last row. <b>Two slots at the front (q[0] and q[1]) are empty</b>, yet enqueue(60) says Overflow, because the only test is <code>rear == MAX-1</code> and rear can only move forward. Space freed by dequeues is never used again. This wasted space is the main drawback of the simple (linear) queue.</p>
<div class="tip">The fix is the <b>circular queue</b>: when rear reaches the end, it wraps back to index 0. That is the next topic.</div>

<h3>Queue using a linked list</h3>
<p>Keep two pointers: <code>front</code> (first node) and <code>rear</code> (last node). Enqueue adds a node after <code>rear</code>. Dequeue removes the node at <code>front</code>. No space is wasted and there is no fixed size.</p>
<pre class="diagram">front                  rear
  |                      |
  v                      v
[10| ]--&gt;[20| ]--&gt;[30|NULL]

enqueue(40):
 rear-&gt;next = newnode; rear = newnode
dequeue():
 temp = front; front = front-&gt;next;
 free(temp)</pre>
<ul>
<li>Empty: <code>front == NULL</code>.</li>
<li>When the first node is added, both <code>front</code> and <code>rear</code> point to it.</li>
<li>When the last node is removed, set <code>rear = NULL</code> too.</li>
</ul>

<h3>Types of queues</h3>
<ul>
<li><b>Simple (linear) queue</b>: insert at rear, delete at front. Has the wasted space problem in an array.</li>
<li><b>Circular queue</b>: the last position is connected back to the first, so freed space is reused.</li>
<li><b>Priority queue</b>: every element has a priority. The element with the highest priority is removed first. Equal priorities are served in arrival order. Example: emergency patients in a hospital.</li>
<li><b>Deque (double ended queue)</b>: insertion and deletion allowed at <b>both</b> ends.
  <ul>
  <li><b>Input restricted deque</b>: insertion at only one end, deletion at both ends.</li>
  <li><b>Output restricted deque</b>: deletion at only one end, insertion at both ends.</li>
  </ul>
</li>
</ul>
<pre class="diagram">Deque:
 insert/delete      insert/delete
      &lt;--&gt; [ 10 | 20 | 30 ] &lt;--&gt;
          front          rear</pre>

<h3>Stack vs Queue</h3>
<table><thead><tr><th>Point</th><th>Stack</th><th>Queue</th></tr></thead><tbody>
<tr><td>Principle</td><td>LIFO</td><td>FIFO</td></tr>
<tr><td>Ends used</td><td>One end (top)</td><td>Two ends (front, rear)</td></tr>
<tr><td>Insert</td><td>push at top</td><td>enqueue at rear</td></tr>
<tr><td>Delete</td><td>pop from top</td><td>dequeue from front</td></tr>
<tr><td>Pointers</td><td>top</td><td>front and rear</td></tr>
<tr><td>Empty (array)</td><td>top == -1</td><td>front == -1 or front &gt; rear</td></tr>
<tr><td>Example</td><td>Pile of plates</td><td>Ticket counter line</td></tr>
<tr><td>Uses</td><td>Recursion, undo</td><td>Printer, CPU scheduling, BFS</td></tr>
</tbody></table>

<h3>Time and space</h3>
<p>enqueue and dequeue are <b>O(1)</b> in both the array and the linked list version (we always know where front and rear are). Display is O(n). Space is O(n).</p>

<h3>Applications of queues</h3>
<ul>
<li>Printer spooling: print jobs are printed in the order they arrive.</li>
<li>CPU scheduling (first come first served, round robin).</li>
<li>Breadth First Search (BFS) of a graph or level order traversal of a tree.</li>
<li>Call centre hold lines, ticket booking, keyboard buffer.</li>
<li>Data transfer between devices running at different speeds (buffers).</li>
</ul>`,

#include <stdio.h>
#define MAX 5

int queue[MAX];
/* -1 means the queue is empty */
int front = -1, rear = -1;

void enqueue(int x)
{
    if (rear == MAX - 1) {
        printf("Queue Overflow! Cannot insert %d\\n", x);
        return;

    if (front == -1)           /* first element */
        front = 0;
    queue[++rear] = x;
    printf("%d inserted\\n", x);
}

int dequeue()
{
    if (front == -1 || front > rear) {
        printf("Queue Underflow!\\n");
        return -1;
    }
    /* take from front, move front ahead */
    return queue[front++];

        return;

    { title: "Queue using linked list", src: `/* Queue using a linked list */
#include <stdio.h>
#include <stdlib.h>

struct node {
    int data;
    struct node *next;
};

struct node *front = NULL, *rear = NULL;

void enqueue(int x)
{
    struct node *newnode;
    newnode = (struct node *)
              malloc(sizeof(struct node));
    if (newnode == NULL) {
        printf("Queue Overflow (no memory)\\n");
        return;
    }
    newnode->data = x;
    newnode->next = NULL;
    if (rear == NULL)            /* queue was empty */
        front = rear = newnode;
    else {
        /* link after the last node */
        rear->next = newnode;
        rear = newnode;
    }
}

int dequeue()
{
    struct node *temp;
    int x;
    if (front == NULL) {
        printf("Queue Underflow!\\n");
        return -1;
    }
    temp = front;
    x = temp->data;
    front = front->next;
    if (front == NULL) /* queue became empty */
        rear = NULL;
    free(temp);
    return x;
}

void display()
{
    struct node *p = front;
    if (p == NULL) {
        printf("Queue is empty\\n");
        return;
    }
    printf("Queue (front to rear): ");
    while (p != NULL) {
        printf("%d ", p->data);
        p = p->next;
    }
    printf("\\n");
}

int main()
{
    enqueue(10);
    enqueue(20);
    enqueue(30);
    display();                          /* 10 20 30 */
    printf("Deleted %d\\n", dequeue());  /* 10 */
    display();                          /* 20 30 */
    return 0;
}` }

  title: "Circular Queue",
  tagline: "Bend the queue into a ring so no seat is ever wasted",
  minutes: 25,
  analogy: `<p>Think of a giant wheel (Ferris wheel) at a village fair with 5 cabins. People get into whichever cabin comes to the loading point, and when a cabin comes round again, the people who got in first get out first. After cabin 5 comes cabin 1 again. No cabin is ever thrown away just because it was used once.</p>
<p>A circular queue does the same with array slots: after the last index it goes back to index 0, so slots freed by dequeue are used again.</p>`,
  learn: `<h3>Why do we need a circular queue?</h3>
<p>In a simple array queue, <code>rear</code> only moves forward. Once <code>rear == MAX-1</code> the queue says Overflow, even if dequeues have emptied the slots at the front. With MAX = 5, after enqueue 10, 20, 30, 40, 50 and two dequeues, slots 0 and 1 are free but enqueue(60) still fails. That is wasted memory.</p>
<div class="def">A circular queue is a linear queue in which the last position is connected back to the first position, forming a circle. When rear (or front) reaches the end of the array, it wraps around to index 0, so freed space is reused. It still follows FIFO.</div>

<h3>The trick: modulo (%)</h3>
<p><code>a % b</code> gives the remainder when a is divided by b. If the array size is <code>N = 5</code>, then moving to the next index is written <code>(i + 1) % N</code>:</p>
<table><thead><tr><th>i</th><th>(i + 1) % 5</th></tr></thead><tbody>
<tr><td>0</td><td>1</td></tr>
<tr><td>1</td><td>2</td></tr>
<tr><td>2</td><td>3</td></tr>
<tr><td>3</td><td>4</td></tr>
<tr><td>4</td><td>0 (wraps back)</td></tr>
</tbody></table>
<p>So the index after 4 is 0. That single line turns a straight array into a ring.</p>
<pre class="diagram">          q[0]
         +----+
   q[4]  |    |  q[1]
  +----+ +----+ +----+
  |    |        |    |
  +----+        +----+
    +----+    +----+
    |    |    |    |
    +----+    +----+
     q[3]      q[2]

 0 -&gt; 1 -&gt; 2 -&gt; 3 -&gt; 4 -&gt; back to 0</pre>

<h3>Empty and full conditions (learn these exactly)</h3>
<ul>
<li>Start: <code>front = rear = -1</code>.</li>
<li><b>Empty</b>: <code>front == -1</code>.</li>
<li><b>Full</b>: <code>(rear + 1) % N == front</code>. In words: the next place after rear is the front, so there is no free place.</li>
</ul>
<p>Two full cases with N = 5: front = 0, rear = 4 gives (4+1)%5 = 0 = front, full. Also front = 2, rear = 1 gives (1+1)%5 = 2 = front, full.</p>

<h3>Algorithms</h3>
<pre class="code">ENQUEUE(x):
1. if (rear + 1) % N == front: print "Overflow", stop
2. if front == -1: front = 0
3. rear = (rear + 1) % N
4. q[rear] = x

DEQUEUE():
1. if front == -1: print "Underflow", stop
2. x = q[front]
3. if front == rear:        (only one element was left)
       front = rear = -1    (queue becomes empty)
   else:
       front = (front + 1) % N
4. return x</pre>
<div class="trap">Do not forget step 3 of dequeue. When the last element leaves, reset <code>front = rear = -1</code>. Otherwise the empty test <code>front == -1</code> would never become true.</div>

<h3>Full trace with N = 5</h3>
<p>An underscore <code>_</code> means a slot that is not part of the queue (the old number may still sit in memory, but front and rear no longer include it).</p>
<table><thead><tr><th>Operation</th><th>front</th><th>rear</th><th>q[0] .. q[4]</th></tr></thead><tbody><tr><td>start</td><td>-1</td><td>-1</td><td>[_ | _ | _ | _ | _]</td></tr><tr><td>enqueue(10)</td><td>0</td><td>0</td><td>[10 | _ | _ | _ | _]</td></tr><tr><td>enqueue(20)</td><td>0</td><td>1</td><td>[10 | 20 | _ | _ | _]</td></tr><tr><td>enqueue(30)</td><td>0</td><td>2</td><td>[10 | 20 | 30 | _ | _]</td></tr><tr><td>enqueue(40)</td><td>0</td><td>3</td><td>[10 | 20 | 30 | 40 | _]</td></tr><tr><td>enqueue(50)</td><td>0</td><td>4</td><td>[10 | 20 | 30 | 40 | 50]</td></tr><tr><td>dequeue() gives 10</td><td>1</td><td>4</td><td>[_ | 20 | 30 | 40 | 50]</td></tr><tr><td>dequeue() gives 20</td><td>2</td><td>4</td><td>[_ | _ | 30 | 40 | 50]</td></tr><tr><td>enqueue(60)</td><td>2</td><td>0</td><td>[60 | _ | 30 | 40 | 50]</td></tr><tr><td>enqueue(70)</td><td>2</td><td>1</td><td>[60 | 70 | 30 | 40 | 50]</td></tr><tr><td>enqueue(80): OVERFLOW</td><td>2</td><td>1</td><td>[60 | 70 | 30 | 40 | 50]</td></tr><tr><td>dequeue() gives 30</td><td>3</td><td>1</td><td>[60 | 70 | _ | 40 | 50]</td></tr></tbody></table>
<p>The key rows: enqueue(60) puts 60 in <b>q[0]</b> because <code>(4+1) % 5 = 0</code>. That is the reuse a linear queue cannot do. After 70, <code>(1+1) % 5 = 2 = front</code>, so enqueue(80) is a true Overflow: all 5 slots hold queue elements.</p>
<pre class="diagram">State after enqueue(70):

  index:  0    1    2    3    4
        +----+----+----+----+----+
        | 60 | 70 | 30 | 40 | 50 |
        +----+----+----+----+----+
               ^    ^
             rear  front

FIFO order: 30, 40, 50, 60, 70</pre>
<p>Emptying the queue, so you see the reset:</p>
<table><thead><tr><th>Operation</th><th>front</th><th>rear</th><th>q[0] .. q[4]</th></tr></thead><tbody><tr><td>start</td><td>-1</td><td>-1</td><td>[_ | _ | _ | _ | _]</td></tr><tr><td>enqueue(7)</td><td>0</td><td>0</td><td>[7 | _ | _ | _ | _]</td></tr><tr><td>enqueue(8)</td><td>0</td><td>1</td><td>[7 | 8 | _ | _ | _]</td></tr><tr><td>dequeue() gives 7</td><td>1</td><td>1</td><td>[_ | 8 | _ | _ | _]</td></tr><tr><td>dequeue() gives 8</td><td>-1</td><td>-1</td><td>[_ | _ | _ | _ | _]</td></tr><tr><td>dequeue(): UNDERFLOW</td><td>-1</td><td>-1</td><td>[_ | _ | _ | _ | _]</td></tr></tbody></table>

<h3>How many elements are in it?</h3>
<p>If the queue is not empty: <code>count = (rear - front + N) % N + 1</code>. For front = 2, rear = 1, N = 5: (1 - 2 + 5) % 5 + 1 = 4 + 1 = 5, so it is full.</p>

<h3>Displaying a circular queue</h3>
<p>Start at <code>front</code>, print, and keep moving with <code>i = (i + 1) % N</code> until you have printed <code>q[rear]</code>.</p>

<h3>Linear queue vs circular queue</h3>
<table><thead><tr><th>Point</th><th>Linear queue</th><th>Circular queue</th></tr></thead><tbody>
<tr><td>Shape</td><td>Straight line</td><td>Last slot joined to first</td></tr>
<tr><td>Next index</td><td>rear + 1</td><td>(rear + 1) % N</td></tr>
<tr><td>Full when</td><td>rear == MAX-1</td><td>(rear + 1) % N == front</td></tr>
<tr><td>Empty when</td><td>front == -1 or front &gt; rear</td><td>front == -1</td></tr>
<tr><td>Freed space</td><td>Wasted</td><td>Reused</td></tr>
<tr><td>Memory use</td><td>Poor</td><td>Efficient</td></tr>
</tbody></table>
<div class="tip">Some textbooks start with <code>front = rear = 0</code> and keep one slot always empty (empty when <code>front == rear</code>, full when <code>(rear+1) % N == front</code>, so only N-1 slots are used). Both are correct. Pick one and stay consistent. This site uses <code>front = rear = -1</code> with all N slots usable.</div>

<h3>Time and space</h3>
<p>enqueue and dequeue: <b>O(1)</b>. Display: O(n). Space: O(N) for the array.</p>

<h3>Applications</h3>
<ul>
<li><b>Round robin CPU scheduling</b>: processes take turns; an unfinished process goes back to the rear.</li>
<li><b>Traffic signal control</b>: green moves North, East, South, West, then back to North.</li>
<li><b>Buffers</b>: keyboard buffer, audio/video streaming buffer, printer buffer.</li>
<li>Memory management where a fixed block of memory is reused again and again.</li>
</ul>`,

#include <stdio.h>
#define N 5

int q[N];
int front = -1, rear = -1;

int isEmpty() { return front == -1; }
int isFull()  { return (rear + 1) % N == front; }

void enqueue(int x)
{
    if (isFull()) {
        printf("Queue Overflow! Cannot insert %d\\n", x);
        return;
    }
    if (front == -1)             /* first element */
        front = 0;
    rear = (rear + 1) % N; /* wrap around after N-1 */

    printf("%d inserted at q[%d]\\n", x, rear);
}

int dequeue()
{
    int x;
    if (isEmpty()) {
        printf("Queue Underflow!\\n");
        return -1;
    }
    x = q[front];
    if (front == rear) /* it was the only element */
        front = rear = -1;
    else
        front = (front + 1) % N;
    return x;
}

void display()
{
    int i;
    if (isEmpty()) {
        printf("Queue is empty\\n");
        return;

    printf("Queue (front to rear): ");
    i = front;
    while (1) {
        printf("%d ", q[i]);

        i = (i + 1) % N;

}

            break;
        case 3:
            display();
            break;
        case 4:
            return 0;
        default:
            printf("Invalid choice\\n");
        }
    }
    return 0;
}` }

<h4>1. Queue</h4>
<div class="def">A queue is a linear data structure in which insertion (enqueue) is done at the REAR and deletion (dequeue) is done at the FRONT. It follows FIFO (First In, First Out).</div>
<pre class="diagram">      +----+----+----+
 out  | 10 | 20 | 30 |  in
 &lt;--  +----+----+----+  &lt;--
        ^         ^
      front      rear</pre>
<p>Real life: a line at a ticket counter.</p>

<h4>2. Linear queue using an array</h4>
<p><code>int queue[MAX]; int front = -1, rear = -1;</code></p>
<pre class="code">ENQUEUE(x)
Step 1: if rear == MAX-1 then print "Overflow", exit
Step 2: if front == -1 then front = 0
Step 3: rear = rear + 1
Step 4: queue[rear] = x

DEQUEUE()
Step 1: if front == -1 or front &gt; rear then
          print "Underflow", exit
Step 2: x = queue[front]
Step 3: front = front + 1
Step 4: return x</pre>
<pre class="code">void enqueue(int x)
{
    if (rear == MAX - 1) {
        printf("Queue Overflow! Cannot insert %d\\n", x);
        return;

    if (front == -1)           /* first element */
        front = 0;
    queue[++rear] = x;

}

int dequeue()
{
    if (front == -1 || front &gt; rear) {
        printf("Queue Underflow!\\n");
        return -1;
    }
    /* take from front, move front ahead */
    return queue[front++];
}</pre>

<h4>3. Drawback of the linear queue (MAX = 5)</h4>

<p>Order: <b>P1, P2, P3, P1, P2, P1</b>. P3 finishes at 5 ms, P2 at 8 ms, P1 at 9 ms.</p>`
